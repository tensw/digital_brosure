name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKKU_POOL_ADMIN_ID: ${{ secrets.SKKU_POOL_ADMIN_ID }}
          SKKU_POOL_ADMIN_PW: ${{ secrets.SKKU_POOL_ADMIN_PW }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY,SKKU_POOL_ADMIN_ID,SKKU_POOL_ADMIN_PW
          script: |
            set -e
            cd /home/ubuntu/digital_brosure

            # BK21 보드(17MB)는 공개 저장소에 두지 않는다.
            # 깃이 모르는 파일이라 reset --hard 가 지운다.
            # 배포 앞에서 따로 보관했다가 뒤에 제자리로 돌려놓는다.
            KEEP=/home/ubuntu/bk21-keep
            BOARD=v2/bk21/board/index.html
            mkdir -p "$KEEP"
            if [ -f "$BOARD" ]; then
              cp -f "$BOARD" "$KEEP/index.html"
              echo "[bk21] 보관함에 넣음 $(stat -c%s "$KEEP/index.html") bytes"
            else
              echo "[bk21] 작업트리에 보드 없음"
            fi

            git fetch origin main
            git reset --hard origin/main

            mkdir -p v2/bk21/board
            if [ -f "$KEEP/index.html" ]; then
              cp -f "$KEEP/index.html" "$BOARD"
              echo "[bk21] 제자리로 되돌림"
            fi

            if [ -f "$BOARD" ]; then
              echo "[bk21] 최종 $(stat -c%s "$BOARD") bytes  $(stat -c%y "$BOARD")"
            else
              echo "[bk21] 최종 보드 없음 — 화면이 안 뜬다"
            fi

            # 사람 단위 답변용 people.json. 보드 html 에 박힌 데이터에서 서버가 직접 만든다.
            # 깃 밖 파일이고 /bk21 로그인 문 뒤에서만 읽힌다. 실패해도 배포는 멈추지 않는다(사람 질문만 안 된다).
            PEOPLE=v2/bk21/board/people.json
            if [ -f "$BOARD" ]; then
              node v2/bk21/board/_src/spec/build_people.js "$BOARD" "$PEOPLE" \
                && echo "[bk21] people.json $(stat -c%s "$PEOPLE") bytes" \
                || echo "[bk21] people.json 생성 실패 — 사람 질문이 안 된다"
            fi

            # BK21 질문 라우팅 키. 깃 밖 파일이라 reset --hard 에 안 지워지지만,
            # 새 서버에서도 따라가도록 GitHub 시크릿에서 매 배포마다 쓴다.
            if [ -n "$GEMINI_API_KEY" ]; then
              umask 077
              printf '{"GEMINI_API_KEY":"%s"}' "$GEMINI_API_KEY" > .bk21-secrets.json
              chmod 600 .bk21-secrets.json
              echo "[bk21] 키 파일 씀 $(stat -c'%a %s' .bk21-secrets.json) (perm bytes)"
            else
              echo "[bk21] GEMINI_API_KEY 시크릿 없음 — 키 파일 건너뜀"
            fi

            # 미래 연구 관리 풀(/skku/future_research_pool). DB 는 깃 밖 .skku-pool/ 에 있다.
            # node:sqlite 를 쓰므로 Node 22.13 이상이 필요하다. 버전을 남겨 둔다.
            echo "[pool] node $(node -v)"
            mkdir -p .skku-pool && chmod 700 .skku-pool
            # 관리자 계정은 DB 에 계정이 하나도 없을 때 한 번만 이 파일로 만든다(이후 비밀번호는 화면에서 바꾼다).
            if [ -n "$SKKU_POOL_ADMIN_ID" ] && [ -n "$SKKU_POOL_ADMIN_PW" ]; then
              umask 077
              node -e 'require("fs").writeFileSync(".skku-pool/secrets.json", JSON.stringify({admin_id:process.env.SKKU_POOL_ADMIN_ID, admin_pw:process.env.SKKU_POOL_ADMIN_PW}))'
              chmod 600 .skku-pool/secrets.json
              echo "[pool] 관리자 시크릿 씀"
            else
              echo "[pool] SKKU_POOL_ADMIN_* 시크릿 없음 — 관리자 계정을 만들 수 없다"
            fi
            # DB 백업(최근 30개) — 배포마다
            if [ -f .skku-pool/pool.db ]; then
              mkdir -p /home/ubuntu/skku-pool-backup
              cp -f .skku-pool/pool.db "/home/ubuntu/skku-pool-backup/pool_$(date +%Y%m%d_%H%M%S).db"
              ls -1t /home/ubuntu/skku-pool-backup/pool_*.db | tail -n +31 | xargs -r rm -f
            fi

            pm2 restart biblo-ai || pm2 start ecosystem.config.js
