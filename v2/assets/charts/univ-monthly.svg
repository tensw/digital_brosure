<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="세 대학의 누적 논문 수, 2015년부터 2025년까지">
<title>누적 논문 수 (성균관대와 앵커 대학)</title>
<!-- 값은 지어내지 않는다. OpenAlex 기관 단위 월별 실측 132개월.
     발행일이 연도까지만 등록된 논문(1월 1일로 몰림)은 빼고 모았다 — 각주에 건수.
     연·월은 순환하지 않으므로 되감지 않는다. 2025-12 에 닿으면 멈춘다.
     같은 엔진으로 만든 조정 화면: tune-univ.html — 거기서 값을 밀어 맞춘 뒤 이 파일을 다시 찍는다. -->
<defs id="defs"><clipPath id="clipPlot"><rect x="44" y="0" width="408" height="286"/></clipPath></defs>
<g id="head"></g>
<g id="gridY"></g>
<g clip-path="url(#clipPlot)"><g id="gridX"></g><g id="areas"></g><g id="lines"></g></g>
<g id="axis"></g>
<g id="dots"></g>
<g id="labs"></g>
<script><![CDATA[
var DATA={"keys": ["2015-01", "2015-02", "2015-03", "2015-04", "2015-05", "2015-06", "2015-07", "2015-08", "2015-09", "2015-10", "2015-11", "2015-12", "2016-01", "2016-02", "2016-03", "2016-04", "2016-05", "2016-06", "2016-07", "2016-08", "2016-09", "2016-10", "2016-11", "2016-12", "2017-01", "2017-02", "2017-03", "2017-04", "2017-05", "2017-06", "2017-07", "2017-08", "2017-09", "2017-10", "2017-11", "2017-12", "2018-01", "2018-02", "2018-03", "2018-04", "2018-05", "2018-06", "2018-07", "2018-08", "2018-09", "2018-10", "2018-11", "2018-12", "2019-01", "2019-02", "2019-03", "2019-04", "2019-05", "2019-06", "2019-07", "2019-08", "2019-09", "2019-10", "2019-11", "2019-12", "2020-01", "2020-02", "2020-03", "2020-04", "2020-05", "2020-06", "2020-07", "2020-08", "2020-09", "2020-10", "2020-11", "2020-12", "2021-01", "2021-02", "2021-03", "2021-04", "2021-05", "2021-06", "2021-07", "2021-08", "2021-09", "2021-10", "2021-11", "2021-12", "2022-01", "2022-02", "2022-03", "2022-04", "2022-05", "2022-06", "2022-07", "2022-08", "2022-09", "2022-10", "2022-11", "2022-12", "2023-01", "2023-02", "2023-03", "2023-04", "2023-05", "2023-06", "2023-07", "2023-08", "2023-09", "2023-10", "2023-11", "2023-12", "2024-01", "2024-02", "2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12", "2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12"], "series": [{"nm": "서울대", "c": "#2E5FD9", "v": [450, 622, 621, 735, 724, 818, 643, 741, 729, 755, 604, 777, 505, 720, 662, 631, 699, 698, 631, 710, 823, 702, 631, 754, 506, 667, 692, 722, 715, 759, 784, 767, 714, 733, 618, 768, 548, 654, 753, 725, 747, 834, 801, 739, 725, 793, 744, 689, 708, 660, 758, 738, 848, 748, 918, 711, 853, 734, 826, 821, 657, 689, 753, 835, 869, 941, 838, 786, 808, 1010, 828, 945, 776, 748, 908, 787, 900, 948, 865, 795, 774, 868, 808, 867, 694, 735, 859, 773, 745, 965, 782, 738, 846, 815, 851, 866, 703, 810, 840, 772, 769, 945, 759, 814, 877, 965, 888, 954, 746, 851, 895, 804, 876, 862, 802, 827, 745, 859, 813, 945, 732, 753, 771, 867, 883, 776, 843, 812, 755, 919, 1033, 1045]}, {"nm": "연세대", "c": "#12A594", "v": [366, 419, 498, 460, 536, 587, 521, 456, 561, 540, 434, 577, 379, 473, 506, 515, 608, 559, 477, 508, 645, 554, 479, 540, 347, 480, 542, 511, 480, 567, 526, 497, 591, 541, 543, 488, 430, 488, 571, 527, 572, 531, 627, 525, 605, 669, 612, 542, 485, 531, 585, 578, 630, 588, 728, 547, 678, 612, 657, 680, 505, 556, 627, 558, 672, 746, 693, 692, 747, 720, 715, 775, 656, 684, 820, 633, 804, 851, 696, 706, 729, 798, 705, 811, 619, 668, 742, 735, 712, 833, 697, 725, 791, 719, 858, 800, 630, 657, 771, 696, 713, 954, 717, 728, 773, 925, 982, 877, 689, 702, 798, 766, 774, 789, 728, 707, 700, 857, 769, 847, 671, 698, 742, 770, 773, 793, 832, 673, 759, 920, 881, 1086]}, {"nm": "성균관대", "c": "#E0566B", "v": [315, 325, 375, 382, 442, 509, 401, 387, 394, 441, 373, 455, 334, 407, 390, 413, 467, 435, 408, 444, 470, 445, 468, 482, 346, 399, 420, 410, 442, 422, 434, 459, 433, 502, 454, 443, 348, 423, 399, 412, 458, 451, 474, 440, 435, 610, 524, 442, 399, 436, 416, 441, 515, 470, 540, 417, 434, 512, 519, 475, 374, 458, 439, 459, 525, 503, 495, 497, 555, 549, 633, 499, 525, 446, 602, 466, 563, 546, 526, 501, 528, 548, 510, 510, 474, 518, 518, 530, 552, 591, 524, 518, 619, 551, 605, 637, 491, 530, 601, 546, 532, 734, 580, 551, 584, 678, 638, 622, 550, 569, 577, 548, 638, 666, 553, 529, 578, 613, 591, 612, 506, 573, 563, 590, 566, 590, 634, 603, 615, 754, 765, 714]}, {"nm": "고려대", "c": "#E08A2E", "v": [259, 327, 308, 382, 363, 407, 354, 377, 386, 381, 314, 404, 289, 390, 360, 349, 357, 404, 317, 389, 408, 404, 354, 405, 276, 343, 415, 364, 388, 382, 384, 378, 440, 414, 427, 388, 332, 349, 376, 353, 411, 392, 463, 380, 426, 455, 417, 387, 385, 380, 419, 382, 434, 454, 448, 439, 451, 461, 463, 429, 407, 430, 439, 443, 464, 477, 499, 456, 523, 603, 496, 481, 506, 457, 500, 491, 482, 510, 483, 504, 469, 528, 513, 525, 420, 447, 485, 490, 444, 443, 468, 484, 554, 538, 506, 463, 417, 526, 479, 433, 500, 523, 482, 487, 474, 586, 582, 540, 477, 520, 534, 502, 583, 565, 551, 515, 534, 682, 581, 627, 557, 567, 589, 575, 613, 620, 658, 541, 572, 733, 699, 704]}, {"nm": "카이스트", "c": "#7B5CD6", "v": [203, 256, 298, 320, 315, 362, 339, 383, 319, 394, 309, 322, 221, 242, 328, 267, 382, 362, 330, 342, 359, 381, 299, 312, 235, 276, 310, 301, 362, 386, 364, 269, 333, 360, 313, 319, 254, 297, 324, 360, 365, 394, 401, 290, 296, 464, 319, 261, 267, 326, 308, 302, 427, 402, 396, 324, 374, 408, 374, 351, 261, 358, 323, 336, 356, 363, 395, 346, 367, 396, 380, 364, 299, 314, 378, 324, 466, 431, 365, 353, 309, 435, 340, 361, 268, 274, 320, 319, 324, 431, 368, 298, 331, 425, 367, 313, 259, 335, 341, 357, 432, 438, 306, 348, 326, 529, 360, 324, 288, 309, 477, 329, 433, 395, 361, 375, 365, 448, 367, 354, 273, 325, 324, 445, 378, 471, 369, 348, 361, 585, 534, 455]}, {"nm": "포스텍", "c": "#3FA9F5", "v": [121, 129, 137, 139, 180, 190, 167, 203, 160, 208, 140, 160, 128, 182, 166, 158, 206, 169, 146, 143, 166, 172, 151, 165, 130, 138, 149, 135, 160, 185, 135, 137, 165, 161, 135, 171, 131, 148, 167, 159, 141, 166, 185, 148, 124, 184, 208, 139, 113, 141, 153, 149, 199, 160, 190, 167, 160, 155, 177, 170, 128, 192, 167, 166, 179, 176, 190, 173, 200, 175, 186, 181, 177, 171, 234, 180, 172, 225, 192, 167, 177, 208, 188, 219, 159, 183, 189, 157, 207, 223, 210, 188, 218, 203, 206, 198, 185, 189, 229, 176, 221, 243, 186, 192, 173, 223, 190, 211, 168, 162, 218, 169, 218, 196, 197, 195, 181, 235, 200, 243, 190, 168, 200, 168, 216, 225, 233, 185, 186, 271, 266, 254]}], "unknownJan": {"서울대": 15609, "연세대": 13648, "성균관대": 9840, "고려대": 9030, "카이스트": 6879, "포스텍": 3173}};
var CFG={"cum": true, "pick": ["연세대", "성균관대", "고려대"], "win": 48, "mps": 3.4, "lineW": 1.4, "fillOp": 0.28, "x0": 44, "x1": 452, "labelX": 458, "yTop": 70, "yBot": 262, "bottom": 274, "foY": 308};
// 대학 월별 논문 수 차트 — 조정 화면과 SVG 가 같은 코드를 쓴다.
// DATA(keys·series·unknownJan) 와 CFG 를 밖에서 주면 그린다.
function makeChart(root, DATA, CFG){
  var NS='http://www.w3.org/2000/svg';
  var FONT='-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif';
  var q=function(id){ return root.querySelector('#'+id); };
  function el(n,a,p){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; }
  function comma(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function shortN(n){ return n>=10000 ? (n/1000).toFixed(0)+'천' : comma(n); }

  var L={head:q('head'),gridY:q('gridY'),gridX:q('gridX'),areas:q('areas'),
         lines:q('lines'),axis:q('axis'),dots:q('dots'),labs:q('labs'),defs:q('defs')};
  var head=0, raf=null, S=[], ticks=[], tEls={};

  function pick(){ return DATA.series.filter(function(s){ return CFG.pick.indexOf(s.nm)>=0; }); }
  function vals(s){
    if(!CFG.cum) return s.v;
    var o=[],a=0; for(var i=0;i<s.v.length;i++){ a+=s.v[i]; o.push(a); } return o;
  }
  function yMax(){
    var m=0; S.forEach(function(s){ for(var i=0;i<s.d.length;i++) if(s.d[i]>m) m=s.d[i]; });
    return CFG.cum ? Math.ceil(m*1.06/5000)*5000 : Math.ceil(m*1.12/100)*100;
  }

  function build(){
    [L.head,L.gridY,L.gridX,L.areas,L.lines,L.axis,L.dots,L.labs,L.defs]
      .forEach(function(g){ if(g) g.textContent=''; });
    S = pick().map(function(s){ return {nm:s.nm, c:s.c, d:vals(s)}; });
    var YM=yMax(), step = CFG.cum ? YM/4 : Math.ceil(YM/4/100)*100;
    CFG._ym=YM; CFG._step=step;

    el('text',{x:CFG.x0,y:26,fill:'#1E1E1E','font-size':14,'font-weight':'800','font-family':FONT},L.head)
      .textContent = CFG.cum ? '누적 논문 수 (성균관대와 앵커 대학)' : '월별 논문 수 (성균관대와 앵커 대학)';
    el('text',{x:CFG.x0,y:41,fill:'#7B8794','font-size':7.5,'font-weight':'500','font-family':FONT},L.head)
      .textContent = 'OpenAlex 기관 단위 실측 · '+DATA.keys[0]+' ~ '+DATA.keys[DATA.keys.length-1]
                     +' · '+DATA.keys.length+'개월'+(CFG.cum?' · 2015-01 부터 쌓은 값':'');
    var unk=CFG.pick.map(function(n){ return n+' '+comma(DATA.unknownJan[n]||0); }).join(' · ');
    el('text',{x:CFG.x0,y:CFG.foY,fill:'#AEB6BD','font-size':6.5,'font-weight':'500','font-family':FONT},L.head)
      .textContent='발행일이 연도까지만 등록된 논문(1월 1일로 몰림)은 뺐다. '+unk+'편. 연·월은 순환하지 않으므로 되감지 않는다.';

    for(var v=0; v<=YM+1; v+=step){
      var y=Y(v);
      el('line',{x1:CFG.x0,y1:y,x2:CFG.x1,y2:y,stroke:'#E7EBEE','stroke-width':0.5},L.gridY);
      el('text',{x:CFG.x0-5,y:y+2.4,fill:'#9AA3AB','text-anchor':'end','font-size':6.5,'font-family':FONT},L.gridY)
        .textContent=shortN(v);
    }
    ticks=[];
    for(var i=0;i<DATA.keys.length;i++) if(DATA.keys[i].slice(5)==='01')
      ticks.push({i:i,t:DATA.keys[i].slice(0,4),
        line:el('line',{y1:CFG.yTop,y2:CFG.yBot,stroke:'#EDF1F3','stroke-width':0.6},L.gridX),
        text:el('text',{y:CFG.yBot+13,fill:'#9AA3AB','text-anchor':'middle','font-size':6.5,'font-family':FONT},L.axis)});
    ticks.forEach(function(k){ k.text.textContent=k.t; });

    S.forEach(function(s,i){
      var g=el('linearGradient',{id:'ug'+i,gradientUnits:'userSpaceOnUse',x1:0,y1:CFG.yTop,x2:0,y2:CFG.bottom},L.defs);
      el('stop',{offset:'0','stop-color':s.c,'stop-opacity':CFG.fillOp},g);
      el('stop',{offset:'1','stop-color':s.c,'stop-opacity':'0'},g);
      s.area=el('path',{fill:'url(#ug'+i+')',stroke:'none'},L.areas);
      s.line=el('path',{fill:'none',stroke:s.c,'stroke-width':CFG.lineW,'stroke-linejoin':'round','stroke-linecap':'round'},L.lines);
      s.dot=el('circle',{r:2.2,fill:s.c},L.dots);
      s.lab=el('text',{x:CFG.labelX,fill:s.c,'font-size':7.5,'font-weight':'800','font-family':FONT},L.labs);
    });
    head=Math.min(DATA.keys.length-1, CFG.win*0.35);
    draw();
  }

  function Y(v){ return CFG.yBot-(CFG.yBot-CFG.yTop)*Math.min(1, v/CFG._ym); }

  function draw(){
    var BAND=(CFG.x1-CFG.x0)/CFG.win, lastF=head;
    var first=Math.max(0, Math.floor(head-CFG.win));
    function X(i){ return CFG.x1-(lastF-i)*BAND; }
    ticks.forEach(function(k){
      var x=X(k.i), on=(x>CFG.x0-1 && x<CFG.x1+1);
      k.line.setAttribute('x1',x.toFixed(1)); k.line.setAttribute('x2',x.toFixed(1));
      k.line.setAttribute('opacity',on?1:0);
      k.text.setAttribute('x',x.toFixed(1)); k.text.setAttribute('opacity',on?1:0);
    });
    var ends=[];
    S.forEach(function(s){
      var iEnd=Math.min(s.d.length-1, Math.floor(head)), d='';
      for(var i=first;i<=iEnd;i++) d+=(i===first?'M':'L')+X(i).toFixed(1)+' '+Y(s.d[i]).toFixed(1);
      var f=head-Math.floor(head), ex=X(iEnd), ev=s.d[iEnd];
      if(iEnd+1<s.d.length && f>0){
        ev=s.d[iEnd]+(s.d[iEnd+1]-s.d[iEnd])*f; ex=X(head);
        d+='L'+ex.toFixed(1)+' '+Y(ev).toFixed(1);
      }
      s.line.setAttribute('d',d);
      s.area.setAttribute('d', d? d+'L'+ex.toFixed(1)+' '+CFG.bottom+'L'+X(first).toFixed(1)+' '+CFG.bottom+'Z' : '');
      ends.push({s:s,x:ex,y:Y(ev),v:ev});
    });
    ends.sort(function(a,b){ return a.y-b.y; });
    for(var i=1;i<ends.length;i++) if(ends[i].y<ends[i-1].y+9) ends[i].y=ends[i-1].y+9;
    ends.forEach(function(e){
      e.s.dot.setAttribute('cx',e.x.toFixed(1)); e.s.dot.setAttribute('cy',Y(e.v).toFixed(1));
      e.s.lab.setAttribute('y',(e.y+2.4).toFixed(1));
      e.s.lab.textContent=e.s.nm+'  '+comma(e.v);
    });
  }

  var last=0;
  function frame(now){
    if(!last) last=now;
    var dt=Math.min((now-last)/1000, 1/20); last=now;
    head=Math.min(DATA.keys.length-1, head+CFG.mps*dt);
    draw();
    raf = head<DATA.keys.length-1 ? requestAnimationFrame(frame) : null;
  }
  function play(){ if(raf) cancelAnimationFrame(raf); last=0; head=Math.min(DATA.keys.length-1, CFG.win*0.35); raf=requestAnimationFrame(frame); }
  function stillEnd(){ head=DATA.keys.length-1; draw(); }

  return { build:build, play:play, draw:draw, stillEnd:stillEnd,
           get head(){return head;}, set head(v){head=v;} };
}

(function(){
  var c=makeChart(document, DATA, CFG);
  c.build();
  var still=false; try{ still=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(still) c.stillEnd(); else c.play();
})();
]]></script>
</svg>
