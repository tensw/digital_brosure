<div class="hint">휠: 확대·축소 · 드래그: 이동 · ⟳: 초기화</div>
<script>
var vp=document.getElementById('vp'),wrap=document.getElementById('wrap');
var scale=1,tx=0,ty=0,VBW=2400,VBH=1500;
function apply(){vp.setAttribute('transform','translate('+tx+' '+ty+') scale('+scale+')');}
function svgPt(cx,cy){var r=wrap.getBoundingClientRect();
 var s=Math.max(VBW/r.width,VBH/r.height);
 var ox=(r.width-VBW/s)/2, oy=(r.height-VBH/s)/2;
 return [((cx-r.left-ox)*s-tx)/scale, ((cy-r.top-oy)*s-ty)/scale];}
wrap.addEventListener('wheel',function(ev){ev.preventDefault();
 var f=ev.deltaY<0?1.12:1/1.12; var ns=Math.min(6,Math.max(.35,scale*f));
 var p=svgPt(ev.clientX,ev.clientY);
 tx=tx-p[0]*(ns-scale); ty=ty-p[1]*(ns-scale); scale=ns; apply();},{passive:false});
var dr=false,lx=0,ly=0;
wrap.addEventListener('pointerdown',function(ev){dr=true;lx=ev.clientX;ly=ev.clientY;wrap.classList.add('drag');wrap.setPointerCapture(ev.pointerId);});
wrap.addEventListener('pointermove',function(ev){if(!dr)return;
 var r=wrap.getBoundingClientRect();var s=Math.max(VBW/r.width,VBH/r.height);
 tx+=(ev.clientX-lx)*s; ty+=(ev.clientY-ly)*s; lx=ev.clientX;ly=ev.clientY;apply();});
wrap.addEventListener('pointerup',function(ev){dr=false;wrap.classList.remove('drag');});
function zoomBtn(f){var ns=Math.min(6,Math.max(.35,scale*f));
 var cx=VBW/2,cy=VBH/2; tx=tx-cx*(ns-scale);ty=ty-cy*(ns-scale);scale=ns;apply();}
document.getElementById('zin').onclick=function(){zoomBtn(1.2)};
document.getElementById('zout').onclick=function(){zoomBtn(1/1.2)};
document.getElementById('zrst').onclick=function(){scale=1;tx=0;ty=0;apply();};
apply();
</script></body></html>
