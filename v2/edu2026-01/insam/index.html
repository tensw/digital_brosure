<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noai, noimageai, noindex, nofollow, noarchive">
<title>독립운동 인명사전 그래프 정제·정규화 발표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#060a16;overflow:hidden;
 font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.deck{position:relative;height:100vh;overflow-y:auto;overflow-x:hidden;
 scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.deck::-webkit-scrollbar{display:none}
.slide{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.slide iframe{border:0;width:100%;height:100%;display:block;background:transparent}

/* 좌측 눈금 네비 */
.nav{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:10;
 display:flex;flex-direction:column;gap:4px;padding:14px 20px 14px 8px}
.ns{all:unset;cursor:pointer;position:relative;display:block;width:24px;height:9px}
.ns i{position:absolute;left:0;top:0;height:100%;width:3px;border-radius:2px;
 background:rgba(150,180,235,.28);transition:width .22s cubic-bezier(.2,.8,.2,1),background .22s ease,box-shadow .22s ease}
.ns:hover i{width:12px;background:rgba(190,215,255,.6)}
.ns[aria-current="true"] i{width:18px;background:#7dd3fc;box-shadow:0 0 12px rgba(125,211,252,.85),0 0 26px rgba(125,211,252,.35)}
.ns b{position:absolute;left:0;top:50%;transform:translate(14px,-50%) scale(.92);transform-origin:left center;
 opacity:0;pointer-events:none;white-space:nowrap;font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;
 color:#e6efff;padding:5px 9px;border-radius:7px;background:rgba(6,10,24,.9);border:1px solid rgba(150,180,235,.24);
 box-shadow:0 8px 22px -10px rgba(0,0,0,.95);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.ns:hover b,.ns[aria-current="true"] b{opacity:1;transform:translate(20px,-50%) scale(1)}

/* 우하단 카운터 */
.cap{position:fixed;right:22px;bottom:20px;z-index:10;
 font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#8ba0c8;
 background:rgba(6,10,24,.7);border:1px solid rgba(150,180,235,.2);padding:8px 13px;border-radius:20px;
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cap b{color:#e6efff}
@media print{.nav,.cap{display:none}.deck{height:auto;overflow:visible}
 .slide{page-break-after:always;height:100vh}}
</style></head><body>
<div class="deck" id="deck"></div>
<nav class="nav" id="nav"></nav>
<div class="cap" id="cap"><b>1</b> / 21</div>
<script>
var SLIDES=[
 ['insam-s0.html','표지 · 독립운동 인명사전 그래프 정제·정규화'],
 ['insam-s1.html','1부 정제 이유 · 데이터 정제의 필요성'],
 ['insam-map.html','1부 정제 이유 · 전체 지도'],
 ['insam-s10.html','2부 그래프 구성 방법 · 노드·간선 유형과 채택 기준'],
 ['insam-s2.html','2부 그래프 구성 방법 · 개체·관계·속성 추출 절차'],
 ['insam-s7.html','2부 그래프 구성 방법 · 문단 단위 추출 사례'],
 ['insam-s6.html','2부 그래프 구성 방법 · 관계와 속성의 분리'],
 ['insam-s9.html','2부 그래프 구성 방법 · 안중근 그래프 구성 사례'],
 ['insam-s11.html','2부 그래프 구성 방법 · 사건 규모와 투영의 영향'],
 ['insam-s18.html','3부 정규화 방법 · 표기 분절과 분석 범위'],
 ['insam-s3.html','3부 정규화 방법 · 이름 표기 정규화'],
 ['insam-s4.html','3부 정규화 방법 · 시간·장소 표준화'],
 ['insam-s5.html','3부 정규화 방법 · 조직·사건 동일성 판정'],
 ['insam-s8.html','3부 정규화 방법 · 판정 기준과 미해소 처리'],
 ['insam-s19.html','3부 정규화 방법 · 정규화 규칙 적용 결과'],
 ['insam-s16.html','4부 검증과 분석 결과 · 정확성 평가 현황'],
 ['insam-s12.html','4부 검증과 분석 결과 · 정규화 전후 규모·연결성'],
 ['insam-s13.html','4부 검증과 분석 결과 · 정규화 전후 중심성 순위'],
 ['insam-s14.html','4부 검증과 분석 결과 · 정규화 전후 커뮤니티 유사도'],
 ['insam-s17.html','4부 검증과 분석 결과 · 적용 범위와 잔여 편향'],
 ['insam-s15.html','부록 · 구조적 역할 분석']
];
var deck=document.getElementById('deck'),nav=document.getElementById('nav'),cap=document.getElementById('cap');
var N=SLIDES.length,cur=0;
SLIDES.forEach(function(s,i){
 var sec=document.createElement('section');sec.className='slide';
 var f=document.createElement('iframe');f.src=s[0];f.title=s[1];
 if(i>0)f.loading='lazy';
 sec.appendChild(f);deck.appendChild(sec);
 var b=document.createElement('button');b.className='ns';b.setAttribute('aria-label',(i+1)+'. '+s[1]);
 b.innerHTML='<i></i><b>'+(i+1)+'. '+s[1]+'</b>';
 b.onclick=function(){go(i)};nav.appendChild(b);
});
var slides=[].slice.call(deck.querySelectorAll('.slide'));
var navs=[].slice.call(nav.querySelectorAll('.ns'));
function setActive(i){cur=i;cap.innerHTML='<b>'+(i+1)+'</b> / '+N;
 navs.forEach(function(n,k){n.setAttribute('aria-current',k===i?'true':'false')});}
function go(i){i=Math.max(0,Math.min(N-1,i));slides[i].scrollIntoView({behavior:'smooth'});setActive(i);}
if('IntersectionObserver' in window){
 var io=new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=0.5){setActive(slides.indexOf(e.target));}});
 },{root:deck,threshold:[0.5]});
 slides.forEach(function(s){io.observe(s)});
}
setActive(0);
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
 else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
 else if(e.key==='Home'){e.preventDefault();go(0);}
 else if(e.key==='End'){e.preventDefault();go(N-1);}
});
</script></body></html>
