const TEXT = {"overview_lead": "성균관대학교 측이 요청한 것은 설득용 큐레이션이 아니라 쓰기 위한 기초 데이터입니다. 이 페이지는 ① 희귀질환의 국내외 정의와 ② 문샷(Moonshot) 개념에서 출발한 ③ 의학 난제 카테고리 초안을 두고, ④ 병원 또는 의과대학을 보유한 국내 대학의 연구 성과를 정량 지표로 표현하며, ⑤ 성균관대는 그중 한 행으로 같은 화면에서 확인합니다. 순서는 클라이언트 면담 정리(2026-09-18)의 항목 1~5를 그대로 따랐습니다.", "overview_body": "<h3 style='margin-top:0'>데이터의 성격<\/h3><ul><li><b>두 원천, 세 기법.<\/b> PubMed(MeSH 통제어 + 제목·초록 키워드, 2016–2025)와 OpenAlex 덤프(제목 키워드 = 기법 K, OpenAlex 주제명 = 기법 T, 2020–2025)를 같은 개념·같은 용어로 걸었습니다. 기법마다 잣대가 다르므로 한 표 안에서는 한 지표만 읽습니다.<\/li><li><b>대학 단위 = 대학 + 부속병원.<\/b> 예: 성균관대 = 성균관대학교 + 삼성서울병원·강북삼성병원·삼성창원병원, 울산대 = 울산대학교 + 서울아산병원. 모든 대학에 같은 규칙을 적용했습니다.<\/li><li><b>카테고리는 초안 v0.<\/b> 클라이언트가 전달한 정의서의 11개 영역(한국형 ARPA-H 임무 분류와 대응)과 희귀질환 트랙을 후보안으로 두고 문헌 기준으로 확정하기 전의 탐색(EDA) 단계입니다. 확정되면 조회식만 바꿔 같은 파이프라인을 다시 돌립니다.<\/li><li><b>중립.<\/b> 렌즈를 고르지 않습니다. 편수·점유율·활동지수·성장률·FWCI·상위 논문 비중을 모두 같은 자리에 두고, 성균관대 강조는 토글이며 기본값은 꺼져 있습니다.<\/li><\/ul>", "tab_desc": {"criteria": "희귀질환 정의(국내·국외), 문샷 개념, 카테고리 초안과 세 기법의 조회식", "matrix": "대학×카테고리 표. 지표·기간·비교군·정렬을 바꿔 가며 봅니다", "category": "카테고리 하나를 골라 대학 순위, 연도별 추이, 모든 지표", "university": "대학 하나를 골라 12개 카테고리 프로파일과 순위. 성균관대 뷰는 여기서 성균관대를 고른 것", "method": "원천·조회식·지표 산식·대학 그룹 사전·한계·참고문헌", "download": "집계표 CSV 복사, 논문 단위 CSV·JSON 링크(배포 사이트)", "report": "문서형 보고서: 조사 개요와 집계 대상, 전체 개요(문샷 합계 순위·특화지수·추세), 대학별 프로파일, 대학 비교, R 진단, 검증, 부록. 브라우저 인쇄로 PDF 저장"}, "criteria_rare": "<h3 style='margin-top:0'>희귀질환 정의<\/h3><p>국내 법정 정의는 「희귀질환관리법」 제2조의 “유병인구가 2만 명 이하이거나 진단이 어려워 유병인구를 알 수 없는 질환”이며, 질병관리청이 국가관리대상 희귀질환 목록을 고시합니다. 국외 기준은 유럽연합의 희귀의약품 규정(유병률 1만 명당 5명 이하), 미국 희귀의약품법(환자 20만 명 미만), Orphanet의 ORPHAcode 명명 체계가 표준입니다. 이 대시보드의 트랙 R 조회식은 이 정의를 서지에 투영한 잣대(MeSH ‘Rare Diseases’·‘rare disease’ 문구·희귀질환 관련 OpenAlex 주제)이며, 질병관리청 목록의 질환명을 하나씩 거는 방식(성균관대 상세본에서 사용)과는 잣대가 다릅니다.<\/p><p class='note'>출처는 ⑥ 방법·출처 탭 참고문헌 A절.<\/p>", "criteria_moonshot": "<h3 style='margin-top:0'>문샷(Moonshot) 개념과 의학 난제<\/h3><p>채택 정의(클라이언트 제시, 2026-09-18): “문샷 난제(Moonshot Challenge) 분석은 달 탐사처럼 성공 확률은 극히 낮지만 성공 시 인류 사회와 산업 전반에 막대한 파급효과(High Risk, High Return)를 가져오는 초고난도 과제를 발굴하고 분석하는 범용 연구개발(R&D) 기획 방법론이며, 우주·양자컴퓨팅·기후변화 등 다양한 분야에 적용된다.” 이 정의의 세 속성(성공 확률이 극히 낮음 · 파급효과가 막대함 · 초고난도)이 의학 난제를 판정하는 축입니다. 문헌에서 대응하는 개념은 임무지향 혁신정책(Mazzucato, 2018), ARPA 모델(Azoulay et al., 2019), Grand Challenges in Global Health(Varmus et al., 2003)이고, 의학 적용 사례는 미국 Cancer Moonshot(2016·2022), ARPA-H(2022), 한국형 ARPA-H 프로젝트(2024~), 일본 내각부 Moonshot 목표 2·7, EU Missions(암), EU Rare Disease Moonshot(2022)입니다.<\/p><p>카테고리 초안 v0는 클라이언트 정의서의 11개 영역을 그대로 후보안으로 쓴 것이며, 4개 묶음(미정복질환·보건안보·바이오헬스 초격차·복지돌봄)은 한국형 ARPA-H 5대 임무 중 4개와 이름이 같습니다. 문헌 기준 확정(판정 축별 조작화, 델파이 등)은 다음 단계입니다.<\/p>", "criteria_table_note": "PubMed 조회식은 MeSH 통제어와 제목·초록([tiab]) 키워드를 함께 겁니다. 덤프 K는 OpenAlex 덤프에 초록이 없어 제목만 대상으로 하며 접두 검색(:*)과 인접 연산(<->)을 씁니다. 덤프 T는 OpenAlex가 논문마다 부여한 주제(topic) 이름의 정확 일치입니다. M2 ‘난치암 근본치료’는 정의서 원문 검색식을 받지 못해 췌장암·교모세포종·불응성 암으로 대체 정의했습니다.", "criteria_cross": "<h3 style='margin-top:0'>희귀질환과 문샷 난제의 교차<\/h3><p>클라이언트 질문 “희귀질환 중 문샷 난제는 무엇인가”에 답하려면 카테고리 체계가 희귀 여부 × 난제 카테고리의 2차원이어야 합니다. 이번 초안에서는 트랙 R을 독립 열로 두고, 문샷 영역 중 희귀질환과 겹치는 대표 영역(M1 신경퇴행 중 유전성 신경퇴행, M8 유전자치료, M9 세포치료, M10 장기재생)의 교집합은 논문 단위 데이터(⑦ 데이터 탭 CSV)의 카테고리 태그로 계산할 수 있게 했습니다. 한 논문이 여러 카테고리에 속할 수 있으며 열 합계는 논문 수와 다릅니다.<\/p>", "method_sources": "<h3 style='margin-top:0'>원천과 조회<\/h3><ul><li><b>PubMed E-utilities<\/b> esearch(rettype=count, datetype=pdat) — 2026-09-18 조회. 카테고리 조회식 AND 기관 소속 문구([ad]) AND 연도. 한국 전체는 Korea[ad], 세계 전체는 소속 제한 없음. 소속 문구 검색이라 병원명이 다른 형태로 적힌 논문은 누락될 수 있고, 여러 대학 공저 논문은 각 대학에 모두 셉니다.<\/li><li><b>OpenAlex 덤프<\/b> — Supabase BIBLOBOOK 프로젝트 paper.oa_work(1억 770만 편, 적재 2026-07-25)·paper.oa_work_author(3억 2,641만 행). 2020–2025만 전량이며 초록·MeSH·기관 ID가 없어 제목(기법 K)과 OpenAlex 주제명(기법 T)으로 조회하고, 대학은 저자 소속 표시명의 정확 일치(대학+부속병원 사전)로 묶었습니다. 저자 소속은 전역적으로 약 43%가 비어 있어 덤프 편수는 하한값입니다. 세계 편수·세계 FWCI 평균은 같은 조회식의 전체 결과입니다.<\/li><li><b>OpenAlex API<\/b>(기관 계보·초록 키워드·인용 백분위)는 2026-09-18 일일 예산이 소진돼 이번 판에는 넣지 않았습니다. 확보되면 세 번째 원천 열로 추가합니다.<\/li><\/ul>", "method_indicators": "<h3 style='margin-top:0'>지표 산식<\/h3><ul><li><b>편수<\/b> — 조회식에 걸린 논문 수. 공저 논문은 관련 대학마다 1편.<\/li><li><b>국내 점유율<\/b> — 대학 편수 ÷ 한국 편수(Korea[ad]) × 100 (PubMed).<\/li><li><b>활동지수(Activity Index)<\/b> — (대학의 카테고리 편수 ÷ 대학 전체 편수) ÷ (한국의 카테고리 편수 ÷ 한국 전체 편수). Frame(1977)과 Schubert &amp; Braun(1986)의 상대 특화 지수. 1.0이 국내 평균 수준, 클수록 그 카테고리에 상대적으로 집중. 분모를 ‘전체 논문’으로 둔 값이며, 생명·보건 분야로 좁힌 분모는 다음 판에서 병기합니다.<\/li><li><b>성장률<\/b> — 2021–2025 합계 ÷ 2016–2020 합계 − 1 (PubMed). 2025년은 색인 진행 중이라 과소 집계됩니다.<\/li><li><b>FWCI 평균<\/b> — OpenAlex Field-Weighted Citation Impact의 산술평균. 1.0 = 같은 분야·연도·문헌 유형의 세계 평균. FWCI가 비어 있는 논문은 제외.<\/li><li><b>FWCI≥2 비중<\/b> — FWCI 2 이상 논문 ÷ FWCI가 있는 논문 × 100. OpenAlex 덤프에 인용 백분위 필드가 없어 ‘상위 10% 논문 비중’ 대신 쓴 대용 지표.<\/li><li><b>세계 점유율<\/b> — 대학 편수 ÷ 세계 편수 × 1000(‰), 같은 조회식(덤프 K).<\/li><li><b>순위<\/b> — 표시 중인 비교군 안에서 해당 지표의 내림차순 순위. 동률은 같은 순위.<\/li><\/ul><p class='note'>지표 선택 근거는 Leiden Manifesto(Hicks et al., 2015)의 분야 정규화·복수 지표 병기 원칙, 인용 지표 총설(Waltman, 2016), FWCI·RCR 비교(Purkayastha et al., 2019)를 따랐습니다.<\/p>", "method_groups": "<h3 style='margin-top:0'>대학 그룹과 비교군<\/h3><p>자격은 병원 또는 의과대학을 보유한 국내 대학입니다. 후보 22개 대학은 OpenAlex 덤프 한국 소속 표본과 OpenAlex 의학 분야(2024) 기관별 논문 수 상위 목록에서 뽑았고, 핵심 비교군 15개는 공개된 대학 순위와 대학병원 순위를 결합해 정했습니다(⑥ 참고문헌 D절, 규칙은 아래). 서울대·연세대·고려대·성균관대는 클라이언트 예시로 필수 포함입니다. 각 대학의 부속병원 표시명과 PubMed 소속 문구는 ⑤ 대학 상세에서 확인할 수 있습니다.<\/p><h4 style='margin:10px 0 4px'>핵심 비교군 15개 선정 규칙 (2026-09-18)<\/h4><ol><li>자격: 병원 또는 의과대학을 보유한 국내 대학.<\/li><li>세 목록을 만든다. (a) <b>대학 순위<\/b>: 중앙일보 대학평가 2025 종합 20위 이내 또는 THE World University Rankings 2026 한국 20위 이내인 대학 중 의대·병원 보유 대학 — 서울대·연세대·한양대·고려대·성균관대·경희대·이화여대·건국대·중앙대·동국대·인하대·아주대·가천대·경북대·부산대·울산대. (b) <b>대학병원 순위<\/b>: Newsweek/Statista World’s Best Hospitals 2025 한국 20위 이내 병원의 모대학 — 울산대·성균관대·서울대·연세대·아주대·가톨릭대·인하대·경희대·건국대·고려대·중앙대·이화여대·전남대·대구가톨릭대·충남대·영남대. (c) <b>의생명 분야 논문량<\/b>: CWTS Leiden Ranking 2025 Biomedical and health sciences(2020–2023, P) 한국 15위 이내 — 서울대·연세대·성균관대·울산대·가톨릭대·고려대·경희대·부산대·경북대·전남대·한림대·중앙대·한양대·가천대·충남대.<\/li><li>세 목록 중 <b>두 곳 이상<\/b>에 든 대학(18개)을 뽑고, Leiden P 순위로 15개로 자른다. 결과: 세 목록 모두 — 서울대·연세대·성균관대·고려대·경희대·중앙대·울산대(7). 두 목록 — 가톨릭대·부산대·경북대·전남대·한양대·가천대·충남대·건국대(8). <span class='note'>제외(두 목록에 들었으나 P 순위 밖): 이화여대·아주대·인하대. 한 목록만: 동국대·대구가톨릭대·영남대·한림대.<\/span><\/li><li>클라이언트 예시 4교(서울대·연세대·고려대·성균관대)는 규칙으로도 포함된다. 제외된 대학은 ‘후보 전체’ 보기에서 같은 지표로 볼 수 있다. 다른 결합 규칙(예: 순위 합산)을 쓰면 이화여대·아주대·인하대가 들어오고 전남대·가천대·충남대가 빠질 수 있으므로, 최종 15개는 클라이언트 확인 사항이다.<\/li><\/ol>", "method_limits": "<h3 style='margin-top:0'>한계<\/h3><ul><li>카테고리 초안 v0는 정밀도 표본 검사(200건·80% 기준) 전입니다. 넓은 조회식(M6·M7·M9·M11)은 과대, 좁은 조회식(R·M3)은 과소 집계될 수 있습니다.<\/li><li>PubMed 소속 검색은 문자열 일치라 표기 변형·누락이 있으며, ‘Korea University’ 문구는 ‘Korea University of Technology and Education’ 등도 일부 포함합니다.<\/li><li>덤프는 2020년 이후만 전량이고 저자 소속 결측이 커서 PubMed 편수와 직접 비교하면 안 됩니다.<\/li><li>2025년 데이터는 두 원천 모두 미완(색인·적재 진행 중)입니다.<\/li><li>지표는 연구 ‘활동’과 ‘인용 영향’의 대용이며 연구의 질·임상 성과를 직접 재지 않습니다.<\/li><li>덤프 조회 중 단일 용어로도 120초 제한을 넘긴 부분(아래 ‘미완 조회’ 목록)은 값이 빠져 있어 해당 카테고리·연도·기법의 편수와 세계 합계가 과소 집계됩니다. work_id 샤딩으로 재실행 중이며 끝나면 같은 주소에 갱신합니다.<\/li><\/ul><h4 style='margin:10px 0 4px'>표본 정밀도 (2026-09-18, 카테고리별 무작위 제목 6~8건 눈검사 — 정식 200건·80% 검사 전. 평균 K 약 85%, T 약 50%)<\/h4><div class='tablewrap'><table><thead><tr><th style='text-align:left'>카테고리<\/th><th>덤프 K 제목 키워드<\/th><th>덤프 T 주제명<\/th><th style='text-align:left'>주요 잡음<\/th><\/tr><\/thead><tbody><tr><td>R 희귀질환<\/td><td>6/8<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 보충자료 레코드(‘Additional file’), ‘a rare disease’ 일반 표현. T: 주제 ‘Cystic Fibrosis…’·‘Genetic and rare skin diseases’가 비희귀 논문 포함<\/td><\/tr><tr><td>M1 신경퇴행<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: 신경염증·교세포 기초연구 포함<\/td><\/tr><tr><td>M2 난치암(대체)<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: ‘Glioma…’·‘Pancreatic and Hepatic Oncology…’ 주제가 뇌종양 전반·간담췌 전반을 포함<\/td><\/tr><tr><td>M3 조기발견·액체생검<\/td><td>5/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>K: 이식 거부반응 cfDNA(비암) 포함. T: 대장암 검진 주제에 내시경 술기·영상 AI 포함<\/td><\/tr><tr><td>M4 척수손상·BCI<\/td><td>6/6<\/td><td>2/6<\/td><td style='text-align:left;white-space:normal'>T: ‘EEG and Brain-Computer Interfaces’ 주제가 수면·피로 EEG 분류 전반을 포함<\/td><\/tr><tr><td>M5 중증 정신질환<\/td><td>6/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>T: 정신의학 일반 논의 포함<\/td><\/tr><tr><td>M6 백신 플랫폼<\/td><td>4/6<\/td><td>2/6<\/td><td style='text-align:left;white-space:normal'>K: COVID-19 백신 임상·부작용 보고 포함. T: 감염병 역학·백신 접종률 사회연구 포함<\/td><\/tr><tr><td>M7 항생제 내성<\/td><td>5/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 환경(하수·작물) 내성유전자 포함. T: 일반 감염 역학 포함<\/td><\/tr><tr><td>M8 유전자치료·편집<\/td><td>4/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K·T: 비의학 CRISPR(균류·세균·농업) 포함<\/td><\/tr><tr><td>M9 세포치료<\/td><td>5/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>MSC 분화 기초연구 포함<\/td><\/tr><tr><td>M10 장기재생<\/td><td>4/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 골 재생 생체재료·오가노이드 기초연구 포함. T: 3D 프린팅 소재 일반·임상 이식 관리 포함<\/td><\/tr><tr><td>M11 노쇠·노화<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: 모델생물 노화 유전학(곤충 분류 논문까지)·근생성 기초연구 포함<\/td><\/tr><\/tbody><\/table><\/div><p class='note'>읽는 법: K(제목 키워드)는 정밀도가 높은 대신 재현율이 낮고(제목에만 걸림), T(주제명)는 넓게 잡혀 편수가 크지만 잡음이 커서 <b>참고용<\/b>입니다. PubMed 조회식은 MeSH와 초록까지 걸어 둘의 중간입니다. 기법 3종의 편수 차이 자체가 기준의 넓이를 보여 주는 데이터이며, 대학 간 비교는 같은 기법 안에서만 하십시오.<\/p><div id='gaps'><\/div>", "references": "<h3 style='margin-top:0'>참고문헌<\/h3><p class='note'>정의(A)·문샷(B)·지표(C)·순위(D) 근거는 <code>기준서_문헌근거_2026-09-18.md<\/code>(항목별 원문 인용·확인일 2026-09-18)에 정리돼 있으며 아래는 그 참고문헌 목록입니다. 데이터 원천: PubMed E-utilities(2026-09-18 조회), OpenAlex 덤프(Supabase BIBLOBOOK, 적재 2026-07-25).<\/p><ol class=\"ref\"><li>Advanced Research Projects Agency for Health. (n.d.-a). About us. <a href=\"https://arpa-h.gov/about\" target=\"_blank\" rel=\"noopener\">https://arpa-h.gov/about<\/a> (접근일 2026-09-18)<\/li><li>Advanced Research Projects Agency for Health. (n.d.-b). Frequently asked questions. <a hr 질병, 18(6), 305–319. <a href=\"https://doi.org/10.56786/PHWR.2025.18.6.3\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.56786/PHWR.2025.18.6.3<\/a><\/li><li>중앙일보. (2025, 11월 26일). 서울·연세·한양·고려·성균관…'톱5' 격차 더 줄었다 [2025 중앙일보 대학평가·종합평가]. <a href=\"https://v.daum.net/v/20251126050259072\" target=\"_blank\" rel=\"noopener\">https://v.daum.net/v/20251126050259072<\/a> (접근일 2026-09-18)<\/li><li>질병관리청. (n.d.). 희귀질환 지정. <a href=\"https://kdca.go.kr/kdca/3370/subview.do\" target=\"_blank\" rel=\"noopener\">https://kdca.go.kr/kdca/3370/subview.do<\/a> (접근일 2026-09-18)<\/li><li>질병관리청. (2025, 11월 27일). '선천성 기능성 단장증후군' 등 75개 국가관리대상 희귀질환 신규 지정 [보도자료]. <a href=\"https://www.kdca.go.kr/bbs/kdca/42/215489/artclView.do?layout=unknown\" target=\"_blank\" rel=\"noopener\">https://www.kdca.go.kr/bbs/kdca/42/215489/artclView.do?layout=unknown<\/a> (접근일 2026-09-18)<\/li><li>한국대학신문. (2026, 6월 18일). [2027 QS 세계대학평가] 서울대 국내 대학 1위… 연·고대 동반 상승에 KAIST 1년 만에 복귀. <a href=\"https://news.unn.net/news/articleView.html?idxno=593622\" target=\"_blank\" rel=\"noopener\">https://news.unn.net/news/articleView.html?idxno=593622<\/a> (접근일 2026-09-18)<\/li><li>희귀질환관리법, 법률 제20547호 (2024. 12. 3. 일부개정, 2025. 6. 4. 시행). 국가법령정보센터. <a href=\"https://www.law.go.kr/법령/희귀질환관리법\" target=\"_blank\" rel=\"noopener\">https://www.law.go.kr/법령/희귀질환관리법<\/a> (접근일 2026-09-18)<\/li><\/ol>", "report_intro": "<p>이 보고서는 대시보드와 같은 데이터(집계 JSON)에서 실시간으로 계산됩니다. 문서 성격은 <b>기초데이터(해석 미포함)<\/b>이며, 카테고리는 초안 v0(클라이언트 정의서 후보안), 비교군은 핵심 15개 대학(선정 규칙은 ⑥)입니다. 성균관대는 클라이언트 요청(2026-09-18 카카오톡)에 따라 이 보고서에서는 기본 강조하되, 모든 대학에 같은 지표·같은 산식을 적용한 상대 위치만 표시합니다.<\/p>", "report_r_diag": "<p><b>무엇이 문제인가.<\/b> 희귀질환(R) 트랙은 세 조회 기법의 결과 차이가 문샷 카테고리보다 훨씬 큽니다. 제목에 ‘rare disease/disorder’, ‘orphan drug/disease’ 문구가 그대로 있는 논문(덤프 K)은 세계 6년 합계가 수천 편에 그치는 반면, OpenAlex 주제명(덤프 T: 희귀질환 유전체학·리소좀축적질환·유전성 대사질환·유전성 신경퇴행·낭포성섬유증·혈우병·희귀 피부질환)으로 잡으면 수십 배가 됩니다. PubMed(MeSH ‘Rare Diseases’+제목·초록 문구)는 그 사이에 있습니다. 개별 질환명(고셔병, 척수성 근위축증, 파브리병 등)으로 쓰인 논문은 제목이나 초록에 ‘희귀질환’이라는 말을 쓰지 않으므로 문구 기반 조회에서 빠집니다. 클라이언트가 2026-09-18 회신에서 지적한 그대로입니다.<\/p><p><b>어느 값이 맞나.<\/b> 어느 하나가 정답은 아닙니다. 문구 기반은 하한(정밀도 높음, 재현율 낮음), 주제명 기반은 상한에 가깝고(표본 정밀도 3/6, 비희귀 논문 포함), 정본은 <b>질병관리청 국가관리대상 희귀질환 목록(1,389종)을 Orphanet에 매핑한 질환명 사전<\/b>으로 제목·초록·MeSH를 조회하는 방식입니다. 선행 조사(2026-09-16)는 이 방식으로 성균관대 의대·병원 2006–2025 논문 59,021편 중 1,753편(2.97%)을 희귀질환 핵심 논문으로 식별했습니다. 그래서 이 보고서는 R을 M1~M11과 같은 표에 놓지 않고 진단으로만 보여 줍니다.<\/p><p><b>권고.<\/b> ① 질환명 사전(질병관리청→Orphanet)으로 22개 대학 전체를 같은 방식으로 재조회해 R 열을 교체한다. ② Orphanet 분류(신경·대사·혈액·피부 등)로 R 안의 하위 카테고리를 만들어 ‘희귀질환 중 문샷 난제’(유전자치료·세포치료 등과의 교차)를 셀 수 있게 한다. ③ 교체 전까지는 R 열을 대학 간 비교에 쓰지 않는다.<\/p>", "report_next": "<ul><li><b>R 트랙 재구축<\/b> — 질환명 사전 기반 재조회(PubMed [tiab]+MeSH, 덤프 제목), Orphanet 분류로 하위 카테고리화.<\/li><li><b>카테고리 확정<\/b> — 문샷 판정 축(성공 확률·파급효과·난이도) 문헌 조작화, 정의서 11개 영역과 대조, 정밀도 200건 표본 검사(특히 M6·M8·M10, T 전반).<\/li><li><b>세 번째 원천<\/b> — OpenAlex API(초록 키워드·기관 계보·인용 백분위) 예산 확보 후 열 추가.<\/li><li><b>비교군 확정<\/b> — 핵심 15개 규칙(이 판 vs 순위 합산 규칙)의 차이 3개 대학을 클라이언트가 확정.<\/li><li><b>보충 비교<\/b> — 성균관대 자체 DB(BIBLO-RIMS) 재집계와의 대조(클라이언트 보고서 ‘보충’ 절)를 정식 절로 편입.<\/li><\/ul>", "files": [{"path": "data/README.md", "label": "파일 설명·원천·조회식 버전·라이선스", "type": "Markdown"}, {"path": "data/indicators_2021-2025.csv", "label": "대학 × 카테고리 지표표 (정의서 기본 기간 2021–2025): 편수·국내 점유율·활동지수·성장률·덤프 편수 K/T·세계 점유율·FWCI·FWCI≥2 비중", "type": "CSV"}, {"path": "data/indicators_2016-2025.csv", "label": "대학 × 카테고리 지표표 (2016–2025, 덤프 지표는 2020–2025)", "type": "CSV"}, {"path": "data/pubmed_yearly.csv", "label": "PubMed 연도별 건수 (카테고리 × 범위(22개 대학·한국·세계) × 연도, long 형식)", "type": "CSV"}, {"path": "data/works_2020-2025.csv", "label": "논문 단위 데이터 (OpenAlex 덤프, 22개 대학, 2020–2025): work_id, doi, title, journal, year, group, category, methods(K/T), fwci, cited_by", "type": "CSV"}, {"path": "data/categories.csv", "label": "카테고리 사전: 코드·이름·트랙·묶음·PubMed 조회식·덤프 제목 tsquery·OpenAlex 주제명·비고", "type": "CSV"}, {"path": "data/groups.csv", "label": "대학 그룹 사전: 덤프 소속 표시명·PubMed 소속 문구·OpenAlex lineage ID·핵심 비교군 여부", "type": "CSV"}, {"path":   if(it.value!=null){const x0=x(Math.min(0,it.value)),x1=x(Math.max(0,it.value));const r=mk('rect',{x:x0,y:y+4,width:Math.max(1,x1-x0),height:rowH-8,rx:3,fill:it.skku&&state.skku?'var(--skku)':'var(--seq8)'});svg.append(r);const vt=mk('text',{x:x1+5,y:y+15,'font-size':10.5,fill:'var(--ink-2)','font-family':'var(--font-m)'});vt.textContent=fmt[M.fmt](it.value);svg.append(vt);}
  else{const vt=mk('text',{x:padL+5,y:y+15,'font-size':10.5,fill:'var(--ink-3)','font-family':'var(--font-m)'});vt.textContent='–';svg.append(vt);}});
 const box=el('div',{class:'chart'},el('h4',{},title),svg);return box;
}
function lineChart(title,years,series){
 const w=760,h=260,padL=52,padR=16,padT=12,padB=30;const NS='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};
 const all=series.flatMap(s=>s.values).filter(v=>v!=null);const max=Math.max(1,...all);const x=i=>padL+i*(w-padL-padR)/Math.max(1,years.length-1);const y=v=>padT+(1-v/max)*(h-padT-padB);
 const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':title});
 for(let i=0;i<=4;i++){const v=max*i/4;svg.append(mk('line',{x1:padL,x2:w-padR,y1:y(v),y2:y(v),stroke:'var(--line-2)'}));const t=mk('text',{x:padL-6,y:y(v)+3,'text-anchor':'end','font-size':10,fill:'var(--ink-3)','font-family':'var(--font-m)'});t.textContent=Math.round(v).toLocaleString();svg.append(t);}
 years.forEach((yr,i)=>{const t=mk('text',{x:x(i),y:h-10,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)','font-family':'var(--font-m)'});t.textContent=yr;svg.append(t);});
 series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;svg.append(mk('path',{d:'M'+pts.map(p=>p.join(',')).join('L'),fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round'}));const last=pts[pts.length-1];svg.append(mk('circle',{cx:last[0],cy:last[1],r:3.5,fill:s.color,stroke:'var(--surface)','stroke-width':2}));
  s.values.forEach((v,i)=>{if(v==null)return;const c=mk('circle',{cx:x(i),cy:y(v),r:8,fill:'transparent'});c.addEventListener('mouseenter',e=>showTip(e,`<b>${s.name}</b> ${years[i]}<br>${v.toLocaleString()} 편`));c.addEventListener('mousemove',moveTip);c.addEventListener('mouseleave',hideTip);svg.append(c);});});
 const leg=el('div',{class:'legend'},...series.map(s=>el('span',{},el('span',{class:'sw',style:`background:${s.color}`}),s.name)));
 return el('div',{class:'chart'},el('h4',{},title),svg,leg);
}

function radarChart(title,axes,series,note){
 const w=620,h=560,cx=310,cy=290,R=200,n=axes.length;const NS='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};
 const ang=i=>-Math.PI/2+i*2*Math.PI/n;const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
 const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':title});
 [25,50,75,100].forEach(v=>{const d=axes.map((a,i)=>pt(i,R*v/100).join(',')).join(' ');svg.append(mk('polygon',{points:d,fill:v===100?'var(--surface-2)':'none',stroke:'var(--line)','stroke-width':1}));const t=mk('text',{x:cx+4,y:cy-R*v/100-2,'font-size':9,fill:'var(--ink-3)','font-family':'var(--font-m)'});t.textContent=v;svg.append(t);});
 axes.forEach((a,i)=>{const [x,y]=pt(i,R);svg.append(mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'var(--line)'}));const [lx,ly]=pt(i,R+26);const c=Math.cos(ang(i));const t=mk('text',{x:lx,y:ly+4,'text-anchor':Math.abs(c)<0.2?'middle':(c>0?'start':'end'),'font-size':11,fill:'var(--ink)','font-family':'var(--font-b)'});t.textContent=a.code;svg.append(t);const t2=mk('text',{x:lx,y:ly+16,'text-anchor':Math.abs(c)<0.2?'middle':(c>0?'start':'end'),'font-size':9.5,fill:'var(--ink-3)','font-family':'var(--font-b)'});t2.textContent=a.label;svg.append(t2);});
 series.forEach(sr=>{const d=sr.values.map((v,i)=>pt(i,R*Math.max(0,Math.min(100,v||0))/100).join(',')).join(' ');svg.append(mk('polygon',{points:d,fill:sr.color,'fill-opacity':0.16,stroke:sr.color,'stroke-width':2,'stroke-linejoin':'round'}));sr.values.forEach((v,i)=>{const [x,y]=pt(i,R*Math.max(0,Math.min(100,v||0))/100);const c=mk('circle',{cx:x,cy:y,r:3.5,fill:sr.color,stroke:'var(--surface)','stroke-width':1.5});svg.append(c);const hit=mk('circle',{cx:x,cy:y,r:9,fill:'transparent'});hit.addEventListener('mouseenter',e=>showTip(e,`<b>${sr.name}</b> · ${axes[i].code} ${axes[i].label}<br>정규화 ${v==null?'–':v.toFixed(0)} (1위=100)${sr.raw?` · 원값 ${sr.raw[i]??'–'}`:''}`));hit.addEventListener('mousemove',moveTip);hit.addEventListener('mouseleave',hideTip);svg.append(hit);});});
 const leg=el('div',{class:'legend'},...series.map(sr=>el('span',{},el('span',{class:'sw',style:`background:${sr.color}`}),sr.name)),note?el('span',{class:'note'},note):null);
 return el('div',{class:'chart'},el('h4',{},title),svg,leg);
}
function rTable(head,rows,opts={}){const t=el('table');t.append(el('thead',{},el('tr',{},...head.map((h,i)=>el('th',{style:i===0?'text-align:left':''},h)))));const tb=el('tbody');rows.forEach(r=>{const tr=el('tr',{class:r.skku&&state.skku?'skku':''});r.cells.forEach((c,i)=>tr.append(el('td',{class:i>0?'num':'',style:i===0?'text-align:left':''},c)));tb.append(tr);});t.append(tb);return el('div',{class:'tablewrap'},t);}
function report(){
 const s=el('section',{class:'panel report'});
 s.append(el('h2',{},'보고서'),el('p',{class:'lead'},'클라이언트 보고서 서식(문서 구성·절·표)을 그대로 두고, 문서에 내장된 데이터만 검증된 완전판으로 교체했습니다. 수치는 대시보드와 같은 집계 데이터에서 계산됩니다.'));
 s.append(el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px'},el('a',{class:'btn primary',href:'report.html',target:'_blank',rel:'noopener'},'새 창으로 열기 (배포 사이트)'),el('button',{class:'btn',onclick:()=>{const f=$('#report-frame');if(f&&f.contentWindow)f.contentWindow.print();}},'인쇄 / PDF 저장')));
 const f=el('iframe',{id:'report-frame',title:'보고서',style:'width:100%;height:88vh;border:1px solid var(--line);border-radius:10px;background:#e8e8e8'});
 f.setAttribute('srcdoc',TEXT.report_html||'<p style="font-family:sans-serif;padding:20px">보고서 파일이 없습니다.</p>');
 s.append(f,el('p',{class:'note'},'보고서 안의 조작판(기간·강조·CSV·JSON·PDF)은 보고서 자체 기능입니다. 아티팩트 뷰어에서는 글꼴(Pretendard)과 파일 저장이 차단될 수 있으며, 배포 사이트에서는 모두 동작합니다.'));
 main.append(s);
}

const chips=$('#chips');const dumpDone=Object.values(DATA.meta.dump_done||{}).reduce((a,v)=>a+v.K+v.T,0),dumpTot=CATS.length*YD.length*2;const partial=DATA.meta.pubmed_done<DATA.meta.pubmed_total||dumpDone<dumpTot;if(partial){const c=el('span',{class:'chip',style:'border-color:var(--warn);color:var(--warn);font-weight:600'},`잠정판 · 수집 진행 중 (PubMed ${Math.round(DATA.meta.pubmed_done/DATA.meta.pubmed_total*100)}%, 덤프 ${Math.round(dumpDone/dumpTot*100)}%)`);chips.append(c);}[`기준일 ${DATA.meta.built}`,`PubMed ${YP[0]}–${YP[YP.length-1]}`,`OpenAlex 덤프 ${YD[0]}–${YD[YD.length-1]}`,`카테고리 ${DATA.meta.cat_version||'초안 v0'}`,`비교군 핵심 ${CORE.size} / 후보 ${GROUPS.length}`].forEach(t=>chips.append(el('span',{class:'chip'},t)));
render();
