<script>
function fitStage(){const st=document.getElementById('stage');if(!st)return;
 const k=Math.min(innerWidth/1600,innerHeight/900);
 st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;}
fitStage();addEventListener('resize',fitStage);addEventListener('load',fitStage);addEventListener('pageshow',fitStage);
