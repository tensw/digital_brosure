<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noai, noimageai, noindex, nofollow, noarchive">
<title>독립운동 인명사전 그래프 정제·정규화 발표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#060a16;overflow:hidden;
 font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.deck{position:relative;height:100vh;overflow-y:auto;overflow-x:hidden;
 scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.deck::-webkit-scrollbar{display:none}
.slide{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.slide iframe{border:0;width:100%;height:100%;display:block;background:transparent}
/* 모바일 전용 사이트는 휴대전화 화면 꼴로 가운데에 보인다(2026-10-02 · 독립잇다) */
.slide.mobile{display:flex;align-items:center;justify-content:center;gap:40px;background:radial-gradient(900px 700px at 50% 30%,#0b1226 0%,#060a16 60%,#03050c 100%)}
.phone{position:relative;height:min(90vh,880px);aspect-ratio:430/880;flex:none;border-radius:44px;border:10px solid #1b2238;background:#000;overflow:hidden;
 box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(150,180,235,.25),0 0 60px rgba(125,211,252,.08)}
.phone::before{content:"";position:absolute;left:50%;top:10px;width:112px;height:26px;margin-left:-56px;border-radius:14px;background:#0a0d18;z-index:3}
.phone iframe{width:100%;height:100%;background:#fff}
.mobile .side{color:#8ba0c8;font:600 12px/1.9 ui-monospace,Menlo,monospace;letter-spacing:.06em;max-width:300px}
.mobile .side b{display:block;color:#e6efff;font:800 24px/1.25 "Pretendard","Apple SD Gothic Neo",sans-serif;letter-spacing:-.6px;margin-bottom:10px}
.mobile .side i{font-style:normal;color:#7dd3fc}

/* 좌측 눈금 네비 */
.nav{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:10;
 display:flex;flex-direction:column;gap:4px;padding:14px 20px 14px 8px}
.ns{all:unset;cursor:pointer;position:relative;display:block;width:24px;height:9px}
.ns i{position:absolute;left:0;top:0;height:100%;width:3px;border-radius:2px;
 background:rgba(150,180,235,.28);transition:width .22s cubic-bezier(.2,.8,.2,1),background .22s ease,box-shadow .22s ease}
.ns:hover i{width:12px;background:rgba(190,215,255,.6)}
.ns[aria-current="true"] i{width:18px;background:#7dd3fc;box-shadow:0 0 12px rgba(125,211,252,.85),0 0 26px rgba(125,211,252,.35)}
.ns b{position:absolute;left:0;top:50%;transform:translate(14px,-50%) scale(.92);transform-origin:left center;
 opacity:0;pointer-events:none;white-space:nowrap;font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;
 color:#e6efff;padding:5px 9px;border-radius:7px;background:rgba(6,10,24,.9);border:1px solid rgba(150,180,235,.24);
 box-shadow:0 8px 22px -10px rgba(0,0,0,.95);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.ns:hover b,.ns[aria-current="true"] b{opacity:1;transform:translate(20px,-50%) scale(1)}
/* 손을 떼면 3초 뒤 네비가 사라진다(2026-10-02 대표 「좌측 미리보기가 시간 지나면 사라지게」) · 마우스를 움직이거나 왼쪽 가장자리에 대면 다시 보인다 */
.nav{transition:opacity .45s ease}
body.idle .nav{opacity:0;pointer-events:none}
.navzone{position:fixed;left:0;top:0;width:72px;height:100vh;z-index:9}

/* 우하단 카운터 */
.cap{position:fixed;right:22px;bottom:20px;z-index:10;
 font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#8ba0c8;
 background:rgba(6,10,24,.7);border:1px solid rgba(150,180,235,.2);padding:8px 13px;border-radius:20px;
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cap b{color:#e6efff}
@media print{.nav,.cap{display:none}.deck{height:auto;overflow:visible}
 .slide{page-break-after:always;height:100vh}}
</style></head><body>
<div class="deck" id="deck"></div>
<div class="navzone" id="navzone" aria-hidden="true"></div>
<nav class="nav" id="nav"></nav>
<div class="cap" id="cap"><b>1</b> / 8</div>
<script>
var SLIDES=[
 ['insam-s0.html','표지 · 독립운동 인명사전 그래프 정제·정규화'],
 ['insam-s1.html','1부 정제 이유 · 데이터 정제의 필요성'],
 ['insam-dict.html','1부 정제 이유 · 역사기록물사전 · 전문가 자료를 사전으로 세워 AI 추출에 먼저 적용'],
 ['insam-map.html','1부 정제 이유 · 전체 지도'],
 ['https://cms.i815.or.kr/review/b5d5fd98dc0ef8ec/index.html#p=8862','본문 한 편의 추출·정제 요약(한용운 · 운영 화면)'],
 ['https://dooroo.net/museum/sdm','독립잇다 · dooroo.net/museum/sdm · 모바일 화면','mobile'],
 ['https://v0-indp.vercel.app/#k=tsw1234','INDP 산출물 문서 사이트 · 독립운동 사건 아카이브(v0-indp)'],
 ['insam-thanks.html','감사합니다 · 중간보고 마침']
];
var deck=document.getElementById('deck'),nav=document.getElementById('nav'),cap=document.getElementById('cap');
var N=SLIDES.length,cur=0;
SLIDES.forEach(function(s,i){
 var sec=document.createElement('section');sec.className='slide'+(s[2]==='mobile'?' mobile':'');
 var f=document.createElement('iframe');f.title=s[1];
 f.setAttribute('allow','geolocation *; fullscreen');     /* 독립잇다는 위치 권한을 쓴다. 프레임에 권한을 넘겨야 브라우저가 묻는다 */
 /* 바깥 사이트 장은 그 장에 왔을 때 읽는다. 미리 읽으면 그 사이트가 입력칸에 focus() 를 걸 때 덱이 그 장으로 튀어 버린다(2026-10-02 실측 · v0-indp 비밀번호 칸) */
 if(/^https?:/.test(s[0])){f.dataset.src=s[0];}else{f.src=s[0];if(i>0)f.loading='lazy';}
 /* 바깥 사이트가 읽히면서 키보드 초점을 가져가면(입력칸 focus) 방향키가 덱에 안 온다 → 읽힌 직후 한 번만 초점을 덱으로 되돌린다(발표자가 프레임 안을 누른 뒤에는 그대로 둔다) */
 f.addEventListener('load',function(){setTimeout(function(){if(document.activeElement===f){f.blur();window.focus();}},400);});
 if(s[2]==='mobile'){
  var ph=document.createElement('div');ph.className='phone';ph.appendChild(f);
  var sd=document.createElement('div');sd.className='side';
  sd.innerHTML='<b>독립잇다</b>모바일 전용 서비스 · <i>dooroo.net/museum/sdm</i><br>휴대전화 화면 비율(430×880)로 표시<br>위치 권한을 쓰는 화면 · 브라우저가 묻면 「허용」';
  sec.appendChild(ph);sec.appendChild(sd);deck.appendChild(sec);
 }else{
 /* 같은 폴더의 슬라이드 안을 누른 뒤에도 방향키가 먹게: 그 문서의 키를 덱으로 넘긴다(바깥 사이트 화면은 넘기지 못함) */
 if(!/^https?:/.test(s[0]))f.addEventListener('load',function(){try{var cd=f.contentDocument;cd.addEventListener('keydown',onKey);['mousemove','mousedown','touchstart','wheel'].forEach(function(ev){cd.addEventListener(ev,function(){if(typeof wake==='function')wake();},{passive:true});});}catch(e){}});
 sec.appendChild(f);deck.appendChild(sec);
 }
 var b=document.createElement('button');b.className='ns';b.setAttribute('aria-label',(i+1)+'. '+s[1]);
 b.innerHTML='<i></i><b>'+(i+1)+'. '+s[1]+'</b>';
 b.onclick=function(){go(i)};nav.appendChild(b);
});
var slides=[].slice.call(deck.querySelectorAll('.slide'));
var navs=[].slice.call(nav.querySelectorAll('.ns'));
function setActive(i){cur=i;cap.innerHTML='<b>'+(i+1)+'</b> / '+N;
 navs.forEach(function(n,k){n.setAttribute('aria-current',k===i?'true':'false')});
 /* 바깥 사이트 장은 스크롤이 그 장에 멈춘 뒤에 읽는다(지나가는 길에 읽으면 그 사이트가 덱을 끌어당길 수 있다) */
 clearTimeout(setActive.t);setActive.t=setTimeout(function(){if(cur!==i)return;var f=slides[i].querySelector('iframe');if(f&&f.dataset.src){f.src=f.dataset.src;delete f.dataset.src;}},450);}
function go(i){i=Math.max(0,Math.min(N-1,i));slides[i].scrollIntoView({behavior:'smooth'});setActive(i);if(typeof wake==='function')wake();}
if('IntersectionObserver' in window){
 var io=new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=0.5){setActive(slides.indexOf(e.target));}});
 },{root:deck,threshold:[0.5]});
 slides.forEach(function(s){io.observe(s)});
}
setActive(0);
function onKey(e){
 if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
 else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
 else if(e.key==='Home'){e.preventDefault();go(0);}
 else if(e.key==='End'){e.preventDefault();go(N-1);}
}
document.addEventListener('keydown',onKey);
/* 네비 자동 숨김: 마우스·키·터치가 3초 없으면 숨기고, 움직임이 있으면 보인다. 바깥 사이트 장 위에서는 마우스 움직임이 덱에 안 오므로 왼쪽 띠(navzone)에 대면 보인다 */
var idleT=null;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},3000);}
['mousemove','mousedown','keydown','touchstart','wheel'].forEach(function(ev){document.addEventListener(ev,wake,{passive:true});});
document.getElementById('navzone').addEventListener('mouseenter',wake);nav.addEventListener('mouseenter',wake);
wake();
</script></body></html>
