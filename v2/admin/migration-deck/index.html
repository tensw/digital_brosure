<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noai, noimageai, noindex, nofollow, noarchive">
<title>도서관 홈페이지 이관 · 무엇이 있었고, 무엇을 바꾸는가</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#060a16;overflow:hidden;font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.deck{position:relative;height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.deck::-webkit-scrollbar{display:none}
.slide{height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.slide iframe{border:0;width:100%;height:100%;display:block;background:transparent}
.nav{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:4px;padding:14px 20px 14px 8px}
.ns{all:unset;cursor:pointer;position:relative;display:block;width:24px;height:9px}
.ns i{position:absolute;left:0;top:0;height:100%;width:3px;border-radius:2px;background:rgba(150,180,235,.28);transition:width .22s cubic-bezier(.2,.8,.2,1),background .22s ease,box-shadow .22s ease}
.ns:hover i{width:12px;background:rgba(190,215,255,.6)}
.ns[aria-current="true"] i{width:18px;background:#7dd3fc;box-shadow:0 0 12px rgba(125,211,252,.85),0 0 26px rgba(125,211,252,.35)}
.ns b{position:absolute;left:0;top:50%;transform:translate(14px,-50%) scale(.92);transform-origin:left center;opacity:0;pointer-events:none;white-space:nowrap;font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#e6efff;padding:5px 9px;border-radius:7px;background:rgba(6,10,24,.9);border:1px solid rgba(150,180,235,.24);box-shadow:0 8px 22px -10px rgba(0,0,0,.95);transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.ns:hover b,.ns[aria-current="true"] b{opacity:1;transform:translate(20px,-50%) scale(1)}
.cap{position:fixed;right:22px;bottom:20px;z-index:10;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#8ba0c8;background:rgba(6,10,24,.7);border:1px solid rgba(150,180,235,.2);padding:8px 13px;border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cap b{color:#e6efff}
@media print{.nav,.cap{display:none}.deck{height:auto;overflow:visible}.slide{page-break-after:always;height:100vh}}
</style></head><body>
<div class="deck" id="deck"></div>
<nav class="nav" id="nav"></nav>
<div class="cap" id="cap"><b>1</b> / 15</div>
<script>
var SLIDES=[
 [
  "s0.html",
  "표지 · 무엇이 있었고, 무엇을 바꾸는가"
 ],
 [
  "s1.html",
  "1부 지금까지 · 프로젝트와 등장 주체"
 ],
 [
  "s2.html",
  "1부 지금까지 · 화면은 우리, 데이터는 LAS"
 ],
 [
  "s3.html",
  "1부 지금까지 · 경과"
 ],
 [
  "s4.html",
  "1부 지금까지 · 주소 세 개"
 ],
 [
  "s5.html",
  "2부 확인된 문제 · ① 화면은 재현했고, 창구는 없었다"
 ],
 [
  "s6.html",
  "2부 확인된 문제 · ② 화면에 보이지 않는 의존"
 ],
 [
  "s7.html",
  "2부 확인된 문제 · ③ 위험은 적혀 있었다"
 ],
 [
  "s8.html",
  "2부 확인된 문제 · ④ 「종료」의 범위가 정해지지 않았다"
 ],
 [
  "s9.html",
  "2부 확인된 문제 · ⑤ 오늘 상태"
 ],
 [
  "s10.html",
  "3부 업무 방식 변경 · 원칙"
 ],
 [
  "s11.html",
  "3부 업무 방식 변경 · 미팅에서 확정할 다섯 가지"
 ],
 [
  "s12.html",
  "3부 업무 방식 변경 · 영향범위 점검표"
 ],
 [
  "s13.html",
  "3부 업무 방식 변경 · 전환·종료 관문"
 ],
 [
  "s14.html",
  "3부 업무 방식 변경 · 오늘 정할 것과 보고서 양식"
 ]
];
var deck=document.getElementById('deck'),nav=document.getElementById('nav'),cap=document.getElementById('cap');
var N=SLIDES.length,cur=0;
SLIDES.forEach(function(s,i){
 var sec=document.createElement('section');sec.className='slide';
 var f=document.createElement('iframe');f.src=s[0];f.title=s[1];if(i>0)f.loading='lazy';
 sec.appendChild(f);deck.appendChild(sec);
 var b=document.createElement('button');b.className='ns';b.setAttribute('aria-label',(i+1)+'. '+s[1]);
 b.innerHTML='<i></i><b>'+(i+1)+'. '+s[1]+'</b>';b.onclick=function(){go(i)};nav.appendChild(b);
});
var slides=[].slice.call(deck.querySelectorAll('.slide')),navs=[].slice.call(nav.querySelectorAll('.ns'));
function setActive(i){cur=i;cap.innerHTML='<b>'+(i+1)+'</b> / '+N;navs.forEach(function(n,k){n.setAttribute('aria-current',k===i?'true':'false')});}
function go(i){i=Math.max(0,Math.min(N-1,i));slides[i].scrollIntoView({behavior:'smooth'});setActive(i);}
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=0.5){setActive(slides.indexOf(e.target));}});},{root:deck,threshold:[0.5]});slides.forEach(function(s){io.observe(s)});}
setActive(0);
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();go(cur+1);}
 else if(e.key==='ArrowUp'||e.key==='PageUp'||e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
 else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(N-1);}
});
/* iframe 안에서 누른 키도 덱이 받는다 */
window.addEventListener('message',function(e){if(e.data&&e.data.deckKey){document.dispatchEvent(new KeyboardEvent('keydown',{key:e.data.deckKey}));}});
</script></body></html>
