<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초대자 관리 — BIBLO</title>
<style>
:root{--ink:#e9eefb;--ink2:#93a6cc;--ink3:#5d7099;--line:rgba(140,170,240,.20)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font:15px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 color:var(--ink);background:radial-gradient(1100px 800px at 50% -8%,#0d1430 0%,#070b18 56%,#05070f 100%);
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:34px 32px 60px}
.top{display:flex;align-items:center;gap:16px}
.top img{height:26px;width:auto;display:block}
.top h1{margin-left:6px;font-size:19px;font-weight:800;letter-spacing:-.5px}
.top .sp{flex:1}
.top a{font:700 11.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--ink3);text-decoration:none}
.top a:hover{color:var(--ink2)}
.top a.go{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 22px;border-radius:999px;
 font:800 14.5px/1 "Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-.4px;
 color:#08122c;background:linear-gradient(140deg,#7fd8f5,#9fb4ff);
 box-shadow:0 14px 30px -12px rgba(90,170,255,.9);transition:filter .16s,transform .16s}
.top a.go:hover{filter:brightness(1.07);color:#08122c}
.top a.go:active{transform:translateY(1px)}
.top a.go i{font-style:normal;font-size:16px;line-height:1}

.sum{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc{padding:15px 17px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sc u{display:block;text-decoration:none;font:700 9.6px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.16em;color:var(--ink3)}
.sc b{display:block;margin-top:9px;font-size:26px;font-weight:800;letter-spacing:-1px}

.box{margin-top:22px;padding:18px 20px;border-radius:16px;
 background:rgba(255,255,255,.035);border:1px solid var(--line)}
.box h2{font-size:14px;font-weight:800;letter-spacing:-.4px}
.box p{margin-top:6px;font-size:12.5px;color:var(--ink3);letter-spacing:-.2px}
textarea{all:unset;box-sizing:border-box;display:block;width:100%;min-height:74px;margin-top:12px;
 padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);
 color:var(--ink);font:14px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap}
textarea:focus{border-color:rgba(120,200,255,.55)}
.act{margin-top:12px;display:flex;align-items:center;gap:12px}
button{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:36px;padding:0 16px;
 border-radius:999px;font-size:13px;font-weight:800;letter-spacing:-.3px;color:#08122c;
 background:linear-gradient(140deg,#7fd8f5,#9fb4ff);transition:filter .16s,transform .16s}
button:hover{filter:brightness(1.06)} button:active{transform:translateY(1px)}
button[disabled]{opacity:.5;cursor:default}
button.ghost{background:none;color:var(--ink2);border:1px solid var(--line);height:28px;padding:0 11px;
 font-size:11.5px;font-weight:700}
button.ghost:hover{color:var(--ink);border-color:rgba(150,190,255,.5)}
.msg{font-size:12.5px;font-weight:700;letter-spacing:-.2px;color:#7ee6b0}
.msg.err{color:#ff9d9d}

table{width:100%;margin-top:22px;border-collapse:collapse}
th{text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--line);
 font:700 9.8px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--ink3)}
th.n,td.n{text-align:right}
td{padding:12px;border-bottom:1px solid rgba(140,170,240,.08);font-size:13.5px;letter-spacing:-.3px}
td.em{font:700 13px/1.4 ui-monospace,Menlo,monospace;color:#dfe8ff}
td.n{font:700 14px/1 ui-monospace,Menlo,monospace}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;
 font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em}
.t-none{background:rgba(150,160,210,.12);border:1px solid rgba(150,165,220,.26);color:#9aa8d4}
.t-new{background:rgba(255,190,90,.14);border:1px solid rgba(255,190,90,.3);color:#ffc978}
.t-ok{background:rgba(56,214,248,.13);border:1px solid rgba(120,200,240,.3);color:#8fe6ff}
.t-adm{background:rgba(160,140,255,.16);border:1px solid rgba(180,160,255,.34);color:#c9b6ff}
.dim{color:var(--ink3)}
@media(max-width:820px){.sum{grid-template-columns:repeat(2,1fr)}}
button.sec{background:#eef1f6;color:#44506b;border:1px solid #d3dae6}
button.sec:hover{background:#e3e8f0}
.kst{font-weight:700}
</style></head><body>
<div class="wrap">
 <div class="top">
  <img src="/assets/fav/biblo-logo-light.png" alt="BIBLO">
  <h1>초대자 관리</h1>
  <span class="sp"></span>
  <a class="go" href="/2026/">자료 보기 <i>→</i></a>
  <a href="/account/">비밀번호 변경</a>
  <a href="#" id="out">로그아웃</a>
 </div>

 <div class="sum" id="sum"></div>

 <div class="box">
  <h2>초대 추가</h2>
  <p>이메일을 줄바꿈이나 쉼표로 구분해 넣습니다. 초대된 이메일만 초기 비밀번호 <b>1234</b> 로 처음 들어올 수 있습니다.</p>
  <textarea id="inv" placeholder="name@example.com&#10;name2@example.com"></textarea>
  <div class="act"><button id="add">초대하기</button><span class="msg" id="m"></span></div>
 </div>

 <div class="box">
  <h2>BK21 질문 라우팅 키</h2>
  <p>질문 문장을 레시피로 고르는 데 Gemini 를 씁니다.
   키가 없으면 낱말 매칭으로만 돌아갑니다(화면은 멀쩡합니다).
   키는 서버 파일에만 저장되고 화면으로 다시 나오지 않습니다.
   <b class="kst" id="kst">확인 중</b></p>
  <textarea id="gk" placeholder="AIzaSy… 로 시작하는 Gemini API 키" rows="2"></textarea>
  <div class="act"><button id="ksave">저장</button>
   <button id="kclr" class="sec">지우기</button><span class="msg" id="km"></span></div>
 </div>

 <table>
  <thead><tr>
   <th>이메일</th><th>상태</th><th class="n">접속</th>
   <th>처음 접속</th><th>마지막 접속</th><th>조치</th>
  </tr></thead>
  <tbody id="tb"></tbody>
 </table>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=t=>{ if(!t) return '—';
 const d=new Date(t), p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };

async function api(body){
 const r=await fetch('/api/auth/admin',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)});
 return r.json();
}
function say(t,err){ const m=$('#m'); m.className='msg'+(err?' err':''); m.textContent=t;
 if(t) setTimeout(()=>{m.textContent='';},4000); }

/* ── BK21 질문 라우팅 키 ── */
function ksay(t,err){ const m=$('#km'); m.className='msg'+(err?' err':''); m.textContent=t;
 if(t) setTimeout(()=>{m.textContent='';},4000); }
async function kdraw(){
 const j=await api({op:'keyStatus'});
 $('#kst').textContent = j&&j.set ? '설정됨 · '+j.masked : '아직 없음';
 $('#kst').style.color = j&&j.set ? '#3f9e73' : '#b06a3a';
}
$('#ksave').onclick=async()=>{
 const k=$('#gk').value.trim();
 if(!k) return ksay('키를 넣어 주십시오.',1);
 const j=await api({op:'keySet',key:k});
 $('#gk').value='';
 ksay(j&&j.ok?'저장했습니다. 바로 켜집니다.':(j&&j.msg)||'저장하지 못했습니다.', !(j&&j.ok));
 kdraw();
};
$('#kclr').onclick=async()=>{
 if(!confirm('키를 지우면 질문 라우팅이 낱말 매칭으로 돌아갑니다. 지울까요?')) return;
 const j=await api({op:'keyClear'});
 ksay(j&&j.ok?'지웠습니다.':'지우지 못했습니다.', !(j&&j.ok)); kdraw();
};

async function draw(){
 kdraw();
 const j=await api({op:'list'});
 if(!j.ok){ say(j.msg||'불러오지 못했습니다.',1); return; }
 const users={}; j.users.forEach(u=>users[u.email]=u);
 const admins=j.admins||[];
 const rows=j.allow.map(e=>Object.assign({email:e,invited:true}, users[e]||{}));
 Object.keys(users).forEach(e=>{ if(j.allow.indexOf(e)<0) rows.push(Object.assign({invited:false},users[e])); });
 admins.forEach(e=>{ if(!rows.some(r=>r.email===e)) rows.push({email:e,invited:false}); });
 rows.forEach(r=>{ r.admin = admins.indexOf(r.email)>=0; });
 rows.sort((a,b)=>(b.loginCount||0)-(a.loginCount||0)||a.email.localeCompare(b.email));

 const joined=rows.filter(r=>r.loginCount>0).length;
 const total=rows.reduce((s,r)=>s+(r.loginCount||0),0);
 $('#sum').innerHTML=[['초대','INVITED',j.allow.length],['접속함','JOINED',joined],
   ['미접속','PENDING',rows.filter(r=>!(r.loginCount>0)).length],['관리자','ADMINS',admins.length]]
  .map(([k,u,v])=>`<div class="sc"><u>${u} · ${k}</u><b>${v}</b></div>`).join('');

 $('#tb').innerHTML=rows.map(r=>{
  let tag='<span class="tag t-none">미접속</span>';
  if(r.admin) tag='<span class="tag t-adm">관리자</span>';
  else if(r.loginCount>0 && r.mustChange) tag='<span class="tag t-new">비번 변경 전</span>';
  else if(r.loginCount>0) tag='<span class="tag t-ok">사용 중</span>';
  const acts=[];
  if(r.loginCount>0) acts.push(`<button class="ghost" data-reset="${r.email}">비밀번호 초기화</button>`);
  acts.push(r.admin
    ? `<button class="ghost" data-demote="${r.email}">관리자 해제</button>`
    : `<button class="ghost" data-promote="${r.email}">관리자 지정</button>`);
  if(r.invited && !r.admin) acts.push(`<button class="ghost" data-revoke="${r.email}">초대 취소</button>`);
  return `<tr><td class="em">${r.email}</td><td>${tag}</td>`
   +`<td class="n">${r.loginCount||0}<span class="dim" style="font-size:11px">회</span></td>`
   +`<td class="dim">${fmt(r.firstLoginAt)}</td><td>${fmt(r.lastLoginAt)}</td>`
   +`<td>${acts.join(' ')||'<span class="dim">—</span>'}</td></tr>`;
 }).join('');
}

$('#add').addEventListener('click', async()=>{
 const raw=$('#inv').value.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean);
 const bad=raw.filter(e=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
 if(!raw.length) return say('이메일을 넣어 주세요.',1);
 if(bad.length) return say('이메일 형식이 아닙니다 — '+bad.join(', '),1);
 $('#add').disabled=true;
 const j=await api({op:'invite',emails:raw});
 $('#add').disabled=false;
 if(!j.ok) return say(j.msg||'초대하지 못했습니다.',1);
 $('#inv').value=''; say(raw.length+'명 초대했습니다.'); draw();
});
document.addEventListener('click', async(e)=>{
 const rs=e.target.closest('[data-reset]'), rv=e.target.closest('[data-revoke]');
 if(rs){ if(!confirm(rs.dataset.reset+' 의 비밀번호를 1234 로 되돌립니다.')) return;
  const j=await api({op:'reset',email:rs.dataset.reset});
  say(j.ok?'초기화했습니다.':(j.msg||'실패'), !j.ok); draw(); }
 if(rv){ if(!confirm(rv.dataset.revoke+' 의 초대를 취소합니다.')) return;
  const j=await api({op:'revoke',emails:[rv.dataset.revoke]});
  say(j.ok?'초대를 취소했습니다.':(j.msg||'실패'), !j.ok); draw(); }
 const pm=e.target.closest('[data-promote]'), dm=e.target.closest('[data-demote]');
 if(pm){ if(!confirm(pm.dataset.promote+' 을(를) 관리자로 지정합니다.')) return;
  const j=await api({op:'promote',email:pm.dataset.promote});
  say(j.ok?'관리자로 지정했습니다.':(j.msg||'실패'), !j.ok); draw(); }
 if(dm){ if(!confirm(dm.dataset.demote+' 의 관리자 권한을 해제합니다.')) return;
  const j=await api({op:'demote',email:dm.dataset.demote});
  say(j.ok?'관리자에서 해제했습니다.':(j.msg||'실패'), !j.ok); draw(); }
});
$('#out').addEventListener('click', async(e)=>{ e.preventDefault();
 await fetch('/api/auth/logout',{method:'POST'}); location.href='/2026/'; });
draw();
</script>
</body></html>
