// ---------- charts (inline SVG)
function barChart(title,items,M,refLine){
 const w=760,rowH=22,padL=190,padR=70,padT=8,padB=22;const n=items.length;const h=padT+padB+n*rowH;const vals=items.map(i=>i.value).filter(v=>v!=null);const max=Math.max(refLine||0,...vals,0.0001);const min=Math.min(0,...vals);const x=v=>padL+(v-min)/(max-min)*(w-padL-padR);
 const NS='http://www.w3.org/2000/svg';const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',title);
 const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};
 // grid
 const ticks=4;for(let i=0;i<=ticks;i++){const v=min+(max-min)*i/ticks;const g=mk('line',{x1:x(v),x2:x(v),y1:padT,y2:h-padB,stroke:'var(--line-2)','stroke-width':1});svg.append(g);const tx=mk('text',{x:x(v),y:h-6,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)','font-family':'var(--font-m)'});tx.textContent=fmt[M.fmt](v);svg.append(tx);}
 if(refLine!=null){svg.append(mk('line',{x1:x(refLine),x2:x(refLine),y1:padT,y2:h-padB,stroke:'var(--ink-3)','stroke-dasharray':'3 3'}));}
 items.forEach((it,i)=>{const y=padT+i*rowH;const lab=mk('text',{x:padL-8,y:y+15,'text-anchor':'end','font-size':11.5,fill:'var(--ink)','font-family':'var(--font-b)','font-weight':it.skku&&state.skku?700:400});lab.textContent=it.label;svg.append(lab);
  if(it.value!=null){const x0=x(Math.min(0,it.value)),x1=x(Math.max(0,it.value));const r=mk('rect',{x:x0,y:y+4,width:Math.max(1,x1-x0),height:rowH-8,rx:3,fill:it.skku&&state.skku?'var(--skku)':'var(--seq8)'});svg.append(r);const vt=mk('text',{x:x1+5,y:y+15,'font-size':10.5,fill:'var(--ink-2)','font-family':'var(--font-m)'});vt.textContent=fmt[M.fmt](it.value);svg.append(vt);}
  else{const vt=mk('text',{x:padL+5,y:y+15,'font-size':10.5,fill:'var(--ink-3)','font-family':'var(--font-m)'});vt.textContent='–';svg.append(vt);}});
 const box=el('div',{class:'chart'},el('h4',{},title),svg);return box;
}
function lineChart(title,years,series){
 const w=760,h=260,padL=52,padR=16,padT=12,padB=30;const NS='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};
 const all=series.flatMap(s=>s.values).filter(v=>v!=null);const max=Math.max(1,...all);const x=i=>padL+i*(w-padL-padR)/Math.max(1,years.length-1);const y=v=>padT+(1-v/max)*(h-padT-padB);
 const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':title});
 for(let i=0;i<=4;i++){const v=max*i/4;svg.append(mk('line',{x1:padL,x2:w-padR,y1:y(v),y2:y(v),stroke:'var(--line-2)'}));const t=mk('text',{x:padL-6,y:y(v)+3,'text-anchor':'end','font-size':10,fill:'var(--ink-3)','font-family':'var(--font-m)'});t.textContent=Math.round(v).toLocaleString();svg.append(t);}
 years.forEach((yr,i)=>{const t=mk('text',{x:x(i),y:h-10,'text-anchor':'middle','font-size':10,fill:'var(--ink-3)','font-family':'var(--font-m)'});t.textContent=yr;svg.append(t);});
 series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;svg.append(mk('path',{d:'M'+pts.map(p=>p.join(',')).join('L'),fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round'}));const last=pts[pts.length-1];svg.append(mk('circle',{cx:last[0],cy:last[1],r:3.5,fill:s.color,stroke:'var(--surface)','stroke-width':2}));
  s.values.forEach((v,i)=>{if(v==null)return;const c=mk('circle',{cx:x(i),cy:y(v),r:8,fill:'transparent'});c.addEventListener('mouseenter',e=>showTip(e,`<b>${s.name}</b> ${years[i]}<br>${v.toLocaleString()} 편`));c.addEventListener('mousemove',moveTip);c.addEventListener('mouseleave',hideTip);svg.append(c);});});
 const leg=el('div',{class:'legend'},...series.map(s=>el('span',{},el('span',{class:'sw',style:`background:${s.color}`}),s.name)));
 return el('div',{class:'chart'},el('h4',{},title),svg,leg);
}
// chips
const chips=$('#chips');const dumpDone=Object.values(DATA.meta.dump_done||{}).reduce((a,v)=>a+v.K+v.T,0),dumpTot=CATS.length*YD.length*2;const partial=DATA.meta.pubmed_done<DATA.meta.pubmed_total||dumpDone<dumpTot;if(partial){const c=el('span',{class:'chip',style:'border-color:var(--warn);color:var(--warn);font-weight:600'},`잠정판 · 수집 진행 중 (PubMed ${Math.round(DATA.meta.pubmed_done/DATA.meta.pubmed_total*100)}%, 덤프 ${Math.round(dumpDone/dumpTot*100)}%)`);chips.append(c);}[`기준일 ${DATA.meta.built}`,`PubMed ${YP[0]}–${YP[YP.length-1]}`,`OpenAlex 덤프 ${YD[0]}–${YD[YD.length-1]}`,`카테고리 초안 v0 (후보안)`,`비교군 핵심 ${CORE.size} / 후보 ${GROUPS.length}`].forEach(t=>chips.append(el('span',{class:'chip'},t)));
render();
})();
</script>
