const TEXT = {"overview_lead": "성균관대학교 측이 요청한 것은 설득용 큐레이션이 아니라 쓰기 위한 기초 데이터입니다. 이 페이지는 ① 희귀질환의 국내외 정의와 ② 문샷(Moonshot) 개념에서 출발한 ③ 의학 난제 카테고리 초안을 두고, ④ 병원 또는 의과대학을 보유한 국내 대학의 연구 성과를 정량 지표로 표현하며, ⑤ 성균관대는 그중 한 행으로 같은 화면에서 확인합니다. 순서는 클라이언트 면담 정리(2026-09-18)의 항목 1~5를 그대로 따랐습니다.", "overview_body": "<h3 style='margin-top:0'>데이터의 성격<\/h3><ul><li><b>두 원천, 세 기법.<\/b> PubMed(MeSH 통제어 + 제목·초록 키워드, 2016–2025)와 OpenAlex 덤프(제목 키워드 = 기법 K, OpenAlex 주제명 = 기법 T, 2020–2025)를 같은 개념·같은 용어로 걸었습니다. 기법마다 잣대가 다르므로 한 표 안에서는 한 지표만 읽습니다.<\/li><li><b>대학 단위 = 대학 + 부속병원.<\/b> 예: 성균관대 = 성균관대학교 + 삼성서울병원·강북삼성병원·삼성창원병원, 울산대 = 울산대학교 + 서울아산병원. 모든 대학에 같은 규칙을 적용했습니다.<\/li><li><b>카테고리는 초안 v0.<\/b> 클라이언트가 전달한 정의서의 11개 영역(한국형 ARPA-H 임무 분류와 대응)과 희귀질환 트랙을 후보안으로 두고 문헌 기준으로 확정하기 전의 탐색(EDA) 단계입니다. 확정되면 조회식만 바꿔 같은 파이프라인을 다시 돌립니다.<\/li><li><b>중립.<\/b> 렌즈를 고르지 않습니다. 편수·점유율·활동지수·성장률·FWCI·상위 논문 비중을 모두 같은 자리에 두고, 성균관대 강조는 토글이며 기본값은 꺼져 있습니다.<\/li><\/ul>", "tab_desc": {"criteria": "희귀질환 정의(국내·국외), 문샷 개념, 카테고리 초안과 세 기법의 조회식", "matrix": "대학×카테고리 표. 지표·기간·비교군·정렬을 바꿔 가며 봅니다", "category": "카테고리 하나를 골라 대학 순위, 연도별 추이, 모든 지표", "university": "대학 하나를 골라 12개 카테고리 프로파일과 순위. 성균관대 뷰는 여기서 성균관대를 고른 것", "method": "원천·조회식·지표 산식·대학 그룹 사전·한계·참고문헌", "download": "집계표 CSV 복사, 논문 단위 CSV·JSON 링크(배포 사이트)", "report": "문서형 보고서: 조사 개요와 집계 대상, 전체 개요(문샷 합계 순위·특화지수·추세), 대학별 프로파일, 대학 비교, R 진단, 검증, 부록. 브라우저 인쇄로 PDF 저장"}, "criteria_rare": "<h3 style='margin-top:0'>희귀질환 정의<\/h3><p>국내 법정 정의는 「희귀질환관리법」 제2조의 “유병인구가 2만 명 이하이거나 진단이 어려워 유병인구를 알 수 없는 질환”이며, 질병관리청이 국가관리대상 희귀질환 목록을 고시합니다. 국외 기준은 유럽연합의 희귀의약품 규정(유병률 1만 명당 5명 이하), 미국 희귀의약품법(환자 20만 명 미만), Orphanet의 ORPHAcode 명명 체계가 표준입니다. 이 대시보드의 트랙 R 조회식은 이 정의를 서지에 투영한 잣대(MeSH ‘Rare Diseases’·‘rare disease’ 문구·희귀질환 관련 OpenAlex 주제)이며, 질병관리청 목록의 질환명을 하나씩 거는 방식(성균관대 상세본에서 사용)과는 잣대가 다릅니다.<\/p><p class='note'>출처는 ⑥ 방법·출처 탭 참고문헌 A절.<\/p>", "criteria_moonshot": "<h3 style='margin-top:0'>문샷(Moonshot) 개념과 의학 난제<\/h3><p>채택 정의(클라이언트 제시, 2026-09-18): “문샷 난제(Moonshot Challenge) 분석은 달 탐사처럼 성공 확률은 극히 낮지만 성공 시 인류 사회와 산업 전반에 막대한 파급효과(High Risk, High Return)를 가져오는 초고난도 과제를 발굴하고 분석하는 범용 연구개발(R&D) 기획 방법론이며, 우주·양자컴퓨팅·기후변화 등 다양한 분야에 적용된다.” 이 정의의 세 속성(성공 확률이 극히 낮음 · 파급효과가 막대함 · 초고난도)이 의학 난제를 판정하는 축입니다. 문헌에서 대응하는 개념은 임무지향 혁신정책(Mazzucato, 2018), ARPA 모델(Azoulay et al., 2019), Grand Challenges in Global Health(Varmus et al., 2003)이고, 의학 적용 사례는 미국 Cancer Moonshot(2016·2022), ARPA-H(2022), 한국형 ARPA-H 프로젝트(2024~), 일본 내각부 Moonshot 목표 2·7, EU Missions(암), EU Rare Disease Moonshot(2022)입니다.<\/p><p>카테고리 초안 v0는 클라이언트 정의서의 11개 영역을 그대로 후보안으로 쓴 것이며, 4개 묶음(미정복질환·보건안보·바이오헬스 초격차·복지돌봄)은 한국형 ARPA-H 5대 임무 중 4개와 이름이 같습니다. 문헌 기준 확정(판정 축별 조작화, 델파이 등)은 다음 단계입니다.<\/p>", "criteria_table_note": "PubMed 조회식은 MeSH 통제어와 제목·초록([tiab]) 키워드를 함께 겁니다. 덤프 K는 OpenAlex 덤프에 초록이 없어 제목만 대상으로 하며 접두 검색(:*)과 인접 연산(<->)을 씁니다. 덤프 T는 OpenAlex가 논문마다 부여한 주제(topic) 이름의 정확 일치입니다. M2 ‘난치암 근본치료’는 정의서 원문 검색식을 받지 못해 췌장암·교모세포종·불응성 암으로 대체 정의했습니다.", "criteria_cross": "<h3 style='margin-top:0'>희귀질환과 문샷 난제의 교차<\/h3><p>클라이언트 질문 “희귀질환 중 문샷 난제는 무엇인가”에 답하려면 카테고리 체계가 희귀 여부 × 난제 카테고리의 2차원이어야 합니다. 이번 초안에서는 트랙 R을 독립 열로 두고, 문샷 영역 중 희귀질환과 겹치는 대표 영역(M1 신경퇴행 중 유전성 신경퇴행, M8 유전자치료, M9 세포치료, M10 장기재생)의 교집합은 논문 단위 데이터(⑦ 데이터 탭 CSV)의 카테고리 태그로 계산할 수 있게 했습니다. 한 논문이 여러 카테고리에 속할 수 있으며 열 합계는 논문 수와 다릅니다.<\/p>", "method_sources": "<h3 style='margin-top:0'>원천과 조회<\/h3><ul><li><b>PubMed E-utilities<\/b> esearch(rettype=count, datetype=pdat) — 2026-09-18 조회. 카테고리 조회식 AND 기관 소속 문구([ad]) AND 연도. 한국 전체는 Korea[ad], 세계 전체는 소속 제한 없음. 소속 문구 검색이라 병원명이 다른 형태로 적힌 논문은 누락될 수 있고, 여러 대학 공저 논문은 각 대학에 모두 셉니다.<\/li><li><b>OpenAlex 덤프<\/b> — Supabase BIBLOBOOK 프로젝트 paper.oa_work(1억 770만 편, 적재 2026-07-25)·paper.oa_work_author(3억 2,641만 행). 2020–2025만 전량이며 초록·MeSH·기관 ID가 없어 제목(기법 K)과 OpenAlex 주제명(기법 T)으로 조회하고, 대학은 저자 소속 표시명의 정확 일치(대학+부속병원 사전)로 묶었습니다. 저자 소속은 전역적으로 약 43%가 비어 있어 덤프 편수는 하한값입니다. 세계 편수·세계 FWCI 평균은 같은 조회식의 전체 결과입니다.<\/li><li><b>OpenAlex API<\/b>(기관 계보·초록 키워드·인용 백분위)는 2026-09-18 일일 예산이 소진돼 이번 판에는 넣지 않았습니다. 확보되면 세 번째 원천 열로 추가합니다.<\/li><\/ul>", "method_indicators": "<h3 style='margin-top:0'>지표 산식<\/h3><ul><li><b>편수<\/b> — 조회식에 걸린 논문 수. 공저 논문은 관련 대학마다 1편.<\/li><li><b>국내 점유율<\/b> — 대학 편수 ÷ 한국 편수(Korea[ad]) × 100 (PubMed).<\/li><li><b>활동지수(Activity Index)<\/b> — (대학의 카테고리 편수 ÷ 대학 전체 편수) ÷ (한국의 카테고리 편수 ÷ 한국 전체 편수). Frame(1977)과 Schubert &amp; Braun(1986)의 상대 특화 지수. 1.0이 국내 평균 수준, 클수록 그 카테고리에 상대적으로 집중. 분모를 ‘전체 논문’으로 둔 값이며, 생명·보건 분야로 좁힌 분모는 다음 판에서 병기합니다.<\/li><li><b>성장률<\/b> — 2021–2025 합계 ÷ 2016–2020 합계 − 1 (PubMed). 2025년은 색인 진행 중이라 과소 집계됩니다.<\/li><li><b>FWCI 평균<\/b> — OpenAlex Field-Weighted Citation Impact의 산술평균. 1.0 = 같은 분야·연도·문헌 유형의 세계 평균. FWCI가 비어 있는 논문은 제외.<\/li><li><b>FWCI≥2 비중<\/b> — FWCI 2 이상 논문 ÷ FWCI가 있는 논문 × 100. OpenAlex 덤프에 인용 백분위 필드가 없어 ‘상위 10% 논문 비중’ 대신 쓴 대용 지표.<\/li><li><b>세계 점유율<\/b> — 대학 편수 ÷ 세계 편수 × 1000(‰), 같은 조회식(덤프 K).<\/li><li><b>순위<\/b> — 표시 중인 비교군 안에서 해당 지표의 내림차순 순위. 동률은 같은 순위.<\/li><\/ul><p class='note'>지표 선택 근거는 Leiden Manifesto(Hicks et al., 2015)의 분야 정규화·복수 지표 병기 원칙, 인용 지표 총설(Waltman, 2016), FWCI·RCR 비교(Purkayastha et al., 2019)를 따랐습니다.<\/p>", "method_groups": "<h3 style='margin-top:0'>대학 그룹과 비교군<\/h3><p>자격은 병원 또는 의과대학을 보유한 국내 대학입니다. 후보 22개 대학은 OpenAlex 덤프 한국 소속 표본과 OpenAlex 의학 분야(2024) 기관별 논문 수 상위 목록에서 뽑았고, 핵심 비교군 15개는 공개된 대학 순위와 대학병원 순위를 결합해 정했습니다(⑥ 참고문헌 D절, 규칙은 아래). 서울대·연세대·고려대·성균관대는 클라이언트 예시로 필수 포함입니다. 각 대학의 부속병원 표시명과 PubMed 소속 문구는 ⑤ 대학 상세에서 확인할 수 있습니다.<\/p><h4 style='margin:10px 0 4px'>핵심 비교군 15개 선정 규칙 (2026-09-18)<\/h4><ol><li>자격: 병원 또는 의과대학을 보유한 국내 대학.<\/li><li>세 목록을 만든다. (a) <b>대학 순위<\/b>: 중앙일보 대학평가 2025 종합 20위 이내 또는 THE World University Rankings 2026 한국 20위 이내인 대학 중 의대·병원 보유 대학 — 서울대·연세대·한양대·고려대·성균관대·경희대·이화여대·건국대·중앙대·동국대·인하대·아주대·가천대·경북대·부산대·울산대. (b) <b>대학병원 순위<\/b>: Newsweek/Statista World’s Best Hospitals 2025 한국 20위 이내 병원의 모대학 — 울산대·성균관대·서울대·연세대·아주대·가톨릭대·인하대·경희대·건국대·고려대·중앙대·이화여대·전남대·대구가톨릭대·충남대·영남대. (c) <b>의생명 분야 논문량<\/b>: CWTS Leiden Ranking 2025 Biomedical and health sciences(2020–2023, P) 한국 15위 이내 — 서울대·연세대·성균관대·울산대·가톨릭대·고려대·경희대·부산대·경북대·전남대·한림대·중앙대·한양대·가천대·충남대.<\/li><li>세 목록 중 <b>두 곳 이상<\/b>에 든 대학(18개)을 뽑고, Leiden P 순위로 15개로 자른다. 결과: 세 목록 모두 — 서울대·연세대·성균관대·고려대·경희대·중앙대·울산대(7). 두 목록 — 가톨릭대·부산대·경북대·전남대·한양대·가천대·충남대·건국대(8). <span class='note'>제외(두 목록에 들었으나 P 순위 밖): 이화여대·아주대·인하대. 한 목록만: 동국대·대구가톨릭대·영남대·한림대.<\/span><\/li><li>클라이언트 예시 4교(서울대·연세대·고려대·성균관대)는 규칙으로도 포함된다. 제외된 대학은 ‘후보 전체’ 보기에서 같은 지표로 볼 수 있다. 다른 결합 규칙(예: 순위 합산)을 쓰면 이화여대·아주대·인하대가 들어오고 전남대·가천대·충남대가 빠질 수 있으므로, 최종 15개는 클라이언트 확인 사항이다.<\/li><\/ol>", "method_limits": "<h3 style='margin-top:0'>한계<\/h3><ul><li>카테고리 초안 v0는 정밀도 표본 검사(200건·80% 기준) 전입니다. 넓은 조회식(M6·M7·M9·M11)은 과대, 좁은 조회식(R·M3)은 과소 집계될 수 있습니다.<\/li><li>PubMed 소속 검색은 문자열 일치라 표기 변형·누락이 있으며, ‘Korea University’ 문구는 ‘Korea University of Technology and Education’ 등도 일부 포함합니다.<\/li><li>덤프는 2020년 이후만 전량이고 저자 소속 결측이 커서 PubMed 편수와 직접 비교하면 안 됩니다.<\/li><li>2025년 데이터는 두 원천 모두 미완(색인·적재 진행 중)입니다.<\/li><li>지표는 연구 ‘활동’과 ‘인용 영향’의 대용이며 연구의 질·임상 성과를 직접 재지 않습니다.<\/li><li>덤프 조회 중 단일 용어로도 120초 제한을 넘긴 부분(아래 ‘미완 조회’ 목록)은 값이 빠져 있어 해당 카테고리·연도·기법의 편수와 세계 합계가 과소 집계됩니다. work_id 샤딩으로 재실행 중이며 끝나면 같은 주소에 갱신합니다.<\/li><\/ul><h4 style='margin:10px 0 4px'>표본 정밀도 (2026-09-18, 카테고리별 무작위 제목 6~8건 눈검사 — 정식 200건·80% 검사 전. 평균 K 약 85%, T 약 50%)<\/h4><div class='tablewrap'><table><thead><tr><th style='text-align:left'>카테고리<\/th><th>덤프 K 제목 키워드<\/th><th>덤프 T 주제명<\/th><th style='text-align:left'>주요 잡음<\/th><\/tr><\/thead><tbody><tr><td>R 희귀질환<\/td><td>6/8<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 보충자료 레코드(‘Additional file’), ‘a rare disease’ 일반 표현. T: 주제 ‘Cystic Fibrosis…’·‘Genetic and rare skin diseases’가 비희귀 논문 포함<\/td><\/tr><tr><td>M1 신경퇴행<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: 신경염증·교세포 기초연구 포함<\/td><\/tr><tr><td>M2 난치암(대체)<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: ‘Glioma…’·‘Pancreatic and Hepatic Oncology…’ 주제가 뇌종양 전반·간담췌 전반을 포함<\/td><\/tr><tr><td>M3 조기발견·액체생검<\/td><td>5/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>K: 이식 거부반응 cfDNA(비암) 포함. T: 대장암 검진 주제에 내시경 술기·영상 AI 포함<\/td><\/tr><tr><td>M4 척수손상·BCI<\/td><td>6/6<\/td><td>2/6<\/td><td style='text-align:left;white-space:normal'>T: ‘EEG and Brain-Computer Interfaces’ 주제가 수면·피로 EEG 분류 전반을 포함<\/td><\/tr><tr><td>M5 중증 정신질환<\/td><td>6/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>T: 정신의학 일반 논의 포함<\/td><\/tr><tr><td>M6 백신 플랫폼<\/td><td>4/6<\/td><td>2/6<\/td><td style='text-align:left;white-space:normal'>K: COVID-19 백신 임상·부작용 보고 포함. T: 감염병 역학·백신 접종률 사회연구 포함<\/td><\/tr><tr><td>M7 항생제 내성<\/td><td>5/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 환경(하수·작물) 내성유전자 포함. T: 일반 감염 역학 포함<\/td><\/tr><tr><td>M8 유전자치료·편집<\/td><td>4/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K·T: 비의학 CRISPR(균류·세균·농업) 포함<\/td><\/tr><tr><td>M9 세포치료<\/td><td>5/6<\/td><td>4/6<\/td><td style='text-align:left;white-space:normal'>MSC 분화 기초연구 포함<\/td><\/tr><tr><td>M10 장기재생<\/td><td>4/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>K: 골 재생 생체재료·오가노이드 기초연구 포함. T: 3D 프린팅 소재 일반·임상 이식 관리 포함<\/td><\/tr><tr><td>M11 노쇠·노화<\/td><td>6/6<\/td><td>3/6<\/td><td style='text-align:left;white-space:normal'>T: 모델생물 노화 유전학(곤충 분류 논문까지)·근생성 기초연구 포함<\/td><\/tr><\/tbody><\/table><\/div><p class='note'>읽는 법: K(제목 키워드)는 정밀도가 높은 대신 재현율이 낮고(제목에만 걸림), T(주제명)는 넓게 잡혀 편수가 크지만 잡음이 커서 <b>참고용<\/b>입니다. PubMed 조회식은 MeSH와 초록까지 걸어 둘의 중간입니다. 기법 3종의 편수 차이 자체가 기준의 넓이를 보여 주는 데이터이며, 대학 간 비교는 같은 기법 안에서만 하십시오.<\/p><div id='gaps'><\/div>", "references": "<h3 style='margin-top:0'>참고문헌<\/h3><p class='note'>정의(A)·문샷(B)·지표(C)·순위(D) 근거는 <code>기준서_문헌근거_2026-09-18.md<\/code>(항목별 원문 인용·확인일 2026-09-18)에 정리돼 있으며 아래는 그 참고문헌 목록입니다. 데이터 원천: PubMed E-utilities(2026-09-18 조회), OpenAlex 덤프(Supabase BIBLOBOOK, 적재 2026-07-25).<\/p><ol class=\"ref\"><li>Advanced Research Projects Agency for Health. (n.d.-a). About us. <a href=\"https://arpa-h.gov/about\" target=\"_blank\" rel=\"noopener\">https://arpa-h.gov/about<\/a> (접근일 2026-09-18)<\/li><li>Advanced Research Projects Agency for Health. (n.d.-b). Frequently asked questions. <a hr ('tbody');for(const[k,v]of rows)tb.append(el('tr',{},el('td',{},k),el('td',{},v)));return el('table',{class:'tbl kv'},tb);}\nfunction table(heads,rows,{cls='',widths=null,split=false,rowCls=null}={}){\n const t=el('table',{class:'tbl '+cls});if(split)t.setAttribute('data-split','');\n if(widths){const cg=el('colgroup');widths.forEach(w=>cg.append(el('col',{style:w?`width:${w}px`:null})));t.append(cg);}\n const hr=el('tr');heads.forEach(h=>{const th=el('th');String(h).split('\\n').forEach((p,i)=>{if(i)th.append(el('br'));th.append(p);});hr.append(th);});t.append(el('thead',{},hr));\n const tb=el('tbody');rows.forEach((r,i)=>{const tr=el('tr',{class:rowCls?rowCls(i):null});r.forEach(c=>{if(c&&c.nodeType===1&&c.tagName==='TD')tr.append(c);else tr.append(el('td',{},c));});tb.append(tr);});t.append(tb);return t;}\nconst td=(v,cls,style)=>el('td',{class:cls||null,style:style||null},v);\nconst gname=g=>[g,CORE.has(g)?null:el('span',{class:'cand'},'후보')];\nfunction gcell(g){const c=el('td',{class:'gc'});c.append(...gname(g).filter(Boolean));return c;}\nconst CODE_LEGEND=()=>el('p',{class:'legend'},...CATS.flatMap((c,i)=>[i?' · ':'',el('b',{},c.code),' '+catShort(c)]));\nconst RAMP=['#f1f5fa','#e2eaf4','#cfdcec','#b6c9e1','#9ab4d4','#7d9cc4','#6285b3','#4a6fa0','#34598a','#1a3a5c'];\nfunction heat(v,min,max){if(v==null||!isFinite(min))return null;const t=max>min?(v-min)/(max-min):0;const i=Math.max(0,Math.min(9,Math.round(t*9)));return {bg:RAMP[i],dark:i>=6};}\n\n/* 가로 막대 (SVG) */\nfunction barChart(title,items,M,{padL=120,ref=null}={}){\n const NS='http://www.w3.org/2000/svg';const w=720,rowH=14,padR=60,padT=4,padB=18;const n=items.length;const h=padT+padB+n*rowH;\n const vals=items.map(i=>i.value).filter(v=>v!=null);const max=Math.max(ref||0,...vals,0.0001);const min=Math.min(0,...vals);const x=v=>padL+(v-min)/(max-min)*(w-padL-padR);\n const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};\n const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':title});\n for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;svg.append(mk('line',{x1:x(v),x2:x(v),y1:padT,y2:h-padB,stroke:'#e3e8ee','stroke-width':1}));const tx=mk('text',{x:x(v),y:h-5,'text-anchor':'middle','font-size':8.5,fill:'#777','font-family':'Menlo,monospace'});tx.textContent=fmt[M.fmt](v);svg.append(tx);}\n if(ref!=null)svg.append(mk('line',{x1:x(ref),x2:x(ref),y1:padT,y2:h-padB,stroke:'#555','stroke-dasharray':'3 3','stroke-width':1}));\n items.forEach((it,i)=>{const y=padT+i*rowH;const hl=it.skku&&state.skku;\n  const lab=mk('text',{x:padL-6,y:y+10.5,'text-anchor':'end','font-size':9,fill:hl?'#b4471e':'#222','font-family':'Pretendard,sans-serif','font-weight':hl?700:400});lab.textContent=it.label;svg.append(lab);\n  if(it.value!=null){const x0=x(Math.min(0,it.value)),x1=x(Math.max(0,it.value));svg.append(mk('rect',{x:x0,y:y+2.5,width:Math.max(1,x1-x0),height:rowH-5,rx:2,fill:hl?'#b4471e':(it.cand?'#9ab4d4':'#3b6998')}));const vt=mk('text',{x:x1+4,y:y+10.5,'font-size':8.5,fill:'#444','font-family':'Menlo,monospace'});vt.textContent=fmt[M.fmt](it.value);svg.append(vt);}\n  else{const vt=mk('text',{x:padL+4,y:y+10.5,'font-size':8.5,fill:'#999','font-family':'Menlo,monospace'});vt.textContent='–';svg.append(vt);}});\n return svg;\n}\n/* 연도 선 (SVG) */\nconst LINE_COLORS=['#1a3a5c','#d9772b','#2f8f6b','#9c7a1c'];\nfunction lineChart(title,years,series){\n const NS='http://www.w3.org/2000/svg';const w=720,h=170,padL=48,padR=14,padT=8,padB=22;const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};\n const all=series.flatMap(s=>s.values).filter(v=>v!=null);const max=Math.max(1,...all);const x=i=>padL+i*(w-padL-padR)/Math.max(1,years.length-1);const y=v=>padT+(1-v/max)*(h-padT-padB);\n const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,role:'img','aria-label':title});\n for(let i=0;i<=4;i++){const v=max*i/4;svg.append(mk('line',{x1:padL,x2:w-padR,y1:y( n B;\n}\n\n/* ---------- A4 배치 ---------- */\nconst PAGE_H=1123, PAD_B=48;\nconst pagesRoot=$('#pages');\nfunction header(){const W=WINDOWS[state.win];return el('table',{class:'page-header'},\n el('tr',{},el('td',{class:'title-cell',rowspan:'2'},'기초데이터'),el('td',{class:'label'},'문서명'),el('td',{colspan:'3'},DOCNAME),el('td',{class:'label'},'버전'),el('td',{style:'text-align:center;white-space:nowrap'},'v0 잠정판')),\n el('tr',{},el('td',{class:'label'},'원천'),el('td',{},'PubMed · OpenAlex 덤프'),el('td',{class:'label'},'기간'),el('td',{style:'white-space:nowrap'},W.label.split(' (')[0]),el('td',{class:'label'},'기준일'),el('td',{style:'text-align:center;white-space:nowrap'},DATA.meta.built.slice(0,10))));}\nfunction newPage(){const body=el('div',{class:'spec-body'},header());const page=el('div',{class:'page'},body,el('div',{class:'page-footer'},el('span'),el('span',{class:'sys-name'},DOCNAME+' · 기준일 '+DATA.meta.built.slice(0,10)),el('span',{class:'page-num'})));pagesRoot.append(page);return {page,body,has:false};}\nfunction fits(pg){const last=pg.body.lastElementChild;if(!last)return true;const top=pg.body.getBoundingClientRect().top;return last.getBoundingClientRect().bottom<=top+PAGE_H-PAD_B+0.5;}\nfunction placeSplit(pg,node){\n const tbl=node.querySelector('table[data-split]');const rows=[...tbl.tBodies[0].rows];const tw=tbl.closest('.tw')||tbl;\n const after=[];for(let n=tw.nextSibling;n;){const nx=n.nextSibling;after.push(n);n.remove();n=nx;}\n rows.forEach(r=>r.remove());\n let part=node,idx=0;\n for(let guard=0;guard<500;guard++){\n  const had=pg.has; pg.body.append(part);\n  const ptb=part.querySelector('table[data-split]').tBodies[0];\n  let k=idx; while(k<rows.length){ptb.append(rows[k]);if(!fits(pg)){rows[k].remove();break;}k++;}\n  const need=Math.min(3,rows.length-idx);\n  if(k-idx<need&&had){for(let j=idx;j<k;j++)rows[j].remove();part.remove();pg=newPage();continue;}\n  if(k===idx){ptb.append(rows[k]);k++;}\n  pg.has=true; idx=k;\n  if(idx>=rows.length){after.forEach(a=>part.append(a));if(after.length&&!fits(pg)){after.forEach(a=>a.remove());pg=newPage();const w=el('div',{class:'blk'});after.forEach(a=>w.append(a));pg.body.append(w);pg.has=true;}return pg;}\n  pg=newPage();\n  const t2=tbl.cloneNode(true);t2.tBodies[0].replaceChildren();\n  part=el('div',{class:'blk'},el('div',{class:'cont-cap'},(node.dataset.cont||'')+' (계속)'),el('div',{class:'tw'},t2));\n }\n return pg;\n}\nfunction paginate(B){\n pagesRoot.replaceChildren(); let pg=newPage();\n for(const b of B){\n  if(b.brk){if(pg.has)pg=newPage();continue;}\n  pg.body.append(b.node);\n  if(fits(pg)){pg.has=true;continue;}\n  b.node.remove();\n  if(b.split){pg=placeSplit(pg,b.node);continue;}\n  if(pg.has)pg=newPage();\n  pg.body.append(b.node);pg.has=true;\n }\n if(!pg.has)pg.page.remove();\n const pages=[...pagesRoot.children];const N=pages.length;\n pages.forEach((p,i)=>{p.querySelector('.page-num').textContent=`${i+1} / ${N}`;});\n document.querySelectorAll('[data-toc]').forEach(c=>{const t=document.getElementById(c.getAttribute('data-toc'));const p=t&&t.closest('#pages > .page');c.textContent=p?String(pages.indexOf(p)+1):'–';});\n const over=pages.map((p,i)=>{const b=p.querySelector('.spec-body');const last=b.lastElementChild;return last&&last.getBoundingClientRect().bottom>b.getBoundingClientRect().top+PAGE_H-PAD_B+0.5?i+1:null;}).filter(Boolean);\n document.documentElement.dataset.pages=String(N);document.documentElement.dataset.overflow=over.join(',');\n if(over.length)console.warn('쪽 넘침:',over);\n}\nfunction render(){\n const busy=$('#busy');busy.style.display='block';\n document.body.classList.toggle('skku-on',state.skku);\n document.querySelectorAll('.js-win').forEach(x=>x.textContent=WINDOWS[state.win].label);\n document.querySelectorAll('.js-built').forEach(x=>x.textContent=DATA.meta.built);\n const y=window.scrollY; paginate(build()); window.scrollTo(0,y);\n busy.style.display='none'; document.documentElement.dataset.ready='1';\n}\n\n/* ---------- 조작판 ---------- */\nconst sw=$('#c-win');for(const[k,v]of Object.entries(WINDOWS))sw.append(el('option',{value:k,selected:k===state.win?'':null},v.label));\nsw.addEventListener('change',e=>{state.win=e.target.value;saveState();render();});\nconst sk=$('#c-skku');sk.checked=state.skku;sk.addEventListener('change',e=>{state.skku=e.target.checked;saveState();render();});\nfunction toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',1600);}\nfunction csv(){const W=WINDOWS[state.win];const q=v=>/[\",\\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v;const lines=[['대학','카테고리','기간',...METRICS.map(m=>m.name)].map(q).join(',')];for(const g of ordered())for(const c of CATS){const m=metrics(g,c.code,state.win);lines.push([g,c.code,W.label,...METRICS.map(M=>m[M.id]==null?'':String(+m[M.id].toFixed(4)))].map(q).join(','));}return lines.join('\\n');}\n$('#c-csv').addEventListener('click',async()=>{const s=csv();try{await navigator.clipboard.writeText(s);toast('CSV를 복사했습니다');}catch(e){const ta=el('textarea',{style:'position:fixed;left:-9999px'});ta.value=s;document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();toast(ok?'CSV를 복사했습니다':'복사하지 못했습니다');}});\n$('#c-json').addEventListener('click',()=>{const b=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});const a=el('a',{href:URL.createObjectURL(b),download:'난제_기초데이터_원자료_'+DATA.meta.built.slice(0,10)+'.json'});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);});\n$('#c-print').addEventListener('click',()=>window.print());\nconst ctrl=$('.ctrl'),tg=$('#c-tg');const setMin=m=>{ctrl.classList.toggle('min',m);tg.textContent=m?'조작판 열기':'조작판 접기';tg.setAttribute('aria-expanded',String(!m));};\nsetMin(window.innerWidth<1250);tg.addEventListener('click',()=>setMin(!ctrl.classList.contains('min')));\n\nconst start=()=>render();\nif(document.fonts&&document
