<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIBLO — 검색</title>
<style>
.wrap-7q2v8{--ink:#eef3ff;--ink2:#9aabd2;--ink3:#63769c;
 --m:#ff3fd0;--bl:#2b6bff;--cy:#38d6f8;
 position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
 color:var(--ink);-webkit-font-smoothing:antialiased;
 background:radial-gradient(1200px 760px at 50% 50%,#0a0713 0%,#06040d 55%,#020105 100%)}
.wrap-7q2v8 *{box-sizing:border-box;margin:0;padding:0}
.halo-7q2v8{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ── 워드마크 ── */
.mark-7q2v8{position:absolute;left:50%;top:12vh;transform:translateX(-50%);z-index:4;
 display:flex;align-items:center;gap:11px;opacity:.9}
.mark-7q2v8 b{font:700 12.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.34em;color:#cfd9f5}
.mark-7q2v8 s{text-decoration:none;font:600 10.5px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.15em;color:var(--ink3)}

/* ── 알약 검색바 ── */
.pill-7q2v8{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
 display:flex;align-items:center;gap:clamp(14px,1.5vw,26px);
 padding:0 clamp(10px,1vw,16px) 0 clamp(20px,2.2vw,34px);
 border-radius:999px;background:#0d0d12;
 box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.14),
   inset 0 1px 0 rgba(255,255,255,.10),
   0 0 0 1px rgba(0,0,0,.6),
   0 30px 70px -20px rgba(0,0,0,.9)}
.pill-7q2v8::before{content:"";position:absolute;inset:-1.4px;border-radius:999px;padding:1.4px;
 background:linear-gradient(90deg,rgba(255,90,220,.95),rgba(210,150,255,.9) 34%,
   rgba(160,200,255,.95) 58%,rgba(60,130,255,.95));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.plus-7q2v8{flex:none;color:#f2f5ff;opacity:.95}
.field-7q2v8{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%}
.caret-7q2v8{width:2.5px;height:clamp(22px,2.4vw,34px);border-radius:2px;background:var(--bl);flex:none;
 box-shadow:0 0 10px rgba(43,107,255,.9);animation:bl-7q2v8 1.05s steps(1) infinite}
@keyframes bl-7q2v8{0%,50%{opacity:1}51%,100%{opacity:.15}}
.ph-7q2v8{font-weight:400;font-size:clamp(17px,2.1vw,32px);letter-spacing:-.4px;color:#98a0b4;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic-7q2v8{flex:none;color:#eef3ff;opacity:.9;cursor:pointer}
.go-7q2v8{flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;
 background:linear-gradient(160deg,#4c8bff,#1560ff);
 box-shadow:0 0 26px rgba(40,110,255,.55),inset 0 1px 0 rgba(255,255,255,.4);
 transition:transform .18s,box-shadow .18s}
.go-7q2v8:hover{transform:scale(1.06);box-shadow:0 0 40px rgba(60,130,255,.85),inset 0 1px 0 rgba(255,255,255,.5)}

/* ── 예시 질의 ── */
.cap-7q2v8{position:absolute;left:12px;right:12px;bottom:5.2vh;z-index:4;text-align:center;
  font:600 11px/1.7 ui-monospace,Menlo,monospace;color:#5a6c92}
.sug-7q2v8{position:absolute;left:50%;transform:translateX(-50%);z-index:4;
 display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,980px);padding:0 8px}
.s-7q2v8{border-radius:999px;padding:8px 14px;white-space:nowrap;cursor:pointer;
 font-weight:600;font-size:clamp(11px,1.05vw,13.5px);color:#b9c6e8;
 background:rgba(255,255,255,.045);border:1px solid rgba(160,180,255,.18);
 transition:background .18s,border-color .18s,color .18s}
.s-7q2v8:hover{background:rgba(120,150,255,.14);border-color:rgba(170,190,255,.42);color:#eaf0ff}
.s-7q2v8 u{text-decoration:none;color:var(--ink3);margin-left:7px;font-weight:600}
@media(max-width:460px){.s-7q2v8 u{display:none}}
/* 좁은 화면 — 칩을 접지 말고 한 줄 가로 스크롤로 */
@media(max-width:620px){
 .sug-7q2v8{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:0 14px;left:0;right:0;transform:none;width:100%;max-width:100%!important}
 .sug-7q2v8::-webkit-scrollbar{display:none}
 .s-7q2v8{flex:none}
}

/* ── 하단 캡션 ── */
/* 아주 좁은 화면 — 마이크를 빼서 문구 자리를 확보 */
@media(max-width:430px){
 .mic-7q2v8{display:none}
 .pill-7q2v8{gap:10px;padding:0 8px 0 14px}
}
@media (prefers-reduced-motion: reduce){
 .caret-7q2v8{animation:none;opacity:1}
}
</style></head><body style="margin:0;background:#020105">
<div class="wrap-7q2v8" id="wrap-7q2v8">
 <canvas class="halo-7q2v8" id="halo-7q2v8"></canvas>

 <div class="mark-7q2v8">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="#9fc7ff">
   <circle cx="4" cy="12" r="1.6"/><circle cx="9.5" cy="7" r="1.8"/><circle cx="9.5" cy="17" r="1.8"/>
   <circle cx="15" cy="12" r="2.1"/><circle cx="20" cy="8" r="1.5"/><circle cx="20" cy="16" r="1.5"/></svg>
  <b>BIBLO</b><s>· 연구성과 검색</s>
 </div>

 <div class="pill-7q2v8" id="pill-7q2v8">
  <svg class="plus-7q2v8" id="plus-7q2v8" viewBox="0 0 24 24" fill="none"
   stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
   <path d="M12 5v14M5 12h14"/></svg>
  <div class="field-7q2v8">
   <span class="caret-7q2v8" id="caret-7q2v8"></span>
   <span class="ph-7q2v8" id="ph-7q2v8">BIBLO에 물어보세요</span>
  </div>
  <svg class="mic-7q2v8" id="mic-7q2v8" viewBox="0 0 24 24" fill="none"
   stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
   <rect x="9.3" y="3" width="5.4" height="10.6" rx="2.7"/>
   <path d="M5.6 11.6a6.4 6.4 0 0 0 12.8 0M12 18v3"/></svg>
  <div class="go-7q2v8" id="go-7q2v8">
   <svg id="wave-7q2v8" viewBox="0 0 24 24" fill="none" stroke="#fff"
    stroke-width="2.1" stroke-linecap="round">
    <path d="M7 9.5v5M12 5.5v13M17 9.5v5"/></svg>
  </div>
 </div>

 <div class="sug-7q2v8" id="sug-7q2v8"></div>
 <div class="cap-7q2v8" id="cap-7q2v8"></div>
</div>
<script>
(function(){
const T='7q2v8', $=id=>document.getElementById(id+'-'+T);
const wrap=$('wrap'), halo=$('halo'), pill=$('pill'), ph=$('ph'),
      sug=$('sug'), cap=$('cap'), go=$('go'), plus=$('plus'), mic=$('mic'), wave=$('wave');
const ctx=halo.getContext('2d');

/* ── 예시 질의 · BIBLO 가 실제로 답하는 것들 ── */
const Q=[
 ['논문 검색',    '제목 · 저자 · 저널 · DOI'],
 ['저자 매핑',    '동명이인 판별'],
 ['성과지표',     'S · FWCI · 백분위'],
 ['공저 관계망',  '교내 · 교외'],
 ['학과 비교',    '계열 내 순위']
];
const HINT=[
 'BIBLO에 물어보세요',
 '전자전기컴퓨터공학과 최근 3년 성과점수',
 'FWCI 2 이상 논문을 쓴 연구자',
 '이 분야에서 함께 쓸 만한 교내 공저자',
 '제1저자 논문이 가장 많은 학과'
];
const HINT_S=['BIBLO에 물어보세요','최근 3년 성과점수','FWCI 2 이상 논문',
              '함께 쓸 교내 공저자','제1저자 최다 학과'];
const hints=()=>(innerWidth<760?HINT_S:HINT);
sug.innerHTML=Q.map(([a,b])=>`<div class="s-${T}">${a}<u>${b}</u></div>`).join('');


/* ── 알약 크기·위치 ── */
let W=0,H=0,DPR=1,PW=0,PH=0,CX=0,CY=0;
function layout(){
 W=wrap.clientWidth; H=wrap.clientHeight; DPR=Math.min(devicePixelRatio||1,2);
 const NAR=W<760;
 PW=Math.min(NAR?W*0.90:W*0.70, 1040);
 PH=Math.max(NAR?58:74, Math.min(PW*(NAR?0.185:0.135), 132));
 ph.style.fontSize=Math.round(Math.max(13, Math.min(PH*0.30, 32)))+'px';
 pill.style.width=Math.round(PW)+'px';
 pill.style.height=Math.round(PH)+'px';
 const ic=Math.round(PH*0.34), gb=Math.round(PH*0.66);
 plus.setAttribute('width',ic); plus.setAttribute('height',ic);
 mic.setAttribute('width',ic);  mic.setAttribute('height',ic);
 go.style.width=gb+'px'; go.style.height=gb+'px';
 wave.setAttribute('width',Math.round(gb*0.52)); wave.setAttribute('height',Math.round(gb*0.52));
 // 칩 줄은 캡션 위에 반드시 남게 배치한다
 const capH=cap.getBoundingClientRect().height||34;
 const sugH=sug.getBoundingClientRect().height||40;
 const floor=H/2+PH/2+14;                       // 알약을 절대 침범하지 않는 하한
 const want=H/2+PH/2+Math.max(30,H*0.065);
 const limit=H-(H*0.052+capH)-sugH-14;
 sug.style.top=Math.round(Math.max(floor, Math.min(want, limit)))+'px';
 sug.style.maxWidth=Math.round(Math.min(W*0.92, 980))+'px';
 CX=W/2; CY=H/2;
 halo.width=Math.round(W*DPR); halo.height=Math.round(H*DPR);
 bake();
}
/* ── 하프톤 halo ── 알약 윤곽까지의 거리로 점 크기·밝기·색을 정한다 */
let BASE=null;
function sd(x,y){                      // 알약(완전 라운드) 표면까지의 거리
 const R=PH/2, ex=Math.max(Math.abs(x-CX)-(PW/2-R),0), ey=Math.abs(y-CY);
 return Math.hypot(ex,ey)-R;
}
function bake(){
 BASE=document.createElement('canvas');
 BASE.width=halo.width; BASE.height=halo.height;
 const c=BASE.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
 const step=Math.max(9, Math.round(PH*0.095));
 const FADE=PH*0.50, SPAN=PW*1.15;         // 알약에서 약 1 알약높이까지만 퍼진다
 const REACH=PH*1.35;
 const x0=CX-PW/2-REACH, x1=CX+PW/2+REACH, y0=CY-PH/2-REACH, y1=CY+PH/2+REACH;
 for(let y=y0; y<=y1; y+=step){
  if(y<-step||y>H+step) continue;
  for(let x=x0; x<=x1; x+=step){
   if(x<-step||x>W+step) continue;
   const d=sd(x,y);
   if(d<PH*0.10) continue;                       // 알약 안쪽·경계는 비운다
   const f=Math.exp(-d/FADE);
   if(f<0.10) continue;
   const t=Math.min(1,Math.max(0,(x-(CX-SPAN/2))/SPAN));
   const r=Math.round(255+(43-255)*t), g=Math.round(63+(107-63)*t), b=Math.round(208+(255-208)*t);
   const s=step*0.40*(0.30+0.70*f);
   c.fillStyle=`rgba(${r},${g},${b},${(f*0.95).toFixed(3)})`;
   c.beginPath();                                 // 다이아몬드
   c.moveTo(x,y-s); c.lineTo(x+s*0.60,y); c.lineTo(x,y+s); c.lineTo(x-s*0.60,y);
   c.closePath(); c.fill();
  }
 }
 // 알약 주변 부드러운 글로우
 c.globalCompositeOperation='lighter';
 const g2=c.createLinearGradient(CX-PW/2,0,CX+PW/2,0);
 g2.addColorStop(0,'rgba(255,63,208,.34)'); g2.addColorStop(.55,'rgba(150,120,255,.24)');
 g2.addColorStop(1,'rgba(43,107,255,.34)');
 c.filter=`blur(${Math.round(PH*0.30)}px)`;
 c.fillStyle=g2; c.beginPath();
 const R=PH/2;
 c.roundRect(CX-PW/2-R*0.5, CY-PH/2-R*0.5, PW+R, PH+R, (PH+R)/2); c.fill();
 c.filter='none'; c.globalCompositeOperation='source-over';
}
/* ── 숨쉬기 + 좌우 스윕 (베이크한 층 위에 아주 가벼운 합성만) ── */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let STILL=RM.matches, t0=0, run=true;
function draw(ts){
 if(!run) return;
 if(!t0) t0=ts; const T2=(ts-t0)/1000;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,halo.width,halo.height);
 ctx.globalAlpha=STILL?1:(0.88+0.12*Math.sin(T2*0.9));
 ctx.drawImage(BASE,0,0);
 ctx.globalAlpha=1;
 if(!STILL){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='lighter';
  const p=((T2*0.16)%1.6)-0.3, sx=CX+(p-0.5)*PW*1.7;
  const g=ctx.createRadialGradient(sx,CY,0,sx,CY,PW*0.30);
  g.addColorStop(0,'rgba(190,210,255,.10)'); g.addColorStop(1,'rgba(190,210,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(draw);
 }
}
/* ── 플레이스홀더 순환 ── */
let hi=0;
function cycle(){
 const L2=hints(); hi=(hi+1)%L2.length;
 ph.style.transition='opacity .32s'; ph.style.opacity='0';
 setTimeout(()=>{ph.textContent=L2[hi]; ph.style.opacity='1';},320);
}
let cyc=setInterval(cycle, 3400);
sug.addEventListener('click',e=>{const s=e.target.closest('.s-'+T); if(!s)return;
 clearInterval(cyc); ph.textContent=s.childNodes[0].textContent.trim()+' 결과 보기';
 cyc=setInterval(cycle,3400);});

let rt=0;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();
 if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,halo.width,halo.height);ctx.drawImage(BASE,0,0);}
},140);});
document.addEventListener('visibilitychange',()=>{run=!document.hidden;
 if(run&&!STILL){t0=0;requestAnimationFrame(draw);}});
RM.addEventListener?.('change',e=>{STILL=e.matches;
 if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,halo.width,halo.height);ctx.drawImage(BASE,0,0);
   clearInterval(cyc);} else {t0=0;requestAnimationFrame(draw);cyc=setInterval(cycle,3400);}});

layout();
if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(BASE,0,0); clearInterval(cyc);}
else requestAnimationFrame(draw);
})();
</script></body></html>
