<script>
(function(){
const T='7q2v8', $=id=>document.getElementById(id+'-'+T);
const wrap=$('wrap'), halo=$('halo'), pill=$('pill'), ph=$('ph'),
      sug=$('sug'), cap=$('cap'), go=$('go'), plus=$('plus'), mic=$('mic'), wave=$('wave');
const ctx=halo.getContext('2d');

/* ── 예시 질의 · BIBLO 가 실제로 답하는 것들 ── */
/* ══ 데모 시나리오 ══ 근거: 검색품질 절 · AI 사서기능 절 (report2026_biblo2.1.html) ══ */
const CASES=[
 {q:'물고기는 존재하지 않는다',
  tag:'통합검색', time:'0.1초', hit:'정확히 한 권',
  note:'긴 제목도 중의적 제목도 <b>한 번에 한 권</b>으로 떨어진다.',

 {q:'한강의 채식주의자와 비슷한 책 찾아줘',

  axis:[['분야·장르','한국 현대 장편소설'],['주제·개념','폭력과 거부'],
        ['정서·톤','서늘한'],['목적·효용','다시 읽히는 문제작']]},

 {q:'마음이 지칠 때 위로가 되는 잔잔한 에세이',
  tag:'기분·상태', time:'2.2초', hit:'정밀 매칭 20권',
  note:'12축 중 <b>4개 축</b>이 켜졌다. 질의 어디에도 이 책들의 제목·저자가 없다.',
  items:[['마음이 마음에게','김준 · 지식인하우스'],['너의 마음에 햇살이 들기를','김지영 · 책마음'],
         ['괜찮아지는 중입니다','안송이 · 문학테라피'],['내가 힘들었다는 너에게','신소영 · 웅진지식하우스']]},

 {q:'행복한 당신의 일상',
  tag:'소장자료검색', time:'0.1초', hit:'7건',
  note:'무한정 넓히지 않는다. <b>행복·당신·일상</b>의 맥락 안에서만 확장한다.'},

 {q:'폐암 논문 찾아줘',
  tag:'논문검색', time:'', hit:'지시어 제거',
  note:'“논문·찾아줘”를 걷어내고 <b>폐암</b>만 남긴다. 한 글자 핵심어도 버리지 않는다.',
  axis:[['통엔티티 보호','삼중음성유방암 → 1건에서 1,293건'],['1글자 보호','암·간·뇌 단독도 정상 검색']]},

 {q:'체리새우 비밀글입니다',
  tag:'없으면 추천', time:'', hit:'소장 0건', warn:1,
  note:'<b>0건 화면이 없다.</b> 사서처럼 “이런 책은 어때요?” 하고 실소장 6권을 권한다.',
  items:[['엔드게임 살인사건','다니엘 콜'],['체리새우','황영미'],['백조 선인장','박권하'],
         ['빨강 연필','신수현'],['유기','하용준'],['일루미네이티드','매트 브론리위']]}
];

/* ── 결과 그리기 ── */
function paint(c){
 const axis=(c.axis||[]).map(([a,b])=>`<div class="ri-7q2v8 ax-7q2v8"><b>${a}</b><s>${b}</s></div>`).join('');
 const items=(c.items||[]).map(([a,b])=>`<div class="ri-7q2v8"><b>${a}</b><s>${b}</s></div>`).join('');
 sug.innerHTML=`<div class="res-7q2v8 fade-7q2v8">
   <div class="rq-7q2v8"><i>${c.tag}</i>${c.time?`<em>${c.time}</em>`:''}<b>${c.hit}</b></div>
   <div class="rn-7q2v8">${c.note}</div>
   ${(axis||items)?`<div class="rl-7q2v8">${axis}${items}</div>`:''}
  </div>`;
 layout();
 requestAnimationFrame(()=>sug.querySelector('.res-7q2v8').classList.add('on-7q2v8'));
}


/* ── 시험성적서 레이어 팝업 ── */
(function(){
 const md=$('modal'), bt=$('cert'), cl=$('mclose');
 if(!md||!bt)return;
 const open=()=>md.classList.add('on');
 const close=()=>md.classList.remove('on');
 bt.addEventListener('click',open);
 cl&&cl.addEventListener('click',close);
 md.addEventListener('click',e=>{if(e.target===md)close();});
 addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();

/* ── 알약 크기·위치 ── */
let W=0,H=0,DPR=1,PW=0,PH=0,CX=0,CY=0;
function layout(){
 W=wrap.clientWidth; H=wrap.clientHeight; DPR=Math.min(devicePixelRatio||1,2);
 const NAR=W<760;
 PW=Math.min(NAR?W*0.90:W*0.70, 1040);
 PH=Math.max(NAR?58:74, Math.min(PW*(NAR?0.185:0.135), 132));
 ph.style.fontSize=Math.round(Math.max(13, Math.min(PH*0.30, 32)))+'px';
 pill.style.width=Math.round(PW)+'px';
 pill.style.height=Math.round(PH)+'px';
 const ic=Math.round(PH*0.34), gb=Math.round(PH*0.66);
 plus.setAttribute('width',ic); plus.setAttribute('height',ic);
 mic.setAttribute('width',ic);  mic.setAttribute('height',ic);
 go.style.width=gb+'px'; go.style.height=gb+'px';
 wave.setAttribute('width',Math.round(gb*0.52)); wave.setAttribute('height',Math.round(gb*0.52));
 // 칩 줄은 캡션 위에 반드시 남게 배치한다
 const capH=cap.getBoundingClientRect().height||34;
 const sugH=sug.getBoundingClientRect().height||40;
  const floor=H*0.36+PH/2+14;                       // 알약을 절대 침범하지 않는 하한
 const want=H*0.36+PH/2+Math.max(26,H*0.045);
 const limit=H-(H*0.052+capH)-sugH-14;
 sug.style.top=Math.round(Math.max(floor, Math.min(want, limit)))+'px';
 sug.style.maxWidth=Math.round(Math.min(W*0.92, 980))+'px';
 CX=W/2; CY=H*0.36;
 halo.width=Math.round(W*DPR); halo.height=Math.round(H*DPR);
 bake();
}
/* ── 하프톤 halo ── 알약 윤곽까지의 거리로 점 크기·밝기·색을 정한다 */
let BASE=null;
function sd(x,y){                      // 알약(완전 라운드) 표면까지의 거리
 const R=PH/2, ex=Math.max(Math.abs(x-CX)-(PW/2-R),0), ey=Math.abs(y-CY);
 return Math.hypot(ex,ey)-R;
}
function bake(){
 BASE=document.createElement('canvas');
 BASE.width=halo.width; BASE.height=halo.height;
 const c=BASE.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
 const step=Math.max(9, Math.round(PH*0.095));
 const FADE=PH*0.50, SPAN=PW*1.15;         // 알약에서 약 1 알약높이까지만 퍼진다
 const REACH=PH*1.35;
 const x0=CX-PW/2-REACH, x1=CX+PW/2+REACH, y0=CY-PH/2-REACH, y1=CY+PH/2+REACH;
 for(let y=y0; y<=y1; y+=step){
  if(y<-step||y>H+step) continue;
  for(let x=x0; x<=x1; x+=step){
   if(x<-step||x>W+step) continue;
   const d=sd(x,y);
   if(d<PH*0.10) continue;                       // 알약 안쪽·경계는 비운다
   const f=Math.exp(-d/FADE);
   if(f<0.10) continue;
   const t=Math.min(1,Math.max(0,(x-(CX-SPAN/2))/SPAN));
   const r=Math.round(255+(43-255)*t), g=Math.round(63+(107-63)*t), b=Math.round(208+(255-208)*t);
   const s=step*0.40*(0.30+0.70*f);
   c.fillStyle=`rgba(${r},${g},${b},${(f*0.95).toFixed(3)})`;
   c.beginPath();                                 // 다이아몬드
   c.moveTo(x,y-s); c.lineTo(x+s*0.60,y); c.lineTo(x,y+s); c.lineTo(x-s*0.60,y);
   c.closePath(); c.fill();
  }
 }
 // 알약 주변 부드러운 글로우
 c.globalCompositeOperation='lighter';
 const g2=c.createLinearGradient(CX-PW/2,0,CX+PW/2,0);
 g2.addColorStop(0,'rgba(255,63,208,.34)'); g2.addColorStop(.55,'rgba(150,120,255,.24)');
 g2.addColorStop(1,'rgba(43,107,255,.34)');
 c.filter=`blur(${Math.round(PH*0.30)}px)`;

 c.roundRect(CX-PW/2-R*0.5, CY-PH/2-R*0.5, PW+R, PH+R, (PH+R)/2); c.fill();

}
/* ── 숨쉬기 + 좌우 스윕 (베이크한 층 위에 아주 가벼운 합성만) ── */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let STILL=RM.matches, t0=0, run=true;
function draw(ts){
 if(!run) return;
 if(!t0) t0=ts; const T2=(ts-t0)/1000;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,halo.width,halo.height);
 ctx.globalAlpha=STILL?1:(0.88+0.12*Math.sin(T2*0.9));
 ctx.drawImage(BASE,0,0);
 ctx.globalAlpha=1;
 if(!STILL){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='lighter';
  const p=((T2*0.16)%1.6)-0.3, sx=CX+(p-0.5)*PW*1.7;
  const g=ctx.createRadialGradient(sx,CY,0,sx,CY,PW*0.30);
  g.addColorStop(0,'rgba(190,210,255,.10)'); g.addColorStop(1,'rgba(190,210,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(draw);
 }
}
/* ── 타이핑 데모: 질의를 치고 → 결과를 아래에 편다 ── */
let ci=-1, timers=[];
const clearT=()=>{timers.forEach(clearTimeout);timers=[];};
const wait=(ms,fn)=>timers.push(setTimeout(fn,ms));

function typeQ(text, done){
 ph.style.opacity='1'; ph.textContent='';
 let i=0;
 const step=()=>{
  ph.textContent=text.slice(0,++i);
  if(i<text.length) wait(28+Math.random()*34, step); else wait(260, done);
 };
 step();
}
function runCase(){
 clearT();
 ci=(ci+1)%CASES.length;
 const c=CASES[ci];
 sug.innerHTML='';
 typeQ(c.q, ()=>{
  paint(c);
  wait(4200, runCase);          // 결과를 보여주는 시간
 });
}
wait(500, runCase);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearT(); });

let rt=0;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();
 if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,halo.width,halo.height);ctx.drawImage(BASE,0,0);}
},140);});
document.addEventListener('visibilitychange',()=>{run=!document.hidden;
 if(run&&!STILL){t0=0;requestAnimationFrame(draw);}});
RM.addEventListener?.('change',e=>{STILL=e.matches;
 if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,halo.width,halo.height);ctx.drawImage(BASE,0,0);
   } else {t0=0;requestAnimationFrame(draw);}});

layout();
if(STILL){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(BASE,0,0); clearInterval(cyc);}
else requestAnimationFrame(draw);
})();
