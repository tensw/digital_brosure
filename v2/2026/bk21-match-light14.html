<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BK21 저자 매칭 현황 — 라이트</title>
<style>
:root{
 --bg-5m:#1b9df2; --bg2-5m:#4fb8f7; --bg3-5m:#0d7ec9;
 --card-5m:#ffffff; --ink-5m:#12314c; --ink2-5m:#4a708f; --ink3-5m:#8aa8c2;
 --acc-5m:#1479e0; --accbg-5m:#e9f4ff;
 --gIn-5m:#0fae7a; --gEx-5m:#6d55ef; --gUn-5m:#7f97b5; --warn-5m:#f0a828}
.cover-5m,.cover-5m *{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{margin:0;font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 background:var(--bg-5m);color:#fff;-webkit-font-smoothing:antialiased}
.cover-5m{position:relative;width:100vw;height:100vh;min-height:640px;overflow:hidden;background:var(--bg-5m)}
/* 뒤에 깔린 연한 원 — 레퍼런스의 블롭 */
.blob-5m{position:absolute;border-radius:50%;pointer-events:none}
.b1-5m{width:1180px;height:1180px;background:var(--bg2-5m);opacity:.55;left:34%;top:-30%}
.b2-5m{width:820px;height:820px;background:var(--bg2-5m);opacity:.38;left:64%;top:44%}
.b3-5m{width:560px;height:560px;background:var(--bg3-5m);opacity:.22;left:-12%;top:52%}

#stage-5m{position:absolute;left:50%;top:50%;width:1600px;height:900px;
 transform-origin:50% 50%;will-change:transform}

/* ── 좌상단 카피 ── */
.hd-5m{position:absolute;left:74px;top:64px;z-index:6;max-width:560px}
.kick-5m{font:700 12.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:rgba(255,255,255,.92)}
.cover-5m h1{margin-top:24px;font-size:40px;font-weight:400;letter-spacing:-1.1px;line-height:1.32;color:#fff}
.cover-5m h1 b{font-weight:800}
.lead-5m{margin-top:22px;font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.88);max-width:46ch}
.lead-5m b{font-weight:700;color:#fff}
.meta-5m{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.mt-5m{font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:8px 12px;
 border-radius:999px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34)}
.foot-5m{position:absolute;left:74px;bottom:34px;z-index:6;
 font:600 10.5px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:rgba(255,255,255,.7)}

/* ── 흰 카드 ── */
.card-5m{position:absolute;background:var(--card-5m);border-radius:26px;z-index:4;
 box-shadow:0 30px 64px -22px rgba(4,52,96,.42), 0 6px 18px -8px rgba(4,52,96,.22);
 padding:20px 22px;display:flex;flex-direction:column}
.card-5m h3{font-size:15px;font-weight:800;color:var(--ink-5m);letter-spacing:-.3px;
 display:flex;align-items:center;gap:8px}
.card-5m h3 i{font-style:normal;width:9px;height:9px;border-radius:50%;flex:none}
.bdg-5m{margin-left:auto;font:800 8.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;
 padding:5px 8px;border-radius:6px;background:var(--accbg-5m);color:var(--acc-5m)}
.big-5m{font:800 34px/1 ui-monospace,Menlo,monospace;letter-spacing:-1.6px;color:var(--ink-5m);margin-top:12px}
.big-5m s{text-decoration:none;font-size:14px;font-weight:700;color:var(--ink2-5m);margin-left:6px;letter-spacing:0}
.sub-5m{font-size:11.5px;line-height:1.62;color:var(--ink2-5m);margin-top:9px}
.bar-5m{height:9px;border-radius:6px;background:#e8f0f7;overflow:hidden;margin-top:12px;display:flex}
.bar-5m i{display:block;height:100%}
.pct-5m{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--ink3-5m);margin-top:7px;
 display:flex;justify-content:space-between}

/* ── 정보 패널 (레퍼런스 우측 긴 화면) ── */
.panel-5m{position:absolute;background:var(--card-5m);border-radius:26px;z-index:4;
 box-shadow:0 30px 64px -22px rgba(4,52,96,.42), 0 6px 18px -8px rgba(4,52,96,.22);
 padding:18px 20px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.ph-5m{font-size:13.5px;font-weight:800;color:var(--ink-5m);letter-spacing:-.2px;
 display:flex;align-items:center;gap:7px}
.ph-5m u{text-decoration:none;margin-left:auto;font:700 9.5px/1 ui-monospace,Menlo,monospace;
 color:var(--ink3-5m);letter-spacing:.1em}
.rows-5m{display:flex;flex-direction:column;gap:8px}
.row-5m{display:flex;align-items:center;gap:9px}
.row-5m b{font-size:11.5px;font-weight:700;color:var(--ink-5m);width:104px;flex:none;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-5m .t-5m{flex:1;height:8px;border-radius:5px;background:#eaf1f8;overflow:hidden}
.row-5m .t-5m i{display:block;height:100%;border-radius:5px;background:var(--acc-5m)}
.row-5m s{text-decoration:none;font:700 10.5px/1 ui-monospace,Menlo,monospace;color:var(--ink2-5m);
 width:66px;text-align:right;flex:none}
.chips-5m{display:flex;gap:6px;flex-wrap:wrap}
.chip-5m{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:6px 10px;
 border-radius:999px;background:var(--accbg-5m);color:var(--acc-5m)}
.chip-5m u{text-decoration:none;color:#7ea9d6;margin-left:5px}
.note-5m{font-size:10.5px;line-height:1.6;color:var(--ink3-5m);border-top:1px solid #eaf1f8;padding-top:10px}
.cta-5m{margin-top:auto;border-radius:14px;background:var(--acc-5m);color:#fff;text-align:center;
 padding:11px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;
 box-shadow:0 10px 22px -10px rgba(20,121,224,.9)}

/* ── 연결선 + 도트 + 라벨 (레퍼런스 핵심 장치) ── */
.lead-svg-5m{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:visible}
.lead-svg-5m line{stroke:rgba(255,255,255,.72);stroke-width:1.1}
.lead-svg-5m circle{fill:#fff}
.lb-5m{position:absolute;z-index:5;font-size:12px;font-weight:700;line-height:1.5;color:#fff;
 text-shadow:0 1px 6px rgba(4,52,96,.32)}
.lb-5m u{text-decoration:none;display:block;font-weight:500;color:rgba(255,255,255,.85)}
</style></head><body>
<div class="cover-5m" id="cover-5m">
 <span class="blob-5m b1-5m"></span><span class="blob-5m b2-5m"></span><span class="blob-5m b3-5m"></span>
 <div id="stage-5m">
  <div class="hd-5m">
   <div class="kick-5m">BK21 · AUTHOR MATCHING STATUS</div>
   <h1>저자행 528만 줄이<br><b>세 갈래로 갈립니다</b></h1>
   <p class="lead-5m">논문 한 편에는 저자가 여럿 있고, 그 저자를 성균관대 사람과 이어붙이는 것이 매칭이다.
    지금 <b>5,280,301줄</b>이 교내 확정 · 외부 저자 · 미분류로 나뉘어 있다.
    확정된 저자행만 성과 집계에 들어간다.</p>
   <div class="meta-5m">
    <span class="mt-5m">기준 2026-08-25</span>
    <span class="mt-5m">논문 140,850</span>
    <span class="mt-5m">확정 인물 11,930</span>
   </div>
  </div>
  <svg class="lead-svg-5m" id="ld-5m"></svg>
  <div id="cards-5m"></div>
  <div class="foot-5m">BIBLO · Research Information Management System</div>
 </div>
</div>
<script>
/* ══ 데이터 ══ BK21_매칭_현황판.html 의 D 를 그대로 가져왔다 (기준 2026-08-25) */
const D={rows:5280301,
 groups:[
  {k:'in',t:'교내 확정',badge:'LINKED',  v:356232, c:'var(--gIn-5m)',
   note:'성균관대 구성원으로 판별돼 사번이 붙은 저자행. 이 행만 성과 집계에 들어간다.'},
  {k:'ex',t:'외부 저자',badge:'EXTERNAL',v:2618171,c:'var(--gEx-5m)',
   note:'교외 소속으로 확인된 공저자. 사번은 없지만 이름·소속·ORCID 를 보존해 협력망 분석에 쓴다.'},
  {k:'un',t:'미분류',  badge:'PENDING', v:2305898,c:'var(--gUn-5m)',
   note:'교내·교외 판정을 아직 내리지 못한 저자행. 소속 문자열이 없거나 판별 신호가 부족하다.'}],
 layers:[['원장 연결',356017],['L1 · 식별자',3785],['L2 · 이름+소속',2391],['L4 · LLM 판별',898],
         ['U 접두 규칙',854],['HITL · 사람검토',207],['논문 병합',154],['L3 · 확률',13]],
 sig:[['SCOPUS_AUID',2892],['FULLNAME_SKKU',2391],['L4_LLM_MATCHED',898],['U_PREFIX_AUTO',560],
      ['ORCID',534],['EMAIL',312],['U_PREFIX_MANUAL',294]],
 ids:{tot:4915982,nm:4765793,aff:4121282,auid:858249,orcid:85577},
 papers:{tot:140850,linked:138635}, staff:364319};
const nf=n=>(+n).toLocaleString('ko-KR');
const pc=(a,b)=>+(a/b*100).toFixed(1);

/* ── 카드 3장 + 패널 2장 ── */
function build(){
 const G=D.groups, T=D.rows;
 const card=(g,x,y,w,h)=>`
  <div class="card-5m" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
   <h3><i style="background:${g.c}"></i>${g.t}<span class="bdg-5m">${g.badge}</span></h3>
   <div class="big-5m">${nf(g.v)}<s>줄</s></div>
   <div class="bar-5m"><i style="width:${pc(g.v,T)}%;background:${g.c}"></i></div>
   <div class="pct-5m"><span>전체의 ${pc(g.v,T)}%</span><span>${nf(T)} 중</span></div>
   <div class="sub-5m">${g.note}</div>
  </div>`;
 const mxL=Math.max(...D.layers.map(d=>d[1]));
 const layers=`
  <div class="panel-5m" style="left:1002px;top:96px;width:390px;height:376px">
   <div class="ph-5m">판별 경로별 연결<u>${nf(D.staff)} 건</u></div>
   <div class="rows-5m">${D.layers.map(([n,v])=>`
     <div class="row-5m"><b>${n}</b><span class="t-5m"><i style="width:${Math.max(2,v/mxL*100)}%"></i></span>
      <s>${nf(v)}</s></div>`).join('')}</div>
   <div class="note-5m">원장 연결은 제출 원장에서 바로 이어붙인 행이라 판별 엔진을 타지 않는다.
    엔진이 실제로 붙인 것은 나머지 <b>8,302건</b>.</div>
  </div>`;
 const mxS=Math.max(...D.sig.map(d=>d[1]));
 const I=D.ids;
 const sig=`
  <div class="panel-5m" style="left:1002px;top:496px;width:390px;height:368px">
   <div class="ph-5m">확정에 쓰인 신호<u>상위 7</u></div>
   <div class="chips-5m">${D.sig.map(([n,v])=>`<span class="chip-5m">${n}<u>${nf(v)}</u></span>`).join('')}</div>
   <div class="ph-5m" style="margin-top:2px">식별자 채움률<u>저자행 ${nf(I.tot)}</u></div>
   <div class="rows-5m">${[['이름',I.nm],['소속',I.aff],['Scopus AUID',I.auid],['ORCID',I.orcid]]
     .map(([n,v])=>`<div class="row-5m"><b>${n}</b>
       <span class="t-5m"><i style="width:${pc(v,I.tot)}%"></i></span>
       <s>${pc(v,I.tot)}%</s></div>`).join('')}</div>
   <div class="cta-5m">논문 ${nf(D.papers.linked)} / ${nf(D.papers.tot)} 편에 저자가 붙었다</div>
  </div>`;
 document.getElementById('cards-5m').innerHTML =
   card(G[0],96,392,330,238) + card(G[1],452,330,330,238) + card(G[2],668,610,330,214)
   + layers + sig;
 leaders();
}
/* ── 연결선 + 도트 + 라벨 ── */
const LEAD=[
 {x1:200,y1:630, x2:200,y2:664, lx:112,ly:676, t:'사번이 붙은 저자행',  s:'성과 집계에 들어가는 유일한 갈래'},
 {x1:782,y1:392, x2:872,y2:392, lx:876,ly:360, t:'교외 공저자',        s:'협력망 분석에 쓰인다'},
 {x1:833,y1:824, x2:833,y2:868, lx:600,ly:846, t:'판정이 남은 절반',    s:'소속 문자열이 없거나 신호가 모자란다'},
 {x1:1002,y1:214,x2:936,y2:214, lx:706,ly:150, t:'무엇으로 이어붙였나', s:'경로 8종의 실제 건수'},
 {x1:1002,y1:560,x2:946,y2:560, lx:806,ly:530, t:'식별자가 얼마나 찼나',s:'ORCID 는 아직 1.7%'}];
function leaders(){
 const s=document.getElementById('ld-5m');
 s.setAttribute('viewBox','0 0 1600 900');
 s.innerHTML=LEAD.map(L=>
   `<line x1="${L.x1}" y1="${L.y1}" x2="${L.x2}" y2="${L.y2}"/><circle cx="${L.x2}" cy="${L.y2}" r="3.6"/>`
 ).join('');
 document.getElementById('stage-5m').insertAdjacentHTML('beforeend',
   LEAD.map(L=>`<div class="lb-5m" style="left:${L.lx}px;top:${L.ly}px">${L.t}<u>${L.s}</u></div>`).join(''));
}
/* ── 고정 캔버스 ── */
const SW=1600, SH=900;
function fit(){const st=document.getElementById('stage-5m');
 const k=Math.min(innerWidth/SW, innerHeight/SH);
 st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;}
build(); fit(); addEventListener('resize',fit);
</script></body></html>
