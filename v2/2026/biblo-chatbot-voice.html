<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>챗봇 음성 처리 효과 — BIBLO</title>
<style>
/* 클래스·ID·변수 전부 -5w9z2 접미사 · 전역 선택자 없음 */
.root-5w9z2{--ink-5w9z2:#e9eefb;--ink2-5w9z2:#93a6cc;--ink3-5w9z2:#5d7099;
 --core-5w9z2:#eaf5ff;--neon-5w9z2:#4db8ff;--deep-5w9z2:#1f4fe0;--far-5w9z2:#132a9e;
 font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 color:var(--ink-5w9z2);-webkit-font-smoothing:antialiased;
 background:radial-gradient(1200px 900px at 50% 8%,#0b1226 0%,#060a16 58%,#03050c 100%)}
.root-5w9z2 *{box-sizing:border-box;margin:0;padding:0}
/* ── 무대 규격 (작업가이드 5장) ── */
html,body{overflow:hidden}
body{font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.slide{position:relative;width:100vw;height:100vh;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%}
.emb-bg0, .emb-bg0 body, .emb-bg0 .slide{background:transparent !important}
/* 작업가이드 5장: 1600x900, 좌우 82px 고정. 원본은 세로 1058px 문서였다.
   헤더·카드·각주는 제 높이를 지키고 가운데 무대박스가 남는 높이를 흡수한다. */
.wrap-5w9z2{width:1600px;height:900px;padding:38px 82px 16px;display:flex;flex-direction:column}

.hd-5w9z2{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.spacer-5w9z2{flex:1}
.kicker-5w9z2{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.28em;color:var(--ink3-5w9z2)}
/* 폰트 규격 — 한글 제목 3.15em(44px), 서브 16px/600, 카드 본문 14.5px/500/1.5 */
.h1-5w9z2{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin-top:12px;line-height:1.18}
.h1-5w9z2 span{background:linear-gradient(90deg,#38bdf8,#a78bfa 45%,#f472b6 72%,#fbbf24);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead-5w9z2{color:var(--ink2-5w9z2);font-size:16px;font-weight:600;margin-top:12px;max-width:96ch;line-height:1.6}
.lead-5w9z2 b{color:var(--ink-5w9z2)}
.meta-5w9z2{font:600 11px/1.95 ui-monospace,Menlo,monospace;color:var(--ink3-5w9z2);
 text-align:right;letter-spacing:.05em}
.meta-5w9z2 b{color:var(--ink2-5w9z2)}

/* ── 무대 ── */
.stage-5w9z2{margin-top:34px;position:relative;border-radius:26px;overflow:hidden;
 background:#000;border:1px solid rgba(120,150,220,.16);
 flex:1;min-height:0;display:grid;place-items:center;cursor:pointer;user-select:none}
.spark-5w9z2{position:absolute;inset:0;pointer-events:none}
.hint-5w9z2{position:absolute;left:22px;bottom:18px;z-index:5;
 font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#5d7099}
.now-5w9z2{position:absolute;right:22px;bottom:18px;z-index:5;
 font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--neon-5w9z2)}

/* ── 오브젝트 공통 ── */
.orb-5w9z2{position:relative;width:var(--s-5w9z2,240px);height:var(--s-5w9z2,240px);
 display:grid;place-items:center}
.orb-5w9z2 > *{grid-area:1/1;transition:opacity .34s ease, transform .34s ease}
.off-5w9z2{opacity:0;transform:scale(.86);pointer-events:none}

/* ① 파형 */
.wave-5w9z2{display:flex;align-items:center;justify-content:center;gap:var(--g-5w9z2,7px);
 width:100%;height:100%}
.bar-5w9z2{width:var(--bw-5w9z2,6px);border-radius:99px;transform-origin:center;
 animation:bob-5w9z2 var(--dur-5w9z2,1.1s) ease-in-out infinite alternate;
 animation-delay:var(--dl-5w9z2,0s)}
@keyframes bob-5w9z2{from{transform:scaleY(var(--a-5w9z2,.55))}to{transform:scaleY(var(--b-5w9z2,1))}}

/* ② 스피너 · ③ 링 */
.ring-5w9z2{width:100%;height:100%;display:grid;place-items:center}
.ring-5w9z2 svg{width:var(--rs-5w9z2,150px);height:var(--rs-5w9z2,150px);overflow:visible}
.spin-5w9z2{transform-origin:50% 50%;animation:rot-5w9z2 1.15s linear infinite}
@keyframes rot-5w9z2{to{transform:rotate(360deg)}}
.pulse-5w9z2{animation:pl-5w9z2 2.1s ease-in-out infinite}
@keyframes pl-5w9z2{0%,100%{opacity:.86}50%{opacity:1}}

/* ── 상태 카드 3장 ── */
.grid-5w9z2{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.cell-5w9z2{position:relative;border-radius:20px;overflow:hidden;background:#000;
 border:1px solid rgba(120,150,220,.16);padding:22px 22px 20px;
 display:flex;flex-direction:column;align-items:center;gap:16px;min-height:250px}
.cell-5w9z2 .cs-5w9z2{position:absolute;inset:0;pointer-events:none}
.cn-5w9z2{position:relative;z-index:3;font:700 10px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.22em;color:var(--ink3-5w9z2);align-self:flex-start}
.ct-5w9z2{position:relative;z-index:3;font-size:15px;font-weight:800;letter-spacing:-.4px;
 align-self:flex-start;margin-top:-6px}
.cd-5w9z2{position:relative;z-index:3;font-size:14.5px;font-weight:500;line-height:1.5;color:var(--ink2-5w9z2);
 align-self:flex-start;margin-top:auto}
.cbox-5w9z2{position:relative;z-index:3;display:grid;place-items:center;flex:1;width:100%}

.foot-5w9z2{margin-top:22px;border-top:1px solid rgba(129,140,248,.14);padding-top:16px;
 color:var(--ink3-5w9z2);font-size:11.5px;line-height:1.9}
.foot-5w9z2 b{color:var(--ink2-5w9z2)}

</style></head><body style="margin:0">
<div class="slide"><div id="stage">

<div class="root-5w9z2"><div class="wrap-5w9z2">

 <div class="hd-5w9z2">
  <div>
   <div class="kicker-5w9z2">BIBLO · CHATBOT VOICE STATES</div>
   <h1 class="h1-5w9z2">챗봇이 말을 듣고 있다는 것을<br><span>화면으로 알려주는 신호</span></h1>
   <p class="lead-5w9z2">음성 챗봇은 <b>대기 · 듣는 중 · 답 만드는 중</b> 세 상태를 오간다.
    지금 어느 상태인지 보이지 않으면 사용자는 말을 언제 시작할지, 얼마나 기다릴지 알 수 없다.
    아래 무대를 <b>누르면</b> 세 상태가 차례로 넘어간다. 이미지가 아니라 CSS·SVG 로 그려서
    색·크기·속도를 코드로 바꿀 수 있다.</p>
  </div>
  <div class="spacer-5w9z2"></div>
  <div class="meta-5w9z2">
   상태 <b>3</b>종<br>
   파형 막대 <b>15</b>개<br>
   GIF·이미지 <b>0</b>개
  </div>
 </div>

 <div class="stage-5w9z2" id="stage-5w9z2" role="button" tabindex="0"
      aria-label="챗봇 음성 상태 전환">
  <canvas class="spark-5w9z2" id="spark-5w9z2"></canvas>
  <div class="orb-5w9z2" id="orb-5w9z2" style="--s-5w9z2:260px"></div>
  <div class="hint-5w9z2">CLICK TO CYCLE</div>
  <div class="now-5w9z2" id="now-5w9z2"></div>
 </div>

 <div class="grid-5w9z2" id="grid-5w9z2"></div>
 <div class="foot-5w9z2" id="foot-5w9z2"></div>

</div></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const ORB=$('orb-5w9z2'), STAGE=$('stage-5w9z2'), NOW=$('now-5w9z2'),
      GRID=$('grid-5w9z2'), FT=$('foot-5w9z2');

/* ── 색: 가운데(코어) → 바깥(딥블루) ── */
const STOPS=[[0,[19,42,158]],[.28,[31,79,224]],[.62,[77,184,255]],[1,[234,245,255]]];
function col(t){
 for(let i=1;i<STOPS.length;i++){
  if(t<=STOPS[i][0]){
   const [p0,c0]=STOPS[i-1],[p1,c1]=STOPS[i],k=(t-p0)/(p1-p0);
   return `rgb(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*k)).join(',')})`;}}
 return 'rgb(234,245,255)';
}
/* ── ① 파형 ── */
function waveHTML(N,opt){
 const o=Object.assign({bw:6,gap:7,maxh:150,dur:1.05},opt||{});
 let s=`<div class="wave-5w9z2" style="--bw-5w9z2:${o.bw}px;--g-5w9z2:${o.gap}px">`;
 const c=(N-1)/2;
 for(let i=0;i<N;i++){
  const t=1-Math.abs(i-c)/c;                       // 0(끝) ~ 1(가운데)
  const h=Math.max(o.bw, Math.round(o.maxh*Math.pow(t,1.75)+o.bw));
  const cc=col(t), a=(.42+t*.18).toFixed(2), b=(1.0-t*.12).toFixed(2);
  const glow=Math.round(4+t*16);
  s+=`<span class="bar-5w9z2" style="height:${h}px;background:${cc};
    box-shadow:0 0 ${glow}px ${cc},0 0 ${Math.round(glow*2.2)}px ${cc};
    --a-5w9z2:${a};--b-5w9z2:${b};--dur-5w9z2:${(o.dur*(.72+((i*37)%13)/13*.62)).toFixed(2)}s;
    --dl-5w9z2:${((i*53)%17)/17*-1.2}s"></span>`;}
 return s+'</div>';
}
/* ── ②③ 링 ── */
function ringHTML(mode,size){
 const R=48, C=2*Math.PI*R, sw=7.5;
 const dash = mode==='spin' ? `${C*0.72} ${C*0.28}` : `${C} 0`;
 const cls  = mode==='spin' ? 'spin-5w9z2' : 'pulse-5w9z2';
 return `<div class="ring-5w9z2" style="--rs-5w9z2:${size}px">
  <svg viewBox="0 0 120 120">
   <defs>
    <linearGradient id="rg-5w9z2-${mode}" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#eaf5ff"/><stop offset=".45" stop-color="#4db8ff"/>
     <stop offset="1" stop-color="#1f4fe0"/></linearGradient>
    <filter id="gl-5w9z2-${mode}" x="-90%" y="-90%" width="280%" height="280%">
     <feGaussianBlur stdDeviation="5" result="b"/>
     <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
   </defs>
   <circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(60,110,220,.30)" stroke-width="${sw}"/>
   <circle class="${cls}" cx="60" cy="60" r="${R}" fill="none"
     stroke="url(#rg-5w9z2-${mode})" stroke-width="${sw}" stroke-linecap="round"
     stroke-dasharray="${dash}" filter="url(#gl-5w9z2-${mode})"/>
  </svg></div>`;
}
/* ── 상태 정의 ── */
const STATES=[
 {k:'idle',   n:'01', t:'대기',        c:'READY',
  d:'말을 걸기 전. 링이 천천히 숨 쉬듯 밝기만 오르내린다. 누르면 듣기로 넘어간다.'},
 {k:'listen', n:'02', t:'듣는 중',     c:'LISTENING',
  d:'사용자 목소리에 맞춰 파형이 움직인다. 가운데가 밝고 양끝으로 갈수록 어두워져 소리의 중심을 보여준다.'},
 {k:'think',  n:'03', t:'답 만드는 중', c:'THINKING',
  d:'입력이 끝나고 답을 만드는 구간. 링의 4분의 3만 밝은 채로 돌아 “아직 끝나지 않았다”를 알린다.'}
];
/* ── 큰 무대 ── */
let cur=0;
ORB.innerHTML =
  `<div data-st5w9z2="idle">${ringHTML('idle',168)}</div>`+
  `<div data-st5w9z2="listen">${waveHTML(15,{bw:7,gap:9,maxh:168,dur:1.05})}</div>`+
  `<div data-st5w9z2="think">${ringHTML('spin',168)}</div>`;
function show(i){
 cur=(i+STATES.length)%STATES.length;
 const k=STATES[cur].k;
 ORB.querySelectorAll('[data-st5w9z2]').forEach(e=>
   e.classList.toggle('off-5w9z2', e.dataset.st5w9z2!==k));
 NOW.textContent=STATES[cur].c;
}
show(0);
STAGE.addEventListener('click',()=>show(cur+1));
STAGE.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();show(cur+1);}});

/* ── 상태 카드 3장 ── */
GRID.innerHTML=STATES.map(s=>`
 <section class="cell-5w9z2">
  <canvas class="cs-5w9z2"></canvas>
  <div class="cn-5w9z2">${s.n} · ${s.c}</div>
  <div class="ct-5w9z2">${s.t}</div>
  <div class="cbox-5w9z2">${
    s.k==='listen' ? waveHTML(15,{bw:5,gap:6,maxh:104,dur:1.05})
  : s.k==='think'  ? ringHTML('spin',116)
  :                  ringHTML('idle',116)}</div>
  <div class="cd-5w9z2">${s.d}</div>
 </section>`).join('');

/* ── 반짝임 입자 ── */
function spark(cv,n,seed){
 /* getBoundingClientRect 는 무대 transform 이 곱해진 값이다. 레이아웃 픽셀을 쓴다. */
 const pe=cv.parentElement, r={width:pe.offsetWidth,height:pe.offsetHeight};
 const w=cv.width=Math.max(1,Math.ceil(r.width)), h=cv.height=Math.max(1,Math.ceil(r.height));
 cv.style.width='100%';cv.style.height='100%';
 const x=cv.getContext('2d'); let sd=seed;
 const rnd=()=>((sd=sd*1103515245+12345&0x7fffffff)/0x7fffffff);
 const cx=w/2, cy=h/2, R=Math.min(w,h)*0.46;
 for(let i=0;i<n;i++){
  const a=rnd()*Math.PI*2, d=R*(0.55+rnd()*1.15);
  const px=cx+Math.cos(a)*d, py=cy+Math.sin(a)*d*0.9;
  if(px<0||px>w||py<0||py>h)continue;
  const rr=rnd()*1.5+.3;
  x.globalAlpha=.18+rnd()*.62; x.fillStyle=rnd()<.35?'#eaf5ff':'#5aa8ff';
  x.beginPath();x.arc(px,py,rr,0,7);x.fill();}
}
function paint(){
 spark($('spark-5w9z2'),140,20260827);
 document.querySelectorAll('.cs-5w9z2').forEach((c,i)=>spark(c,52,7001+i*911));
}
paint(); addEventListener('resize',()=>{clearTimeout(window.__t5w9z2);
 window.__t5w9z2=setTimeout(paint,150);});

FT.innerHTML=`<b>구성.</b> 파형은 막대 15개를 스케일 애니메이션으로 움직이고,
 링은 SVG 원 하나에 <code>stroke-dasharray</code> 와 회전을 걸었다.
 발광은 <code>box-shadow</code> 와 SVG <code>feGaussianBlur</code> 두 겹.
 반짝임 입자는 캔버스에 고정 시드로 찍어 매번 같은 모양이 나온다.<br>
 <b>붙이는 법.</b> 클래스·ID·CSS 변수에 <b>-5w9z2</b> 접미사를 붙였고 전역 선택자가 없어
 다른 화면에 그대로 넣어도 이름이 겹치지 않는다. 상태 전환은 <code>show(0|1|2)</code> 한 줄이다.`;
})();
</script>
</div></div>

<script>
/* 1600x900 고정 무대 — 작업가이드 5장 규격.
   resize 하나만 걸면 iframe 슬라이드에서 배율이 틀어진 채 굳는다. 다섯 개를 다 건다. */
function fitStage(){
  const st=document.getElementById('stage'); if(!st) return;
  st.style.height='900px';
  const k=Math.min(innerWidth/1600, innerHeight/900);
  st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;
}
fitStage();
addEventListener('resize',fitStage);
addEventListener('load',fitStage);
addEventListener('pageshow',fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStage);
</script>
<script>if(window.self!==window.top) document.documentElement.classList.add('emb-bg0');</script>
</body></html>
