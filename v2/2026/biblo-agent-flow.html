<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>답변이 업무가 되는 과정 — BIBLO</title>
<style>
/* 클래스·ID·변수 전부 -af3x 접미사 · 전역 선택자 없음 */
.root-af3x{--ink-af3x:#e9eefb;--ink2-af3x:#93a6cc;--ink3-af3x:#5d7099;
 font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 color:var(--ink-af3x);
 background:radial-gradient(1200px 900px at 50% 8%,#0b1226 0%,#060a16 58%,#03050c 100%);
 -webkit-font-smoothing:antialiased;position:relative}
.root-af3x *{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* ── 무대 규격 (작업가이드 5장) ── */
html,body{overflow:hidden}
.slide{position:relative;width:100vw;height:100vh;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%}
.emb-bg0, .emb-bg0 body, .emb-bg0 .slide, .emb-bg0 .root-af3x{background:transparent !important}
/* 덱 안에서는 배경을 wave 레이어에 맡긴다 — 29·30 과 한 배경으로 이어지게 */
.emb-bg0 .root-af3x::after{opacity:.5}
.root-af3x::after{content:"";position:absolute;right:-6%;bottom:-14%;width:44%;height:46%;
 pointer-events:none;border-radius:50%;
 background:radial-gradient(circle at 50% 50%,rgba(226,214,255,.28) 0%,rgba(150,120,235,.13) 34%,
   rgba(60,50,160,0) 68%);filter:blur(6px)}

.wrap-af3x{position:relative;z-index:2;width:1600px;height:900px;padding:38px 82px 16px;
 display:flex;flex-direction:column}

/* ── 머리 ── */
.hd-af3x{flex:none}
.kick-af3x{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
 letter-spacing:.24em;color:#7f8fc4}
.hd-af3x h1{margin-top:16px;font-size:44px;font-weight:800;line-height:1.22;letter-spacing:-1.6px}
.hd-af3x h1 b{background:linear-gradient(96deg,#63d7ff 0%,#8f9dff 42%,#d59bff 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.lead-af3x{margin-top:14px;max-width:118ch;font-size:14.5px;font-weight:500;line-height:1.6;
 color:var(--ink2-af3x);letter-spacing:-.3px}
.lead-af3x b{color:#dbe4ff;font-weight:800}

/* ── 가운데 흐름 4단 ── */
.flow-af3x{margin-top:28px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);
 border-radius:18px;overflow:hidden;
 background:linear-gradient(120deg,rgba(18,26,58,.86),rgba(11,17,40,.72));
 border:1px solid rgba(140,170,240,.24);
 box-shadow:0 20px 46px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.10)}
.fc-af3x{position:relative;padding:44px 24px 42px;display:flex;flex-direction:column;
 align-items:center;text-align:center;gap:9px}
.fc-af3x+.fc-af3x:before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;
 margin-top:-6px;transform:rotate(45deg);
 border-top:2px solid rgba(170,205,255,.45);border-right:2px solid rgba(170,205,255,.45)}
.fc-af3x i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
 background:linear-gradient(150deg,rgba(56,214,248,.28),rgba(129,140,248,.18));
 border:1px solid rgba(150,220,255,.40);
 box-shadow:0 0 20px rgba(56,190,248,.24),inset 0 1px 0 rgba(255,255,255,.32)}
.fc-af3x b{font-size:18px;font-weight:800;letter-spacing:-.5px;line-height:1.25;color:var(--ink-af3x)}
.fc-af3x s{text-decoration:none;font-size:12px;font-weight:500;line-height:1.45;
 letter-spacing:-.3px;color:var(--ink3-af3x)}

/* ── 사례 카드 4장 ── */
.cases-af3x{margin-top:40px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
.case-af3x{display:flex;flex-direction:column;padding:24px 20px 22px;border-radius:18px;
 background:linear-gradient(160deg,rgba(16,23,52,.80),rgba(10,15,36,.62));
 border:1px solid rgba(140,170,240,.22);
 box-shadow:0 18px 40px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.09)}
.badge-af3x{align-self:flex-start;padding:4px 9px;border-radius:999px;
 font:700 9.6px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em}
.now-af3x{background:rgba(56,214,248,.14);border:1px solid rgba(120,200,240,.34);color:#8fe6ff}
.next-af3x{background:rgba(160,170,220,.10);border:1px solid rgba(150,165,220,.26);color:#9aa8d4}
.q-af3x{margin-top:15px;font-size:17px;font-weight:800;letter-spacing:-.6px;line-height:1.3;
 color:var(--ink-af3x)}
.row-af3x{margin-top:16px;padding-top:13px;border-top:1px solid rgba(140,170,240,.16)}
.row-af3x u{display:block;text-decoration:none;font:700 9.6px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.12em;color:#7f8fc4}
.row-af3x em{display:block;margin-top:6px;font-style:normal;font-size:13.5px;font-weight:700;
 letter-spacing:-.4px;line-height:1.4;color:#dde5ff}
.row-af3x.act-af3x em{color:#8fe6ff}
.mid-af3x{flex:none;margin-top:13px;display:flex;flex-direction:column;gap:9px}
.ans-af3x{padding:10px 12px;border-radius:11px;font-size:12.5px;font-weight:600;line-height:1.5;
 letter-spacing:-.3px;background:rgba(56,214,248,.10);border:1px solid rgba(120,200,240,.24);
 color:#d9e7f7}
.btns-af3x{display:flex;flex-wrap:wrap;gap:5px}
.btns-af3x span{padding:5px 9px;border-radius:8px;font:700 10px/1 ui-monospace,Menlo,monospace;
 background:rgba(150,170,255,.14);border:1px solid rgba(160,185,255,.28);color:#d6ddff}
.pend-af3x{padding:10px 12px;border-radius:11px;font-size:12.5px;font-weight:600;line-height:1.5;
 letter-spacing:-.3px;background:rgba(150,160,210,.07);border:1px dashed rgba(150,165,220,.28);
 color:#93a3cc}
.pend-af3x u{display:block;text-decoration:none;margin-bottom:4px;
 font:700 9.4px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:#7f8fc4}

/* ── 하단 한 줄 ── */
.foot-af3x{margin-top:auto;flex:none;padding-top:15px;border-top:1px solid rgba(120,140,200,.20);
 font-size:16px;font-weight:800;letter-spacing:-.5px;color:#c8d6ff}
.foot-af3x span{margin-left:12px;font:600 11.5px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.06em;color:var(--ink3-af3x)}
</style></head>
<body><div class="slide"><div id="stage">
<div class="root-af3x"><div class="wrap-af3x">

 <div class="hd-af3x">
  <div class="kick-af3x">BIBLO · AGENT FLOW</div>
  <h1>찾아주는 데서 끝나지 않습니다.<br><b>허용된 업무까지 이어집니다.</b></h1>
  <p class="lead-af3x">비블로는 질문에 답한 뒤 링크만 남기지 않습니다.
   현재 데이터를 확인하고, 사용자의 <b>권한과 조건</b>에 맞춰
   신청 · 예약 · 조회 · 담당자 연결까지 이어갑니다.</p>
 </div>

 <div class="flow-af3x" id="flow-af3x"></div>
 <div class="cases-af3x" id="cases-af3x"></div>

 <div class="foot-af3x">링크를 건네는 데서 끝나지 않고, 권한 안에서 다음 한 걸음까지 연결합니다.
  <span>실행 범위는 기관이 정한 권한 안에서만 · 화면 문구는 예시</span></div>

</div></div>

<script>
const FLOW_af3x=[
 {t:'질문 이해', d:'묻는 뜻과 필요한 조건을 가려낸다', i:'ask'},
 {t:'정보 검색', d:'기관이 검수한 지식에서 답을 찾는다', i:'find'},
 {t:'현재 상태 확인', d:'질문한 시점의 데이터와 이용자 조건을 본다', i:'check'},
 {t:'실행 또는 담당자 연결', d:'권한 안이면 실행하고, 아니면 담당자에게 넘긴다', i:'act'}
];
const ICO_af3x={
 ask :'<circle cx="12" cy="12" r="8.4"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.5"/><path d="M12 16.6h.01"/>',
 find:'<circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4L20 20"/>',
 check:'<path d="M20.4 12v6.2a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2V5.8a2 2 0 0 1 2-2H14"/><path d="M8.6 11.8l3 3 8-8.4"/>',
 act :'<path d="M4.6 12h9.8"/><path d="M11 8.2l3.8 3.8-3.8 3.8"/><path d="M17 4.4h1.4a1.6 1.6 0 0 1 1.6 1.6v12a1.6 1.6 0 0 1-1.6 1.6H17"/>'
};
/* 사례 — 연결 상태는 실측 기준 (소장·대출 적재 완료 / 좌석 현황 운영 중 / 장학·조직 KPI 는 원천 미연결) */
const CASES_af3x=[
 {q:'“이 책 지금 빌릴 수 있어?”', chk:'소장 · 대출 · 예약 상태',
  act:'자료 위치 · 예약 · 대출 연결', now:true,
  ans:'소장과 대출 상태를 확인했습니다. 이용 가능한 자료의 위치와 예약 방법을 안내합니다.',
  btns:['자료 위치','예약하기','근거 보기']},
 {q:'“빈자리 있어?”', chk:'현재 좌석 · 이용 조건',
  act:'좌석 현황 확인 · 예약 연결', now:true,
  ans:'열람실별 이용 현황을 확인했습니다. 이용 조건에 맞는 좌석을 고를 수 있습니다.',
  btns:['좌석 선택','이용 조건']},
 {q:'“내가 받을 수 있는 장학금은?”', chk:'학적 · 성적 · 자격 · 신청기한', now:false,
  act:'신청 화면 · 필요서류 안내',
  pend:'학적 · 성적 원천이 연결되기 전에는 공고 범위에서만 답하고, 자격 판정은 담당 부서로 넘긴다.'},
 {q:'“목표에서 벗어난 조직은?”', chk:'확정 KPI · 목표 · 현재 실적', now:false,
  act:'조직별 상세 · 근거 확인',
  pend:'기관이 KPI 와 목표값을 확정해 연결하면 그 기준으로만 판정한다. 비블로가 목표를 정하지 않는다.'}
];
document.getElementById('flow-af3x').innerHTML=FLOW_af3x.map(o=>
 `<div class="fc-af3x"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none"`
 +` stroke="#dff4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">`
 +`${ICO_af3x[o.i]}</svg></i><b>${o.t}</b><s>${o.d}</s></div>`).join('');
document.getElementById('cases-af3x').innerHTML=CASES_af3x.map(o=>
 `<section class="case-af3x">`
 +`<span class="badge-af3x ${o.now?'now-af3x':'next-af3x'}">`
 +`${o.now?'지금 되는 일':'데이터가 연결되면'}</span>`
 +`<div class="q-af3x">${o.q}</div>`
 +`<div class="mid-af3x">`
 +(o.now?`<div class="ans-af3x">${o.ans}</div>`
        +`<div class="btns-af3x">${o.btns.map(x=>`<span>${x}</span>`).join('')}</div>`
        :`<div class="pend-af3x"><u>연결 전에는</u>${o.pend}</div>`)
 +`</div>`
 +`<div class="row-af3x"><u>확인하는 정보</u><em>${o.chk}</em></div>`
 +`<div class="row-af3x act-af3x"><u>이어지는 행동</u><em>${o.act}</em></div>`
 +`</section>`).join('');
</script>

<script>
/* 1600x900 고정 무대 — 작업가이드 5장 규격. 다섯 개를 다 건다. */
function fitStage(){
  const st=document.getElementById('stage'); if(!st) return;
  st.style.height='900px';
  const k=Math.min(innerWidth/1600, innerHeight/900);
  st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;
}
fitStage();
addEventListener('resize',fitStage);
addEventListener('load',fitStage);
addEventListener('pageshow',fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStage);
</script>
<script>if(window.self!==window.top) document.documentElement.classList.add('emb-bg0');</script>
</body></html>
