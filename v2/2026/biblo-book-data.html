<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>책 데이터 보유 현황 — 자연어 검색이 왜 이렇게 좋은가</title>
<style>
:root{
 --bg-7k:#1b9df2; --bg2-7k:#4fb8f7; --bg3-7k:#0d7ec9;
 --card-7k:#ffffff; --ink-7k:#12314c; --ink2-7k:#4a708f; --ink3-7k:#8aa8c2;
 --acc-7k:#1479e0; --accbg-7k:#e9f4ff;
 --gAll-7k:#1479e0; --gFp-7k:#0fae7a; --gVec-7k:#6d55ef}
.cover-7k,.cover-7k *{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{margin:0;font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 background:var(--bg-7k);color:#fff;-webkit-font-smoothing:antialiased}
.cover-7k{position:relative;width:100vw;height:100vh;min-height:640px;overflow:hidden;background:var(--bg-7k)}
.blob-7k{position:absolute;border-radius:50%;pointer-events:none}
.b1-7k{width:1180px;height:1180px;background:var(--bg2-7k);opacity:.55;left:34%;top:-30%}
.b2-7k{width:820px;height:820px;background:var(--bg2-7k);opacity:.38;left:64%;top:44%}
.b3-7k{width:560px;height:560px;background:var(--bg3-7k);opacity:.22;left:-12%;top:52%}

#stage-7k{position:absolute;left:50%;top:50%;width:1600px;height:900px;
 transform-origin:50% 50%;will-change:transform}

/* ── 좌상단 카피 ── */
.hd-7k{position:absolute;left:74px;top:64px;z-index:6;max-width:700px}
.kick-7k{font:700 12.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:rgba(255,255,255,.92)}
.cover-7k h1{margin-top:24px;font-size:37px;font-weight:400;letter-spacing:-1.2px;line-height:1.32;color:#fff;white-space:nowrap}
.cover-7k h1 b{font-weight:800}
.lead-7k{margin-top:22px;font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.88);max-width:44ch}
.lead-7k b{font-weight:700;color:#fff}
.meta-7k{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.mt-7k{font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:8px 12px;
 border-radius:999px;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34)}
.foot-7k{position:absolute;left:74px;bottom:34px;z-index:6;
 font:600 10.5px/1.7 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:rgba(255,255,255,.7)}

/* ── 흰 카드 ── */
.card-7k{position:absolute;background:var(--card-7k);border-radius:26px;z-index:4;
 box-shadow:0 30px 64px -22px rgba(4,52,96,.42), 0 6px 18px -8px rgba(4,52,96,.22);
 padding:20px 22px;display:flex;flex-direction:column}
.card-7k h3{font-size:15px;font-weight:800;color:var(--ink-7k);letter-spacing:-.3px;
 display:flex;align-items:center;gap:8px}
.card-7k h3 i{font-style:normal;width:9px;height:9px;border-radius:50%;flex:none}
.bdg-7k{margin-left:auto;font:800 8.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;
 padding:5px 8px;border-radius:6px;background:var(--accbg-7k);color:var(--acc-7k)}
.big-7k{font:800 34px/1 ui-monospace,Menlo,monospace;letter-spacing:-1.6px;color:var(--ink-7k);margin-top:12px}
.big-7k s{text-decoration:none;font-size:14px;font-weight:700;color:var(--ink2-7k);margin-left:6px;letter-spacing:0}
.sub-7k{font-size:11.5px;line-height:1.62;color:var(--ink2-7k);margin-top:9px}
.bar-7k{height:9px;border-radius:6px;background:#e8f0f7;overflow:hidden;margin-top:12px;display:flex}
.bar-7k i{display:block;height:100%}
.pct-7k{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--ink3-7k);margin-top:7px;
 display:flex;justify-content:space-between}

/* ── 정보 패널 ── */
.panel-7k{position:absolute;background:var(--card-7k);border-radius:26px;z-index:4;
 box-shadow:0 30px 64px -22px rgba(4,52,96,.42), 0 6px 18px -8px rgba(4,52,96,.22);
 padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ph-7k{font-size:13.5px;font-weight:800;color:var(--ink-7k);letter-spacing:-.2px;
 display:flex;align-items:center;gap:7px}
.ph-7k u{text-decoration:none;margin-left:auto;font:700 9.5px/1 ui-monospace,Menlo,monospace;
 color:var(--ink3-7k);letter-spacing:.1em}
.rows-7k{display:flex;flex-direction:column;gap:8px}
.row-7k{display:flex;align-items:center;gap:9px}
.row-7k b{font-size:11.5px;font-weight:700;color:var(--ink-7k);width:76px;flex:none;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-7k .t-7k{flex:1;height:8px;border-radius:5px;background:#eaf1f8;overflow:hidden}
.row-7k .t-7k i{display:block;height:100%;border-radius:5px;background:var(--acc-7k)}
.row-7k s{text-decoration:none;font:700 10.5px/1 ui-monospace,Menlo,monospace;color:var(--ink2-7k);
 width:104px;text-align:right;flex:none;white-space:nowrap}
.chips-7k{display:flex;gap:6px;flex-wrap:wrap}
.chip-7k{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;padding:6px 10px;
 border-radius:999px;background:var(--accbg-7k);color:var(--acc-7k)}
.chip-7k u{text-decoration:none;color:#7ea9d6;margin-left:5px}
.cta-7k{margin-top:auto;border-radius:14px;background:var(--acc-7k);color:#fff;text-align:center;
 padding:11px;font-size:12.5px;font-weight:800;letter-spacing:-.2px;
 box-shadow:0 10px 22px -10px rgba(20,121,224,.9)}

/* ── 검색엔진 흐름 ── */
.flow-7k{display:flex;flex-direction:column;gap:6px}
.st-7k{display:flex;align-items:center;gap:9px;background:#f3f8ff;border-radius:10px;padding:7px 11px}
.st-7k em{font-style:normal;font:800 9px/1 ui-monospace,Menlo,monospace;color:#a8c3dc;flex:none;width:14px}
.st-7k b{font-size:11.5px;font-weight:800;color:var(--ink-7k);flex:none}
.st-7k span{font-size:10.5px;line-height:1.4;color:var(--ink2-7k)}
.split-7k{display:flex;gap:6px}
.br-7k{flex:1;border-radius:10px;padding:7px 10px;background:#f3f8ff;border:1px solid #dfeaf7}
.br-7k b{display:block;font-size:11px;font-weight:800;color:var(--ink-7k)}
.br-7k span{display:block;font-size:10px;line-height:1.4;color:var(--ink2-7k);margin-top:3px}
.core-7k{border-radius:12px;padding:10px 12px;background:linear-gradient(100deg,#1479e0,#0d63bd);color:#fff}
.core-7k b{display:block;font-size:12px;font-weight:800;letter-spacing:-.2px}
.core-7k span{display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.86);margin-top:4px}

/* ── 연결선 + 도트 + 라벨 ── */
.lead-svg-7k{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:visible}
.lead-svg-7k line{stroke:rgba(255,255,255,.72);stroke-width:1.1}
.lead-svg-7k circle{fill:#fff}
.lb-7k{position:absolute;z-index:5;font-size:12px;font-weight:700;line-height:1.5;color:#fff;
 text-shadow:0 1px 6px rgba(4,52,96,.32)}
.lb-7k u{text-decoration:none;display:block;font-weight:500;color:rgba(255,255,255,.85)}
</style></head><body>
<div class="cover-7k">
 <span class="blob-7k b1-7k"></span><span class="blob-7k b2-7k"></span><span class="blob-7k b3-7k"></span>
 <div id="stage-7k">
  <div class="hd-7k">
   <div class="kick-7k">BIBLO · SEARCH SPEED &amp; RESULT</div>
   <h1>타 AI 검색 대비<br><b>검색 속도와 결과 왜 이렇게 좋은가</b></h1>
   <p class="lead-7k">자연어 검색의 품질은 보유한 데이터의 양과 구조에서 나온다.
    무엇을 얼마나 갖고 있고 엔진이 그것을 어떻게 쓰는지를 보면 이유가 보인다.
    <b>"무엇에 관한, 누구를 위한 책인가"</b>를 구조로 갖고 있는 것이 검색 품질의 근거다.</p>
   <div class="meta-7k">
    <span class="mt-7k">실측 2026-07-26</span>
    <span class="mt-7k">전체 도서 148만</span>
   </div>
  </div>
  <svg class="lead-svg-7k" id="ld-7k"></svg>
  <div id="cards-7k"></div>
  <div class="foot-7k">BIBLO · Book Data &amp; Natural Language Search</div>
 </div>
</div>
<script>
/* ══ 근거 ══ biblo-service-design.html #sec-5 (5.1 실측 2026-07-26 · 5.2 라이브 구조) ══ */
const D={
 total:1480000,
 cards:[
  {t:'전체 도서', badge:'BOOKS', v:'148만', u:'권', pct:100, c:'var(--gAll-7k)',
   note:'교보 원문에 웹보강 5소스와 국중도 주제어, 알라딘 작가키를 붙여 모은 서지 원장.'},
  {t:'12축 책지문', badge:'FINGERPRINT', v:'89.5만', u:'권', pct:60.5, c:'var(--gFp-7k)',
   note:'장르·개념·사건·인물·장소·분위기·독자·목적·시놉시스로 구조화한 책 이해. 책당 색인 키워드 24.6개.'},
  {t:'의미 벡터', badge:'VECTOR', v:'76.0만', u:'권', pct:51.4, c:'var(--gVec-7k)',
   note:'voyage-3 · 1,024차원. 질의 임베딩과의 근접도로 묘사형 문장까지 받아낸다.'}],
 fill:[['작가 정보',100,'109.2만'],['분야',98,'106.8만'],['목차',59,'64.7만'],
       ['책소개',36,'39.4만'],['출판사 서평',19,'21.1만'],['원문 발췌',10,'11.0만']],
 dict:[['한자 읽기','75,758'],['교보 추천도서','74,059'],['인물·시대 클러스터','421'],
       ['동의어','498'],['분해 캐시','1,268']],
 flow:[['01','질의','"비 오는 날 읽을 잔잔한 책"'],
       ['02','정제','오타 교정 · 동의어 498 · 비도서 제외'],
       ['03','분해','의도를 축별 조건으로 · 캐시 1,268질의']]
};

/* ── 카드 3장 ── */
const card=(g,x,y,w,h)=>`
 <div class="card-7k" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
  <h3><i style="background:${g.c}"></i>${g.t}<span class="bdg-7k">${g.badge}</span></h3>
  <div class="big-7k">${g.v}<s>${g.u}</s></div>
  <div class="bar-7k"><i style="width:${g.pct}%;background:${g.c}"></i></div>
  <div class="pct-7k"><span>전체 도서의 ${g.pct}%</span><span>148만 중</span></div>
  <div class="sub-7k">${g.note}</div>
 </div>`;

/* ── 우상단 패널 · 검색엔진 설계 도식 ── */
const flow=`
 <div class="panel-7k" style="left:1002px;top:96px;width:390px;height:428px">
  <div class="ph-7k">검색엔진 설계 도식<u>심장은 책지문</u></div>
  <div class="flow-7k">
   ${D.flow.map(([n,t,s])=>`<div class="st-7k"><em>${n}</em><b>${t}</b><span>${s}</span></div>`).join('')}
   <div class="split-7k">
    <div class="br-7k"><b>키워드 — 정확</b><span>제목·저자·지문 팩트 글자 매칭 (주축)</span></div>
    <div class="br-7k"><b>벡터 — 의미</b><span>질의 임베딩 ↔ 지문 벡터 근접 (보조)</span></div>
   </div>
   <div class="core-7k"><b>★ 12축 책지문 89.5만 · 의미 벡터 76.0만</b>
    <span>두 갈래가 모두 여기서 먹는다. 지문이 없으면 이 도식이 성립하지 않는다.</span></div>
   <div class="st-7k"><em>04</em><b>융합</b><span>RRF k=60 · 키워드 주축</span></div>
   <div class="st-7k"><em>05</em><b>리랭크</b><span>다의어 보호 · 언어 일치 정렬</span></div>
  </div>
  <div class="cta-7k">결과 — 제목 0.15초 · 캐시 0.6초 · 신규 문장 1.3~5초</div>
 </div>`;

/* ── 우하단 패널 · 채움률 + 보조 사전 ── */
const fill=`
 <div class="panel-7k" style="left:1002px;top:548px;width:390px;height:316px">
  <div class="ph-7k">지문 항목 채움률<u>실측 2026-07-26</u></div>
  <div class="rows-7k">${D.fill.map(([n,p,v])=>`
    <div class="row-7k"><b>${n}</b><span class="t-7k"><i style="width:${p}%"></i></span>
     <s>${v} · ${p}%</s></div>`).join('')}</div>
  <div class="ph-7k" style="margin-top:2px">보조 사전<u>검색 정제에 쓰인다</u></div>
  <div class="chips-7k">${D.dict.map(([n,v])=>`<span class="chip-7k">${n}<u>${v}</u></span>`).join('')}</div>
 </div>`;

document.getElementById('cards-7k').innerHTML =
  card(D.cards[0],96,392,330,238) + card(D.cards[1],452,330,330,252) + card(D.cards[2],668,614,330,224)
  + flow + fill;

/* ── 연결선 + 라벨 ── */
const LEAD=[
 {x1:617,y1:330, x2:617,y2:288, lx:470,ly:236, t:'심장은 12축 책지문',   s:'키워드도 벡터도 여기서 먹는다'},
 {x1:200,y1:630, x2:200,y2:668, lx:112,ly:680, t:'책당 색인 키워드 24.6개', s:'무엇에 관한 책인지 구조로 갖고 있다'},
 {x1:1002,y1:214,x2:944,y2:214, lx:706,ly:150, t:'질의가 결과가 되기까지', s:'정제 → 분해 → 두 갈래 → 융합'},
 {x1:1002,y1:600,x2:946,y2:600, lx:806,ly:544, t:'무엇이 얼마나 찼나',    s:'작가 100% · 분야 98% · 원문 발췌 10%'}];
const s=document.getElementById('ld-7k');
s.setAttribute('viewBox','0 0 1600 900');
s.innerHTML=LEAD.map(L=>
  `<line x1="${L.x1}" y1="${L.y1}" x2="${L.x2}" y2="${L.y2}"/><circle cx="${L.x2}" cy="${L.y2}" r="3.6"/>`).join('');
document.getElementById('stage-7k').insertAdjacentHTML('beforeend',
  LEAD.map(L=>`<div class="lb-7k" style="left:${L.lx}px;top:${L.ly}px">${L.t}<u>${L.s}</u></div>`).join(''));

/* ── 고정 캔버스 ── */
const SW=1600, SH=900;
function fit(){const st=document.getElementById('stage-7k');
 const k=Math.min(innerWidth/SW, innerHeight/SH);
 st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;}
fit();
addEventListener('resize',fit);
addEventListener('pageshow',fit);
addEventListener('load',fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
</script></body></html>
