<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIBLO 도서 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg0:#1d2450; --bg1:#1d2450; --bg2:#232b5e; --bg3:#2b3574;
 --ink:#eef2ff; --ink2:rgba(238,242,255,.72); --ink3:rgba(238,242,255,.48);
 --glass:rgba(28,36,84,.34); --glass2:rgba(24,31,74,.32);
 --line:rgba(238,242,255,.24); --line2:rgba(238,242,255,.12);
 --dark:#141a3c; --shadow:0 30px 70px rgba(20,14,3,.42);
 --r:26px;
}
html,body{height:100%}
body{
 font-family:'Noto Sans KR','Outfit',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
 color:var(--ink); background:var(--bg0);
 -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* ── 배경: 웜톤 그라디언트 + 나무결 세로 스트라이프 + 도트 ── */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.scene::before{content:'';position:absolute;inset:0;
 background:
  radial-gradient(120% 90% at 78% 8%, rgba(60,80,170,.34) 0%, transparent 55%),
  radial-gradient(100% 80% at 20% 95%, rgba(30,40,100,.5) 0%, transparent 58%),
  var(--bg0);
}
.slat{position:absolute;left:0;top:0;bottom:0;width:22vw;min-width:180px;
 background:repeating-linear-gradient(90deg,
  rgba(10,14,38,.55) 0 9px, rgba(40,52,110,.26) 9px 15px, rgba(10,14,38,.12) 15px 30px);
 mask-image:linear-gradient(90deg,#000 0 58%,transparent 100%);
 -webkit-mask-image:linear-gradient(90deg,#000 0 58%,transparent 100%);opacity:.85}
.floor{position:absolute;left:0;right:0;bottom:0;height:26vh;
 background:linear-gradient(180deg,transparent 0%, rgba(40,54,120,.34) 40%, rgba(52,68,146,.5) 100%)}
.dots{position:absolute;inset:0;
 background-image:radial-gradient(rgba(214,228,255,.42) 1px, transparent 1px);
 background-size:26px 26px;
 mask-image:radial-gradient(70% 55% at 82% 12%,#000 0%,transparent 72%);
 -webkit-mask-image:radial-gradient(70% 55% at 82% 12%,#000 0%,transparent 72%);opacity:.4}

/* ── HUD ── */
.hud{position:fixed;z-index:6;font-family:'Outfit';font-size:10px;letter-spacing:.24em;
 color:rgba(255,248,232,.42);text-transform:uppercase;pointer-events:none}
.hud.tl{top:26px;left:34px}
.hud.br{bottom:24px;right:34px}
.hud b{display:block;width:52px;height:1px;background:rgba(255,248,232,.34);margin-bottom:9px}
.hud.br b{margin-left:auto}

/* ── 레이아웃 ── */
.stage{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;
 gap:26px;padding:56px 42px 56px 34px;max-width:1500px;margin:0 auto}

/* 좌측 세로 알약 네비 */
.rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:22px;
 padding:20px 12px;border-radius:44px;background:var(--glass2);
 border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 box-shadow:var(--shadow)}
.rail button{width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;
 background:transparent;color:var(--ink2);display:grid;place-items:center;
 transition:background .22s, color .22s, transform .22s}
.rail button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
 stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--ink);transform:translateY(-1px)}
.rail button[aria-current="true"]{background:var(--dark);color:#fff}
.rail button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 가운데 글래스 패널 */
.panel{flex:1 1 auto;min-width:0;border-radius:var(--r);padding:30px 34px 0;
 background:var(--glass);border:1px solid var(--line);
 backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1);
 box-shadow:var(--shadow);position:relative;padding-bottom:52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.burger{width:26px;display:grid;gap:5px;cursor:pointer;background:0;border:0;padding:0}
.burger i{display:block;height:1.6px;background:var(--ink);border-radius:2px}
.burger i:last-child{width:64%}
.topnav{display:flex;align-items:center;gap:22px}
.topnav a{font-size:12.5px;color:var(--ink2);text-decoration:none;letter-spacing:.01em}
.topnav a:hover{color:var(--ink)}
.avatar{width:34px;height:34px;border-radius:50%;border:1.6px solid rgba(255,255,255,.75);
 background:linear-gradient(150deg,#d9b25c,#8c6a24);display:grid;place-items:center;
 font-family:'Outfit';font-size:12px;font-weight:600;color:#20180a}

h1{font-size:clamp(27px,3.1vw,42px);font-weight:900;line-height:1.24;letter-spacing:-.02em;
 text-wrap:balance;margin-bottom:12px}
.sub{font-size:13.5px;font-weight:300;line-height:1.72;color:var(--ink2);max-width:56ch}

/* 장르 칩 */
.qh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qh .qi{font-size:.72em;opacity:.75}
.qc{display:inline-block;width:3px;height:.86em;background:#8fb6ff;border-radius:2px;
 animation:blink 1s steps(1) infinite;vertical-align:-.06em}
@keyframes blink{50%{opacity:0}}
.qb{display:inline-block;margin-right:10px;padding:5px 11px;border-radius:999px;
 background:rgba(120,160,255,.18);border:1px solid rgba(140,175,255,.34);
 font:700 11.5px/1 ui-monospace,Menlo,monospace;color:#bcd2ff;vertical-align:1px}
.chips{display:flex;gap:8px;margin:20px 0 16px;overflow-x:auto;padding-bottom:3px;
 scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 15px;border-radius:999px;cursor:pointer;
 font-family:inherit;font-size:12.5px;font-weight:500;
 background:transparent;color:var(--ink2);border:1px solid var(--line);
 transition:.2s}
.chips button:hover{color:var(--ink);border-color:var(--ink3)}
.chips button[aria-selected="true"]{background:var(--dark);color:#fff;border-color:transparent}

/* 카드 가로 리스트 */
.deck{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;
 scrollbar-width:none;-webkit-overflow-scrolling:touch;
 /* 카드가 뜨는 만큼(-5px)과 선택 테두리(4px)가 잘리지 않도록 여유를 두고 음수 여백으로 위치 보정 */
 padding:12px 12px 16px;margin:-12px -12px -16px}
.deck::-webkit-scrollbar{display:none}
.card{flex:0 0 168px;height:224px;border-radius:16px;overflow:hidden;position:relative;
 cursor:pointer;border:0;padding:0;background:#2a2210;text-align:left;
 box-shadow:0 12px 26px rgba(18,12,2,.34);transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 36px rgba(18,12,2,.46)}
.card[aria-current="true"]{outline:2px solid rgba(255,246,225,.9);outline-offset:2px}
.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card .bg{position:absolute;inset:-14%;width:128%;height:128%;object-fit:cover;
 filter:blur(16px) saturate(1.25) brightness(.62);transform:scale(1.05)}
.card .fg{position:absolute;left:50%;top:11px;transform:translateX(-50%);
 height:128px;width:auto;max-width:82%;object-fit:contain;border-radius:3px;
 box-shadow:0 8px 18px rgba(0,0,0,.5)}
.card .shade{position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 42%,rgba(12,8,2,.62) 66%,rgba(12,8,2,.93) 100%)}
.card .meta{position:absolute;left:12px;right:12px;bottom:11px}
.card .tt{font-size:12.5px;font-weight:500;line-height:1.36;color:#fff;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .au{display:flex;align-items:center;gap:5px;margin-top:5px;
 font-size:10.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .au svg{width:10px;height:10px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8}
.card .like{position:absolute;top:9px;right:9px;width:25px;height:25px;border-radius:50%;
 background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center;
 border:1px solid rgba(255,255,255,.34)}
.card .like svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:1.7}

/* 진행 표시 */
.prog{display:flex;align-items:center;gap:14px;margin-top:20px;
 font-family:'Outfit';font-size:12px;color:var(--ink2);letter-spacing:.06em}
.prog .bar{flex:0 0 128px;height:1.6px;background:var(--line2);border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;
 transition:width .34s cubic-bezier(.2,.7,.3,1)}
.prog .tot{color:var(--ink3)}

/* 하단 액션 알약 바 */
.acts{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);
 display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:999px;
 background:var(--glass2);border:1px solid var(--line);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 16px 34px rgba(18,12,2,.34);white-space:nowrap}
.acts a,.acts button{font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
 border:1px solid transparent;text-decoration:none;transition:.2s}
.pill-d{background:var(--dark);color:#fff;padding:10px 21px;border-radius:999px}
.pill-d:hover{background:#000}
.pill-g{background:rgba(255,255,255,.14);color:var(--ink);padding:10px 19px;border-radius:999px;
 border-color:var(--line)}
.pill-g:hover{background:rgba(255,255,255,.24)}
.ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.13);
 border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ico:hover{background:rgba(255,255,255,.24)}
.ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;
 stroke-linecap:round;stroke-linejoin:round}

/* 우측 세로 커버 패널 */
.cover{flex:0 0 clamp(252px,25vw,340px);align-self:center;height:min(78vh,600px);
 border-radius:var(--r);position:relative;overflow:hidden;display:flex;flex-direction:column;
 box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.22);background:#1b1509}
.cover .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;
 filter:blur(30px) saturate(1.35) brightness(.5)}
.cover .veil{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(255,252,244,.08) 0%,rgba(10,7,1,.28) 38%,rgba(8,5,1,.86) 100%)}
.cover>.art,.cover>.pin,.cover>.cinfo{position:relative;z-index:1}
.cover>.art{flex:1 1 0;min-height:0;overflow:hidden;display:flex;
 align-items:center;justify-content:center;padding:24px 24px 6px}
.cover>.art img{flex:0 1 auto;min-height:0;width:auto;height:auto;
 max-width:84%;max-height:100%;object-fit:contain;
 border-radius:4px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.6))}
/* 핀 + 말풍선 */
.pin{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.pin .dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.94);
 box-shadow:0 0 0 5px rgba(255,255,255,.2)}
.pin .stem{width:1.4px;height:24px;background:rgba(255,255,255,.6)}
.tip{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;
 background:rgba(236,230,214,.26);border:1px solid rgba(255,255,255,.42);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:100%;
 box-shadow:0 12px 26px rgba(6,4,0,.42)}
.tip .st{width:30px;height:30px;flex:0 0 auto;border-radius:50%;
 background:rgba(255,255,255,.3);display:grid;place-items:center;
 border:1px solid rgba(255,255,255,.5)}
.tip .st svg{width:14px;height:14px;stroke:#fff;fill:rgba(255,255,255,.5);stroke-width:1.4}
.tip .tx{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.tip .nm{font-size:12.5px;font-weight:700;color:#fff;line-height:1.32;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tip .mo{font-size:10px;color:rgba(255,255,255,.82);text-decoration:underline;
 text-underline-offset:2px;margin-top:1px}
/* 하단 상세 */
.cinfo{padding:16px 18px 17px}
.cinfo .g{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.cinfo .g span{font-size:10px;padding:3px 9px;border-radius:999px;
 background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);color:#fff}
.cinfo .sy{font-size:11px;line-height:1.66;color:rgba(255,255,255,.8);
 display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cinfo .by{font-size:10.5px;color:rgba(255,255,255,.6);margin-top:8px;font-family:'Outfit'}

/* 근거 */
.note{position:relative;z-index:2;max-width:1500px;margin:44px auto 30px;padding:13px 17px;
 border-radius:13px;font-size:11.5px;line-height:1.8;color:rgba(255,248,232,.62);
 background:rgba(255,238,180,.07);border:1px solid rgba(255,238,180,.2)}
.note b{color:rgba(255,250,236,.9);font-weight:500}

@media (max-width:1080px){
 .hud{display:none}
 .acts{gap:7px;padding:8px 10px}
 .acts .pill-d,.acts .pill-g{padding:9px 17px;font-size:12px}
 .ico{width:34px;height:34px}
 .stage{flex-direction:column;align-items:stretch;padding:26px 18px 26px;gap:20px}
 .rail{flex-direction:row;justify-content:center;border-radius:999px;padding:9px 14px;gap:10px}
 .panel{padding:22px 20px 46px;border-radius:22px}
 .acts{position:static;transform:none;margin:22px auto 0;width:fit-content;flex-wrap:wrap;
  justify-content:center}
 .panel{padding-bottom:22px}
 .cover{flex:0 0 auto;height:min(74vh,520px);max-height:none}
 .slat{width:38vw}
 .note{margin:8px 18px 26px;max-width:none}
}
@media (max-width:520px){
 .card{flex:0 0 142px;height:196px}
 .card .fg{height:106px}
 h1{font-size:25px}
 .topnav a{display:none}
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="scene"><div class="slat"></div><div class="floor"></div><div class="dots"></div></div>

<div class="hud tl"><b></b>BIBLO · Library Intelligence</div>
<div class="hud br"><b></b><span id="hudGenre">Fiction</span> · <span id="hudCount">12</span> titles</div>

<div class="stage">

 <nav class="rail" aria-label="주요 메뉴">
  <button aria-current="true" title="홈"><svg viewBox="0 0 24 24"><path d="M3 10.4 12 3l9 7.4"/><path d="M5.6 9.6V20h12.8V9.6"/></svg></button>
  <button title="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.4 4.4"/></svg></button>
  <button title="추천"><svg viewBox="0 0 24 24"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg></button>
  <button title="담아둔 책"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg></button>
  <button title="도움말"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3 2.4v1.4"/><path d="M12.6 16.6h-.02"/></svg></button>
 </nav>

 <main class="panel">
  <div class="top">
   <button class="burger" aria-label="메뉴"><i></i><i></i><i></i></button>
   <div class="topnav">
    <a href="#">추천</a><a href="#">신간</a><a href="#">서재</a>
    <div class="avatar">B</div>
   </div>
  </div>

  <h1 class="qh"><span class="qi">🔍</span><span id="qt"></span><i class="qc"></i></h1>
  <p class="sub"><span class="qb" id="qb"></span><span id="qn"></span></p>

  <div class="chips" id="chips" role="tablist" aria-label="장르"></div>
  <div class="deck" id="deck"></div>

  <div class="prog">
   <span id="cur">01</span>
   <span class="bar"><i id="fill" style="width:8%"></i></span>
   <span class="tot" id="tot">12</span>
  </div>

  <div class="acts">
   <a href="#" class="pill-d" id="goRead">이 책 읽기</a>
   <a href="#" class="pill-g">서재에 담기</a>
   <button class="ico" title="북마크"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z"/></svg></button>
   <button class="ico" title="공유"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.4 10.8 7.2-4.2M8.4 13.2l7.2 4.2"/></svg></button>
  </div>
 </main>

 <aside class="cover" id="cover" aria-live="polite">
  <img class="bg" id="cbg" alt="" aria-hidden="true">
  <div class="veil"></div>
  <div class="art"><img id="cart" alt=""></div>
  <div class="pin">
   <span class="dot"></span><span class="stem"></span>
   <div class="tip">
    <span class="st"><svg viewBox="0 0 24 24"><path d="m12 3.6 2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg></span>
    <span class="tx"><span class="nm" id="cname"></span><a class="mo" href="#" id="cmore">자세히</a></span>
   </div>
  </div>
  <div class="cinfo">
   <div class="g" id="cgen"></div>
   <p class="sy" id="csyn"></p>
   <p class="by" id="cby"></p>
  </div>
 </aside>
</div>

<p class="note">
 <b>데이터 근거</b> · 도서 정보는 BIBLO 도서 데이터베이스(158만 3천 권, 표지 보유 121만 9천 권)에서 가져왔습니다.
 장르·줄거리·독자층은 도서 지문 데이터 89만 4천 건에 기록된 값입니다.
 이 화면은 2023년 이후 발행되고 표지가 확인된 책만 장르별 12권씩 배치했습니다.

function typeQ(){
 tm.forEach(clearTimeout); tm=[];
 const v=VERD[genres[gi]]||{q:'',b:'',n:''};
 const el=$('#qt'); el.textContent='';
 $('#qb').textContent=''; $('#qn').innerHTML='';
 let i=0;
 const step=()=>{ el.textContent=v.q.slice(0,++i);
  if(i<v.q.length) tm.push(setTimeout(step,30+Math.random()*30));
  else tm.push(setTimeout(()=>{$('#qb').textContent=v.b; $('#qn').innerHTML=v.n;},240)); };
 step();
}
$('#chips').addEventListener('click', e=>{
 const t = e.target.closest('button[data-g]'); if(!t) return;
 gi = +t.dataset.g; bi = 0; chips(); deck(); show(); typeQ();
 $('#deck').scrollTo({left:0, behavior:'smooth'});
});
$('#deck').addEventListener('click', e=>{
 const t = e.target.closest('button[data-b]'); if(!t) return;
 bi = +t.dataset.b; show();
 t.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
});
addEventListener('keydown', e=>{
 const n = DATA[genres[gi]].length;
 if(e.key==='ArrowRight'){ bi=(bi+1)%n; show();
  document.querySelectorAll('.card')[bi].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
 if(e.key==='ArrowLeft'){ bi=(bi-1+n)%n; show();
  document.querySelectorAll('.card')[bi].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
});
chips(); deck(); show(); typeQ();
</script>
</body></html>
