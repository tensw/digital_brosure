<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국제 색인 vs 국내 KCI — BIBLO</title>
<style>
/* 클래스·ID·변수 전부 -8p4q6 접미사 · 전역 선택자 없음 (다른 HTML 과 섞여도 안전) */
.root-8p4q6{--ink-8p4q6:#e9eefb;--ink2-8p4q6:#93a6cc;--ink3-8p4q6:#5d7099;
 font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 color:var(--ink-8p4q6);
 background:radial-gradient(1200px 900px at 50% 8%,#0b1226 0%,#060a16 58%,#03050c 100%);
 -webkit-font-smoothing:antialiased;position:relative}
.root-8p4q6 *{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* ── 무대 규격 (작업가이드 5장) ── */
html,body{overflow:hidden}
.slide{position:relative;width:100vw;height:100vh;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%}
.emb-bg0, .emb-bg0 body, .emb-bg0 .slide{background:transparent !important}
.root-8p4q6::after{content:"";position:absolute;right:-6%;bottom:-14%;width:44%;height:46%;
 pointer-events:none;border-radius:50%;
 background:radial-gradient(circle at 50% 50%,rgba(226,214,255,.28) 0%,rgba(150,120,235,.13) 34%,
   rgba(60,50,160,0) 68%);filter:blur(6px)}
/* 작업가이드 5장: 1600x900, 좌우 82px. 원본은 세로 919px 문서라 거의 그대로 들어간다.
   두 비교 카드가 남는 높이를 나눠 갖는다. */
.wrap-8p4q6{position:relative;z-index:2;width:1600px;height:900px;padding:38px 82px 16px;
 display:flex;flex-direction:column}
.pair-8p4q6{flex:1;min-height:0}
.foot-8p4q6{margin-top:auto}

.hd-8p4q6{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.spacer-8p4q6{flex:1}
.kicker-8p4q6{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.28em;
 color:var(--ink3-8p4q6)}
/* 폰트 규격 — 한글 제목 3.15em(44px), 서브 16px/600 */
.h1-8p4q6{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin-top:10px;line-height:1.16}
.h1-8p4q6 span{background:linear-gradient(90deg,#38bdf8,#a78bfa 45%,#f472b6 72%,#fbbf24);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead-8p4q6{color:var(--ink2-8p4q6);font-size:16px;font-weight:600;margin-top:10px;max-width:104ch;line-height:1.5}
.lead-8p4q6 b{color:var(--ink-8p4q6)}
.meta-8p4q6{font:600 11px/1.95 ui-monospace,Menlo,monospace;color:var(--ink3-8p4q6);
 text-align:right;letter-spacing:.05em}
.meta-8p4q6 b{color:var(--ink2-8p4q6)}

.pair-8p4q6{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:32px}
.pane-8p4q6{position:relative;border-radius:26px;overflow:hidden;padding:44px 40px 40px;
 min-height:540px;display:flex;flex-direction:column}
/* 좌 — 밝은 카드 */
.lite-8p4q6{background:#f7f6fb;color:#141433}
.lite-8p4q6::before{content:"";position:absolute;inset:-20% -10% -34% -24%;pointer-events:none;
 background:
  radial-gradient(58% 44% at 22% 84%, rgba(226,150,255,.72) 0%, rgba(226,150,255,0) 62%),
  radial-gradient(62% 46% at 62% 66%, rgba(120,86,255,.78) 0%, rgba(120,86,255,0) 64%),
  radial-gradient(70% 40% at 86% 46%, rgba(60,40,235,.62) 0%, rgba(60,40,235,0) 66%);
 filter:blur(10px)}
/* 우 — 어두운 카드 */
.dark-8p4q6{background:linear-gradient(168deg,#1a2168 0%,#141a54 46%,#101542 100%);
 color:#eef1ff;border:1px solid rgba(150,160,240,.22)}
.dark-8p4q6::before{content:"";position:absolute;inset:0;pointer-events:none;
 background:
  radial-gradient(48% 30% at 74% 30%, rgba(150,175,255,.30) 0%, rgba(150,175,255,0) 70%),
  radial-gradient(40% 26% at 86% 88%, rgba(215,150,255,.26) 0%, rgba(215,150,255,0) 72%)}
.dark-8p4q6 .stars-8p4q6{position:absolute;inset:0;pointer-events:none;opacity:.7}

.pk-8p4q6{position:relative;z-index:3;display:flex;align-items:center;gap:8px;
 font:700 11.5px/1 inherit;letter-spacing:.02em}
.lite-8p4q6 .pk-8p4q6{color:#5b4bd6}
.dark-8p4q6 .pk-8p4q6{color:#b3a6ff}
.pt-8p4q6{position:relative;z-index:3;margin-top:20px;font-size:30px;font-weight:800;
 letter-spacing:-1.1px;line-height:1.18}
.pd-8p4q6{position:relative;z-index:3;margin-top:18px;max-width:44ch;font-size:13px;line-height:1.8}
.lite-8p4q6 .pd-8p4q6{color:#3b3b63}
.dark-8p4q6 .pd-8p4q6{color:#b9c0e8}
.pd-8p4q6 b{font-weight:800}
.lite-8p4q6 .pd-8p4q6 b{color:#1a1a3c}
.dark-8p4q6 .pd-8p4q6 b{color:#fff}

.pins-8p4q6{position:relative;z-index:3;flex:1;margin-top:26px}
.pin-8p4q6{position:absolute;display:flex;flex-direction:column;align-items:center}
.pin-8p4q6 .dot-8p4q6{width:var(--d-8p4q6,26px);height:var(--d-8p4q6,26px);border-radius:50%;flex:none}
.pin-8p4q6 .stem-8p4q6{width:1px;flex:1}
.pin-8p4q6 .tip-8p4q6{width:9px;height:9px;border-radius:50%;border:1px solid;flex:none}
.pin-8p4q6 .val-8p4q6{position:absolute;white-space:nowrap;text-align:center;
 font:800 13px/1.25 inherit;letter-spacing:-.3px}
.pin-8p4q6 .cap-8p4q6{display:block;font:700 9.5px/1.5 ui-monospace,Menlo,monospace;
 letter-spacing:.12em;font-weight:700}
.lite-8p4q6 .stem-8p4q6{background:rgba(30,20,90,.32)}
.lite-8p4q6 .tip-8p4q6{border-color:rgba(30,20,90,.4);background:#fff}
.lite-8p4q6 .val-8p4q6{color:#191938} .lite-8p4q6 .cap-8p4q6{color:#6a6a97}
.dark-8p4q6 .stem-8p4q6{background:rgba(210,220,255,.42)}
.dark-8p4q6 .tip-8p4q6{border-color:rgba(210,220,255,.6);background:transparent}
.dark-8p4q6 .val-8p4q6{color:#eef1ff} .dark-8p4q6 .cap-8p4q6{color:#9aa3d4}

.foot-8p4q6{margin-top:26px;font:600 10.5px/1.85 ui-monospace,Menlo,monospace;
 color:var(--ink3-8p4q6);letter-spacing:.03em}
.foot-8p4q6 b{color:var(--ink2-8p4q6)}

</style></head><body style="margin:0">
<div class="slide"><div id="stage">

<div class="root-8p4q6"><div class="wrap-8p4q6">

 <div class="hd-8p4q6">
  <div>
   <div class="kicker-8p4q6">BIBLO · INDEX COVERAGE</div>
   <h1 class="h1-8p4q6">같은 대학이 낸 논문인데<br><span>색인에 따라 측정이 갈린다</span></h1>
   <p class="lead-8p4q6">국제 색인에 잡힌 논문은 <b>FWCI·백분위·피인용</b>이 모두 붙는다.
    KCI 에만 있는 논문은 <b>FWCI 가 한 편도 측정되지 않는다.</b>
    BK21 지표를 FWCI 중심으로 설계하면 이 <b>19,191편</b>은 구조적으로 0 으로 잡힌다.
    아래 두 카드는 같은 대학의 논문을 색인 기준으로만 갈라 나란히 놓은 것이다.</p>
  </div>
  <div class="spacer-8p4q6"></div>
  <div class="meta-8p4q6">
   실측 <b>2026-08-27</b><br>
   국제 <b>121,475</b>편 ↔ 국내 <b>19,191</b>편<br>
   FWCI 측정 <b>84.8%</b> ↔ <b>0.0%</b>
  </div>
 </div>

 <div class="pair-8p4q6" id="pair-8p4q6"></div>
 <div class="foot-8p4q6" id="foot-8p4q6"></div>

</div></div>
<script>
(function(){
const PAIR=document.getElementById('pair-8p4q6');
const FT=document.getElementById('foot-8p4q6');

/* ══ 실측 (biblo_dev · 2026-08-27) ══ */
const SIDES=[
 {cls:'lite-8p4q6', kick:'측정 가능 · MEASURED', ico:'bolt',
  t:'국제 색인 논문', s:'WoS · Scopus',
  d:'국제 색인에 잡힌 논문은 <b>FWCI·백분위·피인용</b>이 모두 붙는다. BK21이 요구하는 지표를 그대로 산출할 수 있다.',
  pins:[{v:'121,475편',c:'전체 논문',x:14,h:.46,d:22,col:'#c78dff'},
        {v:'84.8%',   c:'FWCI 측정', x:44,h:.66,d:26,col:'#7a5cf5'},
        {v:'27,046편',c:'상위 10%',  x:74,h:.86,d:30,col:'#2f2cff'}],
  labelTop:true},
 {cls:'dark-8p4q6', kick:'측정 공백 · GAP', ico:'arc',
  t:'국내 KCI 논문', s:'KCI 단독 색인',
  d:'KCI에만 있는 논문은 <b>FWCI가 0편</b>, 백분위도 3.9%뿐이다. 국제 지표 체계로는 이 성과를 잴 수 없다.',
  pins:[{v:'19,191편',c:'전체 논문',x:14,h:.40,d:22,col:'transparent'},
        {v:'0.0%',    c:'FWCI 측정', x:46,h:.62,d:26,col:'#3f6bff'},
        {v:'4편',     c:'상위 10%',  x:78,h:.80,d:26,col:'transparent'}],
  labelTop:false}
];
const ICO={
 bolt:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
 arc :'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3.5 18a8.5 8.5 0 0117 0"/><path d="M7.5 18a4.5 4.5 0 019 0"/></svg>'};

PAIR.innerHTML=SIDES.map(S=>`
 <section class="pane-8p4q6 ${S.cls}">
  ${S.cls.startsWith('dark')?'<canvas class="stars-8p4q6"></canvas>':''}
  <div class="pk-8p4q6">${ICO[S.ico]}<span>${S.kick}</span></div>
  <div class="pt-8p4q6">${S.t}</div>
  <p class="pd-8p4q6">${S.d}</p>
  <div class="pins-8p4q6">
   ${S.pins.map(p=>`
    <div class="pin-8p4q6" style="left:${p.x}%;top:${Math.round((1-p.h)*100)}%;
         bottom:${S.labelTop?0:46}px;--d-8p4q6:${p.d}px">
      <span class="val-8p4q6" style="${S.labelTop?'bottom:calc(100% + 9px)':'top:calc(100% + 9px)'}">
        ${p.v}<span class="cap-8p4q6">${p.c}</span></span>
      <span class="dot-8p4q6" style="background:${p.col};${p.col==='transparent'
        ?'border:1.4px solid rgba(215,224,255,.75)':'box-shadow:0 6px 18px -6px '+p.col}"></span>
      <span class="stem-8p4q6"></span>
      <span class="tip-8p4q6"></span>
    </div>`).join('')}
  </div>
 </section>`).join('');

/* 우측 카드 별 */
PAIR.querySelectorAll('.stars-8p4q6').forEach(c=>{
 /* getBoundingClientRect 는 무대 배율이 곱해진 값이다. 레이아웃 픽셀을 쓴다. */
 const pe=c.parentElement, r={width:pe.offsetWidth,height:pe.offsetHeight};
 const w=c.width=Math.ceil(r.width), h=c.height=Math.ceil(r.height);
 c.style.width='100%';c.style.height='100%';
 const x=c.getContext('2d');let sd=8407;
 const rnd=()=>((sd=sd*1103515245+12345&0x7fffffff)/0x7fffffff);
 for(let i=0;i<220;i++){const rr=rnd()*1.15+.25;
  x.globalAlpha=.15+rnd()*.6;x.fillStyle='#dfe6ff';
  x.beginPath();x.arc(rnd()*w,rnd()*h,rr,0,7);x.fill();}
});
FT.innerHTML=`실측 <b>2026-08-27</b> · 로컬 복원 신 RIMS <b>biblo_dev</b> · 논문 삭제분 제외 ·
 국제 = WoS UT 또는 Scopus EID 보유 <b>121,475편</b> · 국내 = 그중 어느 것도 없이 KCI ID 만 보유 <b>19,191편</b> ·
 FWCI·백분위는 Web of Science / Scopus 원지표이며 KCI 단독 논문에는 산출 근거가 없다`;
})();
</script>
</div></div>

<script>
/* 1600x900 고정 무대 — 작업가이드 5장 규격.
   resize 하나만 걸면 iframe 슬라이드에서 배율이 틀어진 채 굳는다. 다섯 개를 다 건다. */
function fitStage(){
  const st=document.getElementById('stage'); if(!st) return;
  st.style.height='900px';
  const k=Math.min(innerWidth/1600, innerHeight/900);
  st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;
}
fitStage();
addEventListener('resize',fitStage);
addEventListener('load',fitStage);
addEventListener('pageshow',fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStage);
</script>
<script>if(window.self!==window.top) document.documentElement.classList.add('emb-bg0');</script>
</body></html>
