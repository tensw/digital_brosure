<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIBLO — 검색</title>
<style>
.wrap-7q2v8{--ink:#eef3ff;--ink2:#9aabd2;--ink3:#63769c;
 --m:#ff3fd0;--bl:#2b6bff;--cy:#38d6f8;
 position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
 color:var(--ink);-webkit-font-smoothing:antialiased;
 background:radial-gradient(1200px 760px at 50% 50%,#0a0713 0%,#06040d 55%,#020105 100%)}
.wrap-7q2v8 *{box-sizing:border-box;margin:0;padding:0}

/* ── 워드마크 ── */
.mark-7q2v8{position:absolute;left:50%;top:12vh;transform:translateX(-50%);z-index:4;
 display:flex;align-items:center;gap:11px;opacity:.9}
.mark-7q2v8 b{font:700 12.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.34em;color:#cfd9f5}
.mark-7q2v8 s{text-decoration:none;font:600 10.5px/1 ui-monospace,Menlo,monospace;
 letter-spacing:.15em;color:var(--ink3)}

/* ── 알약 검색바 ── */
@keyframes bl-7q2v8{0%,50%{opacity:1}51%,100%{opacity:.15}}

/* ── 예시 질의 ── */
.cap-7q2v8{position:absolute;left:50%;bottom:4vh;z-index:4;width:1600px;padding:0 82px;
 transform-origin:50% 100%;transform:translateX(-50%)}
.grid-7q2v8{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
/* 3장 LAYER 1·2 규격 승계 */
.bx-7q2v8{position:relative;border:1px solid rgba(96,165,250,.18);border-radius:18px;padding:18px 20px;
 background:linear-gradient(180deg,rgba(22,30,58,.62),rgba(10,15,32,.62));backdrop-filter:blur(6px);
 text-align:left;display:flex;flex-direction:column}
.bx-7q2v8 .n-7q2v8{font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#7c88b8;
 margin-bottom:9px}
.bx-7q2v8 h3{font-size:15px;font-weight:800;letter-spacing:-.4px;color:#6fc8ff;line-height:1.35}
.bx-7q2v8 .s-x{margin-top:5px;font:700 10.5px/1 ui-monospace,Menlo,monospace;color:#7c88b8;letter-spacing:.06em}
.bx-7q2v8 ul{margin-top:9px;list-style:none;display:flex;flex-direction:column;gap:5px}
.bx-7q2v8 li{position:relative;padding-left:14px;font-size:14.5px;font-weight:500;line-height:1.5;
 letter-spacing:-.3px;color:rgba(255,255,255,.9);word-break:keep-all}
.bx-7q2v8 li:before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;
 background:rgba(140,200,255,.62)}
.bx-7q2v8 .m-x{margin-top:auto;padding-top:12px;font:700 12px/1.5 ui-monospace,Menlo,monospace;color:#9fd4ff}
.ttl-7q2v8{position:absolute;left:0;right:0;top:15.5%;z-index:4;text-align:center;
 /* 4장(biblo-search) 제목 규격 승계 — 56px/800/ls .5px/lh 1.2.
    다만 이 제목은 4장보다 20% 작게 둔다(56 x 0.8 = 44.8px). */
 font-size:44.8px;font-weight:800;letter-spacing:.5px;color:#fff;line-height:1.2}
.lead-7q2v8{position:absolute;left:0;right:0;top:25.5%;z-index:4;text-align:center;
 font-size:19px;font-weight:600;letter-spacing:-.4px;color:#c4d3ee;line-height:1.6}
.lead-7q2v8 b{color:#fff;font-weight:800}
.lead-7q2v8 em{display:block;margin-top:6px;font-style:normal;font-size:15px;color:#7f92b8}
.sug-7q2v8{position:absolute;left:50%;transform:translateX(-50%);z-index:4;
 display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,980px);padding:0 8px}
.s-7q2v8{border-radius:999px;padding:8px 14px;white-space:nowrap;cursor:pointer;
 font-weight:600;font-size:clamp(11px,1.05vw,13.5px);color:#b9c6e8;
 background:rgba(255,255,255,.045);border:1px solid rgba(160,180,255,.18);
 transition:background .18s,border-color .18s,color .18s}
.s-7q2v8:hover{background:rgba(120,150,255,.14);border-color:rgba(170,190,255,.42);color:#eaf0ff}
.s-7q2v8 u{text-decoration:none;color:var(--ink3);margin-left:7px;font-weight:600}
@media(max-width:460px){.s-7q2v8 u{display:none}}
/* 좁은 화면 — 칩을 접지 말고 한 줄 가로 스크롤로 */
@media(max-width:620px){
 .sug-7q2v8{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:0 14px;left:0;right:0;transform:none;width:100%;max-width:100%!important}
 .sug-7q2v8::-webkit-scrollbar{display:none}
 .s-7q2v8{flex:none}
}

/* ── 하단 캡션 ── */
/* 아주 좁은 화면 — 마이크를 빼서 문구 자리를 확보 */
@media(max-width:430px){
}
@media (prefers-reduced-motion: reduce){
}

/* ══ 검색박스 — biblo-search-2.html 에서 그대로 가져왔다 ══════════════
   테두리·글로우가 원뿔 그라데이션을 각도(--ang)로 돌리는 구조라
   @property 선언과 색 변수 네 개가 함께 와야 한다. */
@property --ang-3w8n1{syntax:'<angle>';initial-value:0deg;inherits:false}
.wrap-7q2v8{--c1:#ff4d3d;--c2:#2b6bff;--c3:#12b76a;--c4:#ffb400}
.box-3w8n1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.glow-3w8n1{position:absolute;inset:-6%;border-radius:999px;z-index:-1;
 background:conic-gradient(from var(--ang-3w8n1),
  var(--c1) 0deg,var(--c2) 92deg,var(--c3) 184deg,var(--c4) 272deg,var(--c1) 360deg);
 filter:blur(46px);opacity:.62;animation:sp-3w8n1 14s linear infinite}
.glow2-3w8n1{position:absolute;inset:1%;border-radius:999px;z-index:-1;
 background:conic-gradient(from var(--ang-3w8n1),
  var(--c1) 0deg,var(--c2) 92deg,var(--c3) 184deg,var(--c4) 272deg,var(--c1) 360deg);
 filter:blur(14px);opacity:.85;animation:sp-3w8n1 14s linear infinite}
.pill-3w8n1{position:relative;display:flex;align-items:center;
 gap:clamp(12px,1.4vw,22px);border-radius:999px;background:#000;
 padding:0 clamp(14px,1.5vw,24px) 0 clamp(22px,2.4vw,38px)}
.pill-3w8n1::before{content:"";position:absolute;inset:0;border-radius:999px;padding:2px;
 background:conic-gradient(from var(--ang-3w8n1),
  var(--c1) 0deg,var(--c2) 92deg,var(--c3) 184deg,var(--c4) 272deg,var(--c1) 360deg);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
 animation:sp-3w8n1 14s linear infinite}
.ph-3w8n1{flex:1;min-width:0;font-weight:400;letter-spacing:-.4px;color:#c8cdd8;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.ic-3w8n1{flex:none;color:#f0f2f7;opacity:.92;cursor:pointer;transition:opacity .18s,transform .18s}
.ic-3w8n1:hover{opacity:1;transform:scale(1.08)}
@keyframes sp-3w8n1{to{--ang-3w8n1:360deg}}
@media (prefers-reduced-motion: reduce){
 .glow-3w8n1,.glow2-3w8n1,.pill-3w8n1::before{animation:none}
}
</style></head><body style="margin:0;background:#020105">
<div class="wrap-7q2v8" id="wrap-7q2v8">

 <div class="mark-7q2v8">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="#9fc7ff">
   <circle cx="4" cy="12" r="1.6"/><circle cx="9.5" cy="7" r="1.8"/><circle cx="9.5" cy="17" r="1.8"/>
   <circle cx="15" cy="12" r="2.1"/><circle cx="20" cy="8" r="1.5"/><circle cx="20" cy="16" r="1.5"/></svg>
  <b>BIBLO SOLUTION</b><s>· AI검색엔진</s>
 </div>

 <h1 class="ttl-7q2v8">도서관이 가져가야 할 논문 검색</h1>

 <div class="lead-7q2v8">값비싼 구독 없이, <b>실재하는 논문</b>만 찾아준다.
  <em>KCI 254만 + OpenAlex 1억 770만을 우리 색인으로 갖고 0.2~0.9초에.</em></div>

 <!-- 검색박스는 biblo_rims_front/docs/biblo-search-2.html 것을 그대로 가져왔다.
      클래스·id 접미사(-3w8n1)도 원본 그대로. 이 파일의 -7q2v8 과 겹치지 않는다. -->
 <div class="box-3w8n1" id="box-3w8n1">
  <span class="glow-3w8n1"></span><span class="glow2-3w8n1"></span>
  <div class="pill-3w8n1" id="pill-3w8n1">
   <span class="ph-3w8n1" id="ph-3w8n1">무엇이든 물어보세요…</span>
   <svg class="ic-3w8n1 mic-3w8n1" id="mic-3w8n1" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9.3" y="3" width="5.4" height="10.6" rx="2.7"/>
    <path d="M5.6 11.6a6.4 6.4 0 0 0 12.8 0M12 18v3"/></svg>
   <svg class="ic-3w8n1" id="doc-3w8n1" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.6 7.4h3l1.3-2h6.2l1.3 2h3a1.6 1.6 0 0 1 1.6 1.6v8.4a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 17.4V9a1.6 1.6 0 0 1 1.6-1.6z"/>
    <circle cx="12" cy="13.1" r="3.3"/></svg>
  </div>
 </div>

 <div class="sug-7q2v8" id="sug-7q2v8"></div>
 <div class="cap-7q2v8" id="cap-7q2v8">
  <div class="grid-7q2v8" id="grid-7q2v8"></div>
 </div>

</div>
<script>
(function(){
const T='7q2v8', $=id=>document.getElementById(id+'-'+T);
const wrap=$('wrap'), sug=$('sug'), cap=$('cap');
/* 알약은 biblo-search-2 것으로 바뀌었다(접미사 -3w8n1).
   원래 있던 plus·go·wave 는 그 박스에 없으므로 참조하지 않는다. */
const pill=document.getElementById('pill-3w8n1'), ph=document.getElementById('ph-3w8n1');
const ICONS=[document.getElementById('mic-3w8n1'), document.getElementById('doc-3w8n1')];

/* ── 예시 질의 · BIBLO 가 실제로 답하는 것들 ── */
const Q=[
 ['학술어 변환',  '일상어를 연구자 말로'],
 ['정확검색',     '내부 색인·엄격'],
 ['의미 검색',    '뜻으로 닿는'],
 ['근거 그래프',  '주장과 근거']
];
const HINT=[
 '무엇이든 물어보세요…',
 '저자 식별을 다룬 국내 논문 찾아줘',
 '삼중음성유방암 최신 연구 동향',
 '이 주제와 뜻이 가까운 논문도 같이',
 '구독 없이 볼 수 있는 오픈액세스만'
];
const HINT_S=['무엇이든 물어보세요…','저자 식별 논문','삼중음성유방암 동향',
 '뜻이 가까운 논문','오픈액세스만'];
const hints=()=>(innerWidth<760?HINT_S:HINT);
sug.innerHTML=Q.map(([a,b])=>`<div class="s-${T}">${a}<u>${b}</u></div>`).join('');


/* ── 하단 01~05 박스 ── */
const BOX=[
 {n:'01',t:'구독 없이<br>찾아준다',s:'무료·오픈액세스',
  li:['Scopus·WoS 구독이 없어도 된다','KCI 254만 + OpenAlex 1.1억'],m:'합계 약 1.1억 편'},
 {n:'02',t:'지어내지 않고<br>찾아준다',s:'LLM 과 경쟁하지 않는다',
  li:['생성형 AI 는 없는 논문도 만든다','우리는 근거를 발견한다 · DOI 확인'],m:'환각 없음 · 전건 검증'},
 {n:'03',t:'색인을<br>우리가 소유',s:'구독이 아니라 자산',
  li:['우리 DB 안에서 끝난다','외부 의존과 지연이 없다'],m:'응답 0.2~0.9초'},
 {n:'04',t:'글자가 아니라<br>뜻으로',s:'0건 화면이 없다',
  li:['지문 84.3만 편을 2축 벡터로','한 단어만 걸려도 편다'],m:'KNN 1.6ms'},
 {n:'05',t:'구글 스칼라<br>전 항목 + 원문',s:'고급 검색',
  li:['모두 포함·정확 문구·OR·NOT','구독 학술지는 바로 원문 열람'],m:'저자관계 362만 행'}
];
document.getElementById('grid-7q2v8').innerHTML=BOX.map(b=>`
 <div class="bx-7q2v8">
  <div class="n-7q2v8">${b.n}</div><h3>${b.t}</h3><div class="s-x">${b.s}</div>
  <ul>${b.li.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="m-x">${b.m}</div>
 </div>`).join('');

/* ── 알약 크기·위치 ── */
let W=0,H=0,DPR=1,PW=0,PH=0,CX=0,CY=0;
function layout(){
 W=wrap.clientWidth; H=wrap.clientHeight; DPR=Math.min(devicePixelRatio||1,2);
 const NAR=W<760;
 PW=Math.min(NAR?W*0.90:W*0.70, 1040);
 PH=Math.max(NAR?58:74, Math.min(PW*(NAR?0.185:0.135), 132));
 ph.style.fontSize=Math.round(Math.max(13, Math.min(PH*0.30, 32)))+'px';
 pill.style.width=Math.round(PW)+'px';
 pill.style.height=Math.round(PH)+'px';
 const ic=Math.round(Math.max(20,PH*0.32));
 ICONS.forEach(e=>{if(e){e.setAttribute('width',ic);e.setAttribute('height',ic);}});
 // 칩 줄은 캡션 위에 반드시 남게 배치한다
 const capH=cap.getBoundingClientRect().height||34;
 const sugH=sug.getBoundingClientRect().height||40;
 const floor=H/2+PH/2+14;                       // 알약을 절대 침범하지 않는 하한
 const want=H/2+PH/2+Math.max(30,H*0.065);
 const limit=H-(H*0.052+capH)-sugH-14;
 sug.style.top=Math.round(Math.max(floor, Math.min(want, limit)))+'px';
 sug.style.maxWidth=Math.round(Math.min(W*0.92, 980))+'px';
 CX=W/2; CY=H/2;
 /* 하단 박스는 3장과 같은 규칙(1600x900 기준)으로 확대·축소한다 */
 const kk=Math.min(innerWidth/1600, innerHeight/900);   // 3장과 동일한 기준
 cap.style.transform='translateX(-50%) scale('+kk.toFixed(4)+')';
}
/* 점묘 halo 는 걷어냈다. 새 검색박스가 자기 글로우를 갖고 있어
   두 겹이 겹쳐 보였다. 애니메이션 루프도 함께 지웠다. */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
/* ── 플레이스홀더 순환 ── */
let hi=0;
function cycle(){
 const L2=hints(); hi=(hi+1)%L2.length;
 ph.style.transition='opacity .32s'; ph.style.opacity='0';
 setTimeout(()=>{ph.textContent=L2[hi]; ph.style.opacity='1';},320);
}
let cyc=setInterval(cycle, 3400);
sug.addEventListener('click',e=>{const s=e.target.closest('.s-'+T); if(!s)return;
 clearInterval(cyc); ph.textContent=s.childNodes[0].textContent.trim()+' 결과 보기';
 cyc=setInterval(cycle,3400);});

let rt=0;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();
},140);});
RM.addEventListener?.('change',e=>{
 if(e.matches) clearInterval(cyc); else cyc=setInterval(cycle,3400);});

layout();
if(RM.matches) clearInterval(cyc);
})();
</script></body></html>
