function iconIn(g,key,cx,cy,size,col,op){
  const s=size/24;
  const gg=el('g',{transform:`translate(${(cx-size/2).toFixed(1)},${(cy-size/2).toFixed(1)}) scale(${s.toFixed(4)})`,
    fill:'none', stroke:col||'#bfe4ff', 'stroke-width':(1.6/s).toFixed(2),
    'stroke-linecap':'round', 'stroke-linejoin':'round', 'stroke-opacity':op==null?.92:op}, g);
  (ICONS[key]||[]).forEach(d=>el('path',{d},gg));
  return gg;
}

function shapeIn(g,kind,cx,cy,w){
 const R=w*0.52, col='#7dd3fc';
 const dot=(x,y,r,o)=>el('circle',{cx:x,cy:y,r,fill:col,'fill-opacity':o*0.45},g);
 const iso=(a,r)=>[cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.5];
 if(kind==='burst'){for(let i=0;i<40;i++){const a=rnd()*Math.PI*2,r=Math.pow(rnd(),.62)*R;
   const [x,y]=iso(a,r); dot(x,y,rnd()*1.3+.6,.32+rnd()*.5);}
   el('circle',{cx,cy,r:3.6,fill:'#bfe4ff','fill-opacity':.95,filter:'url(#glow)'},g);}
 else if(kind==='grid'){for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)for(let k=-1;k<=1;k++){
   dot(cx+(i-j)*R*.30, cy+(i+j)*R*.155+k*R*.34, 1.2, k===0?.8:.35);}}
 else if(kind==='orbit'){[1,.7,.42].forEach((f,i)=>{
   el('ellipse',{cx,cy,rx:R*f,ry:R*f*.5,fill:'none',stroke:col,'stroke-opacity':.28+i*.07,'stroke-width':.85},g);
   const n=[9,7,5][i]; for(let s2=0;s2<n;s2++){const [x,y]=iso(s2/n*Math.PI*2+i*.5,R*f); dot(x,y,1.5,.8);}});
   el('circle',{cx,cy,r:3.2,fill:'#bfe4ff','fill-opacity':.95,filter:'url(#glow)'},g);}
 else {const N=12,pts=[];
   for(let i=0;i<N;i++){const a=rnd()*Math.PI*2,r=Math.pow(rnd(),.5)*R*.9; pts.push(iso(a,r));}
   for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const dd=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);
     if(dd<R*.62) el('line',{x1:pts[i][0],y1:pts[i][1],x2:pts[j][0],y2:pts[j][1],
       stroke:col,'stroke-opacity':.22,'stroke-width':.7},g);}
   pts.forEach(p=>dot(p[0],p[1],1.7,.85));}
}
function cube(g,x,y,w,h,kf,shape,icon){
 const c=cubePts(x,y,w,h,kf), pw=w*1.1, ph=pw*kf;
 el('polygon',{points:P([[x-pw,y+h/2+7],[x,y+h/2+7+ph],[x+pw,y+h/2+7],[x,y+h/2+7-ph]]),class:'plate'},g);
 el('polygon',{points:P([c.tl,c.tb,c.bb,c.bl]),class:'face f-l'},g);
 el('polygon',{points:P([c.tb,c.tr,c.br,c.bb]),class:'face f-r'},g);
 shapeIn(g,shape,x,y,w*0.72);          // 유리 느낌의 옅은 입자 배경
 iconIn(g,icon,x,y-h*0.06,w*0.86);      // 아이콘 (교체 지점)
 el('polygon',{points:P([c.tt,c.tr,c.tb,c.tl]),class:'face f-top'},g);
 [[c.tt,c.tr],[c.tr,c.tb],[c.tb,c.tl],[c.tl,c.tt],[c.tl,c.bl],[c.tb,c.bb],[c.tr,c.br],
  [c.bl,c.bb],[c.bb,c.br]].forEach(([a,b])=>
   el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'face'},g));
 el('circle',{cx:c.tt[0],cy:c.tt[1],r:2.3,fill:'#cfe8ff',filter:'url(#glow)'},g);
 return c;
}

/* 좌표 */
const POS=NODES.map((_,i)=>{const a=-Math.PI/2+Math.PI*2*i/NODES.length;
 return {x:HUB.x+Math.cos(a)*RX, y:HUB.y+Math.sin(a)*RY, a};});
/* 순환 궤도 + 방향 화살촉 */
el('ellipse',{cx:HUB.x,cy:HUB.y,rx:RX+62,ry:RY+42,fill:'none',stroke:'#5d7099',
 'stroke-opacity':.18,'stroke-width':1,'stroke-dasharray':'4 8'},S);
for(let i=0;i<NODES.length;i++){
 const a=-Math.PI/2+Math.PI*2*(i+0.5)/NODES.length;
 const x=HUB.x+Math.cos(a)*(RX+62), y=HUB.y+Math.sin(a)*(RY+42);
 const t=Math.atan2(Math.cos(a)*(RY+42),-Math.sin(a)*(RX+62));
 el('polygon',{points:`${x+Math.cos(t)*8},${y+Math.sin(t)*8} ${x-Math.cos(t)*4-Math.sin(t)*4.5},${y-Math.sin(t)*4+Math.cos(t)*4.5} ${x-Math.cos(t)*4+Math.sin(t)*4.5},${y-Math.sin(t)*4-Math.cos(t)*4.5}`,
   fill:'#7dd3fc','fill-opacity':.45},S);
}
txt(S,HUB.x,HUB.y+RY+164,'선순환 · 이용 데이터가 다시 판단으로','cap','middle');

/* 연결선 (허브 → 큐브) · 점 3개 */
const links=NODES.map((n,i)=>{
 const q=POS[i], g=el('g',{},S);
 const ux=q.x-HUB.x, uy=q.y-HUB.y, L=Math.hypot(ux,uy);
 const x0=HUB.x+ux/L*104, y0=HUB.y+uy/L*76, x1=q.x-ux/L*54, y1=q.y-uy/L*44;
 const p=el('line',{x1:x0,y1:y0,x2:x1,y2:y1,class:'lk',id:'lk-'+n.id},g);
 // 01 데이터 조달만 허브 쪽으로, 나머지는 허브에서 바깥으로
 const inward = n.id==='src';
 const A = inward ? [x1,y1] : [x0,y0];
 const B = inward ? [x0,y0] : [x1,y1];
 const path=`M${A[0]},${A[1]} L${B[0]},${B[1]}`;
 const DUR=2.6, K=3;
 for(let j=0;j<K;j++){
  const d=el('g',{class:'flow'},g);
  el('circle',{cx:0,cy:0,r:5.4,fill:'#bfe4ff','fill-opacity':.22},d);
  el('circle',{cx:0,cy:0,r:2.4,fill:'#ffffff','fill-opacity':.96,filter:'url(#glow)'},d);
  const m=el('animateMotion',{dur:DUR+'s',repeatCount:'indefinite',path,
    begin:(-DUR*j/K).toFixed(2)+'s',calcMode:'linear'},d);
  const o=el('animate',{attributeName:'opacity',dur:DUR+'s',repeatCount:'indefinite',
    values:'0;1;1;0',keyTimes:'0;0.12;0.86;1',begin:(-DUR*j/K).toFixed(2)+'s'},d);
 }
 // 방향 화살촉 (정지 상태에서도 방향이 보이게)
 const vx=B[0]-A[0], vy=B[1]-A[1], VL=Math.hypot(vx,vy);
 const hx=A[0]+vx*0.88, hy=A[1]+vy*0.88;
 el('polygon',{points:`${hx+vx/VL*7},${hy+vy/VL*7} ${hx-vx/VL*3-vy/VL*4.4},${hy-vy/VL*3+vx/VL*4.4} ${hx-vx/VL*3+vy/VL*4.4},${hy-vy/VL*3-vx/VL*4.4}`,
   fill:'#bfe4ff','fill-opacity':.55},g);
 return p;
});

/* 허브 */
(function(){
 const g=el('g',{},S);
 el('circle',{cx:HUB.x,cy:HUB.y,r:112,fill:'url(#hubg)'},g);
 const kf=0.44, c=cubePts(HUB.x,HUB.y,84,96,kf);
 el('polygon',{points:P([[HUB.x-96,HUB.y+56],[HUB.x,HUB.y+56+96*kf],[HUB.x+96,HUB.y+56],[HUB.x,HUB.y+56-96*kf]]),class:'plate'},g);
 el('polygon',{points:P([c.tl,c.tb,c.bb,c.bl]),fill:'#38bdf8','fill-opacity':.30},g);
 el('polygon',{points:P([c.tb,c.tr,c.br,c.bb]),fill:'#1d4ed8','fill-opacity':.40},g);
 shapeIn(g,'burst',HUB.x,HUB.y,66);
 iconIn(g,'hub',HUB.x,HUB.y-6,60,'#eaf6ff',.95);
 el('polygon',{points:P([c.tt,c.tr,c.tb,c.tl]),fill:'#bfe4ff','fill-opacity':.30,
   stroke:'#bfe4ff','stroke-opacity':.75,'stroke-width':1.2},g);
 [[c.tt,c.tr],[c.tr,c.tb],[c.tb,c.tl],[c.tl,c.tt],[c.tl,c.bl],[c.tb,c.bb],[c.tr,c.br],
  [c.bl,c.bb],[c.bb,c.br]].forEach(([a,b])=>
   el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#bfe4ff','stroke-opacity':.6,'stroke-width':1},g));
 el('circle',{cx:HUB.x,cy:HUB.y,r:6,fill:'#e0f2fe',filter:'url(#glow)'},g);
 txt(g,HUB.x,HUB.y+126,D.hub.t,'hub-t','middle');
 txt(g,HUB.x,HUB.y+146,D.hub.s,'hub-s','middle');
 txt(g,HUB.x,HUB.y+165,D.hub.n,'hub-n','middle');
})();

/* 큐브 10 */
NODES.forEach((n,i)=>{
 const q=POS[i], kf=kfAt(q.y), s=scAt(q.y), w=46*s, h=54*s;
 const g=el('g',{class:'node'+(i===0?' on':'')},S); g.dataset.i=i;
 cube(g,q.x,q.y,w,h,kf,n.shape,n.id);
 const left=q.x<HUB.x-6, ctr=Math.abs(q.x-HUB.x)<=6;
 const lx = ctr ? q.x : (left ? q.x-w*1.2 : q.x+w*1.2);
 const anc = ctr ? 'middle' : (left?'end':'start');
 const ly = ctr ? (q.y<HUB.y ? q.y-h/2-w*kf-30 : q.y+h/2+w*kf+30) : q.y-h*0.34;
 txt(g,lx,ly,n.n,'num',anc);
 txt(g,lx,ly+19,n.t,'ttl',anc);
 txt(g,lx,ly+35,n.v,'cnt',anc);
 txt(g,lx,ly+51,n.s,'dsc',anc);
 // 큐브와 라벨을 함께 덮는 히트 영역
 const hx0=Math.min(q.x-w*1.25, anc==='end'?lx-190:lx-10);
 const hx1=Math.max(q.x+w*1.25, anc==='start'?lx+190:lx+10);
 const hy0=Math.min(q.y-h/2-w*kf-10, ly-16), hy1=Math.max(q.y+h/2+w*kf+12, ly+58);
 el('rect',{x:hx0,y:hy0,width:hx1-hx0,height:hy1-hy0,fill:'transparent'},g);
 g.addEventListener('mouseenter',()=>links[i].classList.add('on'));
 g.addEventListener('mouseleave',()=>{if(CUR!==i)links[i].classList.remove('on');});
});

let CUR=0;
function show(i){
 CUR=i;
 document.querySelectorAll('.node').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));
 links.forEach((l,j)=>l.classList.toggle('on',j===i));
 const n=NODES[i], nx=NODES[(i+1)%NODES.length];
 pnl.innerHTML=`<div class="pn"><span class="ix">${n.n}</span><h3>${n.t}</h3>
   <span class="tg">${n.v}</span><span style="color:#5d7099;font-size:12.5px">${n.s}</span></div>
   <div class="pg">${n.items.map(x=>`<div class="pi">${x}</div>`).join('')}</div>
   <div class="pd">${n.d}<br>다음은 <b>${nx.t}</b>.${i===NODES.length-1?' 여기서 쌓인 이용 데이터가 다시 <b>장서·수서 판단</b>으로 돌아간다.':''}</div>`;
}
S.addEventListener('click',e=>{const n=e.target.closest('.node'); if(n) show(+n.dataset.i);});
document.getElementById('las').innerHTML=D.las.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('');
document.getElementById('cyc').innerHTML=`<h3>전체 선순환</h3><div class="cf">`+
 D.cycle.map((c,i)=>`<span${i===D.cycle.length-1?' class="last"':''}>${c}</span>`+
  (i<D.cycle.length-1?'<i>→</i>':'<i>↺</i>')).join('')+`</div>`;
document.getElementById('key').innerHTML=D.key;
show(1);
</script>

<script>
/* 1600x900 고정 무대 — 작업가이드 5장 규격.
   resize 하나만 걸면 iframe 슬라이드에서 배율이 틀어진 채 굳는다. 다섯 개를 다 건다. */
function fitStage(){
  const st=document.getElementById('stage'); if(!st) return;
  st.style.height='900px';
  const k=Math.min(innerWidth/1600, innerHeight/900);
  st.style.transform=`translate(-50%,-50%) scale(${k.toFixed(4)})`;
}
fitStage();
addEventListener('resize',fitStage);
addEventListener('load',fitStage);
addEventListener('pageshow',fitStage);
if(window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStage);
</script>
<script>if(window.self!==window.top) document.documentElement.classList.add('emb-bg0');</script>
