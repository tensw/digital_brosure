<style>
:root{--bg1:#e8edf2;--bg2:#cdd5db;--card:#fff;--line:#e4ebf1;--ink:#071739;--ink2:#3c5171;--ink3:#4b6382;
 --accent:#8a6238;--accent-solid:#e3c39d;--on-accent:#071739;--red:#b0344c;
 --ui:'Gothic A1','Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;--num:'IBM Plex Mono',ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--bg1:#071739;--bg2:#0a1d44;--card:#0c2149;--line:#1c3a6b;
 --ink:#cdd5db;--ink2:#a4b5c4;--ink3:#93a7bd;--accent:#e3c39d;--red:#f0a0ae}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
 font:400 13.5px/1.55 var(--ui);letter-spacing:-.1px;color:var(--ink);
 background:linear-gradient(158deg,var(--bg1),var(--bg2));background-attachment:fixed;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;
 padding:34px 30px 28px;box-shadow:0 12px 40px rgba(7,23,57,.14)}
.lg{display:block;width:52px;height:52px;margin:0 auto 16px}
h1{font-size:18px;font-weight:800;text-align:center;letter-spacing:-.5px}
.sub{font-size:12px;color:var(--ink3);text-align:center;margin:5px 0 22px}
label{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin:0 0 5px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:transparent;
 font:600 14px var(--ui);color:var(--ink);margin-bottom:13px;transition:.14s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,195,157,.28)}
button{width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent-solid);color:var(--on-accent);
 font:800 14px var(--ui);cursor:pointer;transition:.14s;margin-top:4px}
button:hover{filter:brightness(.96)} button:disabled{opacity:.6;cursor:default}
.msg{font-size:12px;color:var(--red);text-align:center;margin-top:12px;min-height:17px;font-weight:600}
.foot{font-size:11px;color:var(--ink3);text-align:center;margin-top:18px;line-height:1.6}
</style></head><body>

 <h1>SKKU BK21 성과관리</h1>
 <div class="sub">계정을 받으신 분만 들어올 수 있습니다</div>
 <label for="id">아이디</label>
 <input id="id" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required>
 <label for="pw">비밀번호</label>
 <input id="pw" name="password" type="password" autocomplete="current-password" required>
 <button id="b" type="submit">들어가기</button>
 <div class="msg" id="m"></div>
 <div class="foot">성균관대학교 BK21 교육연구단 성과관리<br>계정 문의는 담당자에게 연락해 주십시오</div>
</form>
<script>
const q=new URLSearchParams(location.search), next=q.get('next')||'/';
const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');
f.onsubmit=async e=>{
 e.preventDefault(); m.textContent=''; b.disabled=true; b.textContent='확인 중…';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({id:document.getElementById('id').value,pw:document.getElementById('pw').value})});
  const d=await r.json();
  if(d.ok){ location.replace(next.startsWith('/')?next:'/'); return; }
  m.textContent=d.msg||'들어갈 수 없습니다';
 }catch(_){ m.textContent='연결에 실패했습니다. 잠시 뒤 다시 시도해 주십시오'; }
 b.disabled=false; b.textContent='들어가기';
};
document.getElementById('id').focus();
</script></body></html>
