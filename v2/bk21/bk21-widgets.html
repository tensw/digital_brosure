<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BK21 위젯 대시보드</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eceff1; --card:#fff; --line:#e4e8eb; --line2:#eef1f3;
  --ink:#101c17; --dim:#5d6b74; --dim2:#8b97a0;
  --g:#12b76a; --g2:#059a58; --gd:#0e3b2e; --gl:#dff5e9; --gl2:#f0faf4;
  --amber:#f5c518; --amber-d:#b98a00;
  --blue:#2e6fd9; --teal:#0ea5a5; --violet:#7c5cf0; --slate:#64748b; --red:#e5484d;
  --ui:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1420px;margin:0 auto;padding:26px 22px 80px}

/* ── 헤더 ───────────────────────────── */
.top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.brand .kick{font:700 10px/1 var(--mono);letter-spacing:.28em;color:var(--dim2)}
.brand h1{margin-top:9px;font-size:26px;font-weight:800;letter-spacing:-.7px}
.brand p{margin-top:7px;font-size:13px;color:var(--dim);max-width:62ch}
.brand p b{color:var(--gd)}
.topright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.searchpill{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--gd);
  border-radius:999px;padding:11px 18px;min-width:330px}
.searchpill svg{flex:none}
.searchpill input{flex:1;border:0;outline:0;font:600 14px var(--ui);color:var(--ink);background:transparent}
.searchpill input::placeholder{color:var(--dim2);font-weight:500}
.searchpill .clr{border:0;background:transparent;color:var(--dim2);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.cnt{font:700 11px/1 var(--mono);color:var(--dim2);letter-spacing:.06em}
.cnt b{color:var(--gd)}

/* ── 필터 칩 (ui green 샘플) ─────────── */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;
  font:700 13px var(--ui);cursor:pointer;border:1.5px solid transparent;transition:.14s;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.q{background:#fff;border-color:var(--gd);color:var(--gd)}
.chip.q:hover{background:var(--gl2)}
.chip.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.chip.on .dot{outline:2px solid rgba(255,255,255,.5);outline-offset:1px}
.chip.all.on{background:var(--g);border-color:var(--g)}
.chip.k{background:var(--amber);border-color:var(--amber);color:#2a2205}
.chip.k.on{background:var(--gd);border-color:var(--gd);color:#fff}

/* ── 벤토 그리드 ────────────────────── */
#grid{display:block}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:158px;gap:14px;margin-bottom:30px}
.t{grid-column:span 2;grid-row:span 1}
.s3x2{grid-column:span 3;grid-row:span 2} .s2x2{grid-column:span 2;grid-row:span 2}
.s3x1{grid-column:span 3;grid-row:span 1} .s2x1{grid-column:span 2;grid-row:span 1}
.s1x1{grid-column:span 1;grid-row:span 1} .s1x2{grid-column:span 1;grid-row:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 17px 13px;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;cursor:pointer;transition:.16s;overflow:hidden;position:relative;
  box-shadow:0 1px 2px rgba(16,28,23,.04)}
.card:hover{border-color:var(--g);transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,28,23,.10)}
.card:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.card .hd{display:flex;align-items:flex-start;gap:8px}
.card .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.35px;line-height:1.35;color:var(--ink)}
.card .sub{margin-top:3px;font-size:11.5px;color:var(--dim2);font-weight:600}
.card .rep{margin-left:auto;flex:none;font:700 10px/1 var(--ui);padding:5px 9px;border-radius:999px;
  background:var(--gl);color:var(--g2);white-space:nowrap}
.card .rep.amber{background:#fdf3d0;color:var(--amber-d)}
.card .rep.blue{background:#e3edfd;color:var(--blue)}
.card .rep.teal{background:#d9f5f5;color:#0b7d7d}
.card .rep.violet{background:#eae5fe;color:var(--violet)}
.card .rep.slate{background:#e8ecef;color:var(--slate)}
.big{margin-top:10px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.big .v{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--g2);line-height:1.1}
.big .u{font-size:12px;font-weight:700;color:var(--dim)}
.pillrow{margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dpill{font:700 11px/1 var(--ui);padding:4px 8px;border-radius:999px;background:#e7f0fb;color:#2c5fa8}
.dpill.up{background:var(--gl);color:var(--g2)} .dpill.dn{background:#fdeaea;color:var(--red)}
.note{font-size:11.5px;color:var(--dim);font-weight:600}
.legend{margin-top:9px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);font-weight:600}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.dot{width:8px;height:8px;border-radius:50%}
.plot{flex:1;min-height:0;margin-top:8px;display:flex;align-items:stretch}
.plot svg{width:100%;height:100%;display:block;overflow:visible}
.ft{margin-top:9px;padding-top:8px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:6px;
  font-size:10.5px;color:var(--dim2);font-weight:600}
.ft .g{margin-left:auto;color:var(--g2);font-weight:700;opacity:0;transition:.14s}
.card:hover .ft .g{opacity:1}
/* 미니 표 */
table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
table.mini th{text-align:left;font-size:10px;color:var(--dim2);font-weight:700;padding:0 0 5px;
  border-bottom:1px solid var(--line2);letter-spacing:.02em}
table.mini th.n,table.mini td.n{text-align:right;font-variant-numeric:tabular-nums}
table.mini td{padding:5px 0;border-bottom:1px solid var(--line2);color:var(--ink);font-weight:600}
table.mini tr:last-child td{border-bottom:0}
table.mini td.nm{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
table.mini tr.me td{color:var(--g2);font-weight:800}
/* 가로 막대 리스트 */
.dl{display:flex;flex-direction:column;gap:7px;justify-content:center;height:100%}
.dl .r{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:9px;font-size:11.5px}
.dl .n{color:var(--dim);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .bar{height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.dl .bar i{display:block;height:100%;border-radius:5px;background:var(--g)}
.dl .v{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
/* 100% 누적 */
.stk{display:flex;height:17px;flex:none;border-radius:8px;overflow:hidden;margin-top:2px}
.stk i{display:block;height:100%}
.stkleg{margin-top:8px;flex:none;display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--dim);font-weight:600}
.stkleg em{font-style:normal;color:var(--ink);font-weight:800}
.s3x1 .ft,.s2x1 .ft,.s1x1 .ft{display:none}
.s3x1 .stkleg,.s2x1 .stkleg{flex-wrap:nowrap;overflow:hidden;margin-top:7px}
.s3x1 .pillrow,.s2x1 .pillrow{margin-top:4px}
.s3x1 .plot,.s2x1 .plot{margin-top:6px}
.s3x1 .big,.s2x1 .big{margin-top:7px}
.s3x1 .big .v,.s2x1 .big .v{font-size:23px}
.empty{padding:60px 10px;text-align:center;color:var(--dim2);font-weight:600}
/* 섹션 타이틀 */
.sec{display:flex;align-items:center;gap:11px;margin:4px 0 13px}
.sec i{width:9px;height:9px;border-radius:3px}
.sec h2{font-size:15px;font-weight:800;letter-spacing:-.3px}
.sec span{font-size:12px;color:var(--dim2);font-weight:600}
.sec a{margin-left:auto;font:700 11.5px var(--ui);color:var(--gd);text-decoration:none;
  border:1.5px solid var(--gd);border-radius:999px;padding:6px 13px;white-space:nowrap}
.sec a:hover{background:var(--gd);color:#fff}
@media(max-width:1180px){.bento{grid-template-columns:repeat(4,1fr)}.s3x2,.s3x1{grid-column:span 4}}
@media(max-width:820px){.bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}
  .s3x2,.s3x1,.s2x2,.s2x1{grid-column:span 2}.s1x1,.s1x2{grid-column:span 1}
  .searchpill{min-width:0;width:100%}.topright{width:100%;align-items:stretch}}

/* ── 질문하기 버튼 ───────────────────── */
.askbtn{display:inline-flex;align-items:center;gap:9px;background:var(--gd);color:#fff;border:0;
  border-radius:999px;padding:12px 20px 12px 17px;font:800 14px var(--ui);cursor:pointer;
  letter-spacing:-.2px;transition:.15s;box-shadow:0 2px 10px rgba(14,59,46,.22)}
.askbtn:hover{background:#0a2e23;box-shadow:0 4px 16px rgba(14,59,46,.3)}
.askbtn .kbd{font:700 10px/1 var(--mono);background:rgba(255,255,255,.18);border-radius:5px;
  padding:4px 6px;letter-spacing:.04em}
.askrow{display:flex;align-items:center;gap:10px}

/* ── 심플모드 전체화면 질문 (배경 포함) ── */
.sm-ask{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;gap:34px;
  background:
    radial-gradient(50% 45% at 15% 92%, rgba(255,176,148,0.30), transparent 72%),
    radial-gradient(54% 48% at 50% 106%, rgba(150,128,238,0.28), transparent 72%),
    radial-gradient(56% 50% at 87% 95%, rgba(96,184,248,0.30), transparent 72%),
    radial-gradient(62% 48% at 80% 3%, rgba(122,200,250,0.10), transparent 70%),
    #F4F6F8;
  opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s}
.sm-ask.open{opacity:1;visibility:visible}
.sm-ask-wrap{position:relative;display:flex;align-items:center;width:min(900px,92vw)}
.sm-ask-input{width:100%;text-align:center;border:none;outline:none;background:transparent;
  font-family:var(--ui);font-size:30px;font-weight:800;letter-spacing:-.02em;
  color:#1E2125;caret-color:var(--g2)}
.sm-ask-input::placeholder{color:#8B9197;opacity:.4;font-weight:800}
.sm-ask .ask-clear{position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;border:none;padding:0;cursor:pointer;
  display:none;align-items:center;justify-content:center;color:#8B9197;
  background:color-mix(in srgb,#1E2125 9%, transparent);transition:background .15s,color .15s}
.sm-ask .ask-clear.show{display:inline-flex}
.sm-ask .ask-clear:hover{background:color-mix(in srgb,#1E2125 16%, transparent);color:#1E2125}
.sm-ask .ask-clear svg{width:14px;height:14px}
.sm-suggest{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:min(900px,92vw)}
.sm-chip{padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E2E6EA;
  font:600 14px var(--ui);color:#1E2125;cursor:pointer;transition:.14s}
.sm-chip:hover{border-color:var(--gd);color:var(--gd)}
.sm-hint{font:600 12px var(--ui);color:#8B9197;letter-spacing:-.1px}
.sm-hint b{color:#1E2125;font-weight:800}
.sm-ask .sm-x{position:absolute;top:22px;right:24px;width:38px;height:38px;border-radius:50%;
  border:1px solid #E2E6EA;background:#fff;color:#8B9197;cursor:pointer;font-size:19px;line-height:1}
.sm-ask .sm-x:hover{color:#1E2125}
.sm-state{font:700 13px var(--ui);color:var(--gd);min-height:19px}
@media(max-width:640px){.sm-ask-input{font-size:22px}}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="kick">BK21 · WIDGET DASHBOARD</div>
      <h1>차트 한 장씩 찾아보기</h1>
      <p>보고서 안의 차트를 낱개로 늘어놓았습니다. 타일을 누르면 <b>그 차트가 들어 있는 보고서</b>가 해당 위치에서 열립니다.
         같은 보고서의 차트들은 같은 색 뱃지를 답니다.</p>
    </div>
    <div class="topright">
      <div class="searchpill">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0e3b2e" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" placeholder="학과, 대학, 분야, 협업, 품질…" autocomplete="off">
        <button class="clr" id="clr" title="지우기">×</button>
      </div>
      <div class="askrow">
        <button class="askbtn" id="openAsk">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.9-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
          질문하기 <span class="kbd">/</span>
        </button>
        <div class="cnt"><b id="cn">0</b> WIDGETS · <span id="rn">0</span> REPORTS</div>
      </div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="grid"></div>
</div>


<div class="sm-ask" id="smAsk">
  <button class="sm-x" id="smAskX" title="닫기">×</button>
  <div class="sm-ask-wrap">
    <input class="sm-ask-input" id="smAskInput" placeholder="대화하듯 검색하세요" autocomplete="off" spellcheck="false">
    <button class="ask-clear" id="smAskClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  </div>
  <div class="sm-state" id="smState"></div>
  <div class="sm-suggest" id="smSug"></div>
  <div class="sm-hint">Enter 로 보고서를 엽니다 · Esc 로 닫기</div>
</div>

<script src="spec.js"></script>
<script src="reports.js"></script>
<script>
/* ══════════ 공통 ══════════ */
const S = window.SPEC, RPT = window.REPORTS;
const MET = S.metrics, AX = S.axes;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL = ['#12b76a','#2e6fd9','#f5c518','#7c5cf0','#0ea5a5','#e5484d','#8b97a0'];

const fmt = (v, u) => {
  if (v == null || isNaN(v)) return '—';
  if (u === '%') return (Math.round(v * 10) / 10) + '';
  if (Math.abs(v) >= 10000) return Math.round(v).toLocaleString();
  if (Math.abs(v) >= 100) return Math.round(v).toLocaleString();
  if (Math.abs(v) >= 10) return (Math.round(v * 10) / 10) + '';
  return (Math.round(v * 100) / 100) + '';
};
const short = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const mname = k => (MET[k] && MET[k].n) || k;
const munit = k => (MET[k] && MET[k].u) || '';
const axname = k => AX[k] || k;

/* answers → 정규화 */
function A(rid) { return S.answers[rid] || null; }
function lab(row, i) { const l = row[0]; return Array.isArray(l) ? l[i || 0] : l; }
function isYear(c) { return c === 'y'; }

/* 시리즈: [{key, pts:[[x,v]…]}] — 2축 중 하나가 연도일 때 */
function series(a, mi) {
  const yi = a.cols.indexOf('y');
  if (yi < 0) return null;
  const other = yi === 0 ? 1 : 0;
  const two = a.cols.length > 1;
  const map = new Map();
  a.rows.forEach(r => {
    const k = two ? lab(r, other) : '전체';
    const x = two ? lab(r, yi) : lab(r, 0);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push([String(x), r[1 + mi]]);
  });
  const out = [...map].map(([key, pts]) => {
    pts.sort((p, q) => p[0].localeCompare(q[0]));
    return { key, pts, sum: pts.reduce((s, p) => s + (p[1] || 0), 0) };
  });
  out.sort((p, q) => q.sum - p.sum);
  return out;
}

/* ══════════ 미니 차트 ══════════ */
function svgWrap(inner, vb) { return `<svg viewBox="0 0 ${vb[0]} ${vb[1]}" preserveAspectRatio="none">${inner}</svg>`; }

function chLine(a, mi, big) {
  const ss = series(a, mi); if (!ss || !ss.length) return '';
  const use = ss.slice(0, big ? 4 : 2);
  const xs = [...new Set(a.rows.map(r => String(lab(r, a.cols.indexOf('y')))))].sort();
  const W = 300, H = big ? 100 : 62, P = 4;
  let mx = 0; use.forEach(s => s.pts.forEach(p => { if (p[1] > mx) mx = p[1]; }));
  mx = mx || 1;
  const X = x => P + (W - P * 2) * (xs.indexOf(x) / Math.max(1, xs.length - 1));
  const Y = v => H - P - (H - P * 2) * (v / mx);
  let g = '';
  use.forEach((s, i) => {
    const c = PAL[i % PAL.length];
    const d = s.pts.map((p, j) => (j ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
    if (i === 0) {
      const area = d + ` L${X(s.pts[s.pts.length-1][0]).toFixed(1)} ${H-P} L${X(s.pts[0][0]).toFixed(1)} ${H-P} Z`;
      g += `<path d="${area}" fill="${c}" opacity=".10"/>`;
    }
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${i?1.6:2.2}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    const last = s.pts[s.pts.length - 1];
    g += `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3" fill="${c}"/>`;
  });
  const ticks = big ? xs.map(x => `<text x="${X(x).toFixed(1)}" y="${H-0.5}" font-size="7" fill="#8b97a0" text-anchor="middle" font-weight="600">${esc(x)}</text>`).join('') : '';
  return { html: svgWrap(g + ticks, [W, H]), legend: use.map((s, i) => ({ n: s.key, c: PAL[i % PAL.length] })) };
}

function chBarH(a, mi, big) {
  const n = big ? 6 : 4;
  const rows = a.rows.slice().sort((p, q) => (q[1 + mi] || 0) - (p[1 + mi] || 0)).slice(0, n);
  const mx = Math.max(...rows.map(r => r[1 + mi] || 0)) || 1;
  const u = munit(a.measures[mi]);
  return `<div class="dl">` + rows.map(r => {
    const l = Array.isArray(r[0]) ? r[0].join(' × ') : r[0];
    return `<div class="r"><span class="n" title="${esc(l)}">${esc(short(l, 13))}</span>
      <span class="bar"><i style="width:${Math.max(3, (r[1+mi]/mx)*100).toFixed(1)}%"></i></span>
      <span class="v">${fmt(r[1 + mi], u)}</span></div>`;
  }).join('') + `</div>`;
}

function chBarV(a, mi, big) {
  const rows = a.rows.slice(0, big ? 12 : 8);
  const mx = Math.max(...rows.map(r => r[1 + mi] || 0)) || 1;
  const W = 300, H = big ? 96 : 60, g = 3, bw = (W - g * (rows.length - 1)) / rows.length;
  let s = '';
  rows.forEach((r, i) => {
    const h = Math.max(2, (r[1 + mi] / mx) * (H - 12));
    s += `<rect x="${(i*(bw+g)).toFixed(1)}" y="${(H-12-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${i===0?'#12b76a':'#a9e6c6'}"/>`;
    if (big) s += `<text x="${(i*(bw+g)+bw/2).toFixed(1)}" y="${H-2}" font-size="7" fill="#8b97a0" text-anchor="middle" font-weight="600">${esc(short(String(lab(r,0)),5))}</text>`;
  });
  return svgWrap(s, [W, H]);
}

function chStack(a, mi, big) {
  /* 1축이면 그 축 구성비, 2축이면 첫 행 그룹의 구성비 */
  let rows = a.rows;
  if (a.cols.length > 1) { const k0 = lab(a.rows[0], 0); rows = a.rows.filter(r => lab(r, 0) === k0); }
  const tot = rows.reduce((s, r) => s + (r[1 + mi] || 0), 0) || 1;
  const segs = rows.map((r, i) => ({ n: String(lab(r, a.cols.length > 1 ? 1 : 0)), v: r[1 + mi] || 0, c: PAL[i % PAL.length] }))
    .sort((p, q) => q.v - p.v);
  const bar = `<div class="stk">` + segs.map(s => `<i style="width:${(s.v/tot*100).toFixed(2)}%;background:${s.c}" title="${esc(s.n)} ${fmt(s.v)}"></i>`).join('') + `</div>`;
  const leg = `<div class="stkleg">` + segs.slice(0, big ? 6 : 4).map(s =>
    `<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.c};margin-right:5px"></i>${esc(short(s.n,9))} <em>${(s.v/tot*100).toFixed(0)}%</em></span>`).join('') + `</div>`;
  return `<div style="display:flex;flex-direction:column;justify-content:center;height:100%">${bar}${leg}</div>`;
}

function chScatter(a, big) {
  const xs = a.rows.map(r => r[1] || 0), ys = a.rows.map(r => r[2] || 0);
  const xm = Math.max(...xs) || 1, ym = Math.max(...ys) || 1;
  const W = 300, H = big ? 100 : 62, P = 6;
  let s = `<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e4e8eb" stroke-width="1"/>
           <line x1="${P}" y1="${P}" x2="${P}" y2="${H-P}" stroke="#e4e8eb" stroke-width="1"/>`;
  a.rows.forEach(r => {
    const x = P + (W - P * 2) * ((r[1] || 0) / xm), y = (H - P) - (H - P * 2) * ((r[2] || 0) / ym);
    const me = String(lab(r, 0)).indexOf('성균관') >= 0;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${me?4:3}" fill="${me?'#0e3b2e':'#12b76a'}" opacity="${me?1:.55}"/>`;
  });
  return svgWrap(s, [W, H]);
}

function chHeat(a, mi, big) {
  const R = [...new Set(a.rows.map(r => lab(r, 0)))].slice(0, big ? 7 : 5);
  const C = [...new Set(a.rows.map(r => lab(r, 1)))].slice(0, big ? 8 : 6);
  const m = new Map(a.rows.map(r => [lab(r, 0) + '|' + lab(r, 1), r[1 + mi] || 0]));
  const mx = Math.max(...a.rows.map(r => r[1 + mi] || 0)) || 1;
  const W = 300, H = big ? 100 : 62, cw = W / C.length, ch = H / R.length, p = 1.4;
  let s = '';
  R.forEach((rr, i) => C.forEach((cc, j) => {
    const v = m.get(rr + '|' + cc) || 0, t = Math.pow(v / mx, .55);
    s += `<rect x="${(j*cw+p).toFixed(1)}" y="${(i*ch+p).toFixed(1)}" width="${(cw-p*2).toFixed(1)}" height="${(ch-p*2).toFixed(1)}" rx="2" fill="#12b76a" opacity="${(0.07+t*0.88).toFixed(3)}"/>`;
  }));
  return svgWrap(s, [W, H]);
}

function chPareto(a, mi, big) {
  const rows = a.rows.slice().sort((p, q) => (q[1 + mi] || 0) - (p[1 + mi] || 0)).slice(0, big ? 14 : 9);
  const tot = a.rows.reduce((s, r) => s + (r[1 + mi] || 0), 0) || 1;
  const mx = rows[0][1 + mi] || 1;
  const W = 300, H = big ? 96 : 60, g = 3, bw = (W - g * (rows.length - 1)) / rows.length;
  let s = '', acc = 0, pts = [];
  rows.forEach((r, i) => {
    const h = Math.max(2, ((r[1 + mi] || 0) / mx) * (H - 8));
    s += `<rect x="${(i*(bw+g)).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="#c7ecd9"/>`;
    acc += (r[1 + mi] || 0);
    pts.push([i * (bw + g) + bw / 2, H - (acc / tot) * (H - 8)]);
  });
  s += `<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#0e3b2e" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`;
  return svgWrap(s, [W, H]);
}

function chTable(a, big) {
  const n = big ? 5 : 3;
  const ms = a.measures.slice(0, big ? 3 : 2);
  const rows = a.rows.slice(0, n);
  let h = `<table class="mini"><thead><tr><th>${esc(axname(a.cols[0]))}</th>` +
    ms.map(m => `<th class="n">${esc(short(mname(m), 7))}</th>`).join('') + `</tr></thead><tbody>`;
  rows.forEach(r => {
    const l = Array.isArray(r[0]) ? r[0].join(' ') : r[0];
    const me = String(l).indexOf('성균관') >= 0;
    h += `<tr class="${me?'me':''}"><td class="nm" title="${esc(l)}">${esc(short(l, 12))}</td>` +
      ms.map((m, i) => `<td class="n">${fmt(r[1 + i], munit(m))}</td>`).join('') + `</tr>`;
  });
  return h + `</tbody></table>`;
}

function chBarGroup(a, big) {
  const ms = a.measures.slice(0, 3);
  const W = 300, H = big ? 96 : 60, gw = W / a.rows.length;
  const mx = Math.max(...a.rows.flatMap(r => ms.map((_, i) => r[1 + i] || 0))) || 1;
  let s = '';
  a.rows.forEach((r, gi) => {
    const bw = (gw - 12) / ms.length;
    ms.forEach((m, i) => {
      const h = Math.max(2, ((r[1 + i] || 0) / mx) * (H - 12));
      s += `<rect x="${(gi*gw+6+i*bw).toFixed(1)}" y="${(H-12-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${PAL[i]}"/>`;
    });
    s += `<text x="${(gi*gw+gw/2).toFixed(1)}" y="${H-2}" font-size="7.5" fill="#8b97a0" text-anchor="middle" font-weight="600">${esc(short(String(lab(r,0)),6))}</text>`;
  });
  return { html: svgWrap(s, [W, H]), legend: ms.map((m, i) => ({ n: mname(m), c: PAL[i] })) };
}

/* ══════════ 타일 ══════════ */
function headline(a, r) {
  const mi = 0, u = munit(a.measures[mi]);
  const vals = a.rows.map(x => x[1 + mi]).filter(v => typeof v === 'number');
  if (!vals.length) return { v: a.n, u: '건' };
  const yi = a.cols.indexOf('y');
  if (r.case === 'trend' || r.case === 'grow') {
    const ss = series(a, mi);
    if (ss && ss[0]) {
      const p = ss[0].pts, f = p[0][1], l = p[p.length - 1][1];
      const d = f ? ((l - f) / f * 100) : null;
      return { v: l, u, delta: d, dnote: p[0][0] + '→' + p[p.length - 1][0], scope: ss[0].key };
    }
  }
  if (r.case === 'share' || r.case === 'conc') {
    const tot = vals.reduce((s, v) => s + v, 0);
    const top = Math.max(...vals);
    return { v: tot, u, delta: null, note: '최대 몫 ' + (top / tot * 100).toFixed(0) + '%' };
  }
  if (r.case === 'rank_me') {
    const sorted = a.rows.slice().sort((p, q) => (q[1] || 0) - (p[1] || 0));
    const k = sorted.findIndex(x => String(lab(x, 0)).indexOf('성균관') >= 0);
    if (k >= 0) return { v: sorted[k][1], u, note: `${sorted.length}곳 중 ${k + 1}위` };
  }
  const mxRow = a.rows.slice().sort((p, q) => (q[1 + mi] || 0) - (p[1 + mi] || 0))[0];
  return { v: mxRow[1 + mi], u, note: '1위 ' + short(Array.isArray(mxRow[0]) ? mxRow[0].join(' ') : mxRow[0], 12) };
}

function tile(rep, ch) {
  const r = S.recipes.find(x => x.id === ch.rid);
  const a = A(ch.rid);
  if (!r || !a) return '';
  const [cw, chh] = ch.size.split('x').map(Number);
  const big = cw >= 3 || chh >= 2;
  const hl = headline(a, r);
  let plot = '', legend = null;
  const w = r.widget;
  try {
    if (w === 'line') { const o = chLine(a, 0, big); plot = o.html; legend = o.legend; }
    else if (w === 'bar_h') plot = chBarH(a, 0, big);
    else if (w === 'bar_v') plot = chBarV(a, 0, big);
    else if (w === 'stack100') plot = chStack(a, 0, big);
    else if (w === 'scatter') plot = chScatter(a, big);
    else if (w === 'heat') plot = chHeat(a, 0, big);
    else if (w === 'pareto') plot = chPareto(a, 0, big);
    else if (w === 'table_rank') plot = chTable(a, big);
    else if (w === 'bar_group') { const o = chBarGroup(a, big); plot = o.html; legend = o.legend; }
    else plot = chTable(a, big);
  } catch (e) { plot = chTable(a, big); }

  const deltaHtml = hl.delta != null
    ? `<span class="dpill ${hl.delta >= 0 ? 'up' : 'dn'}">${hl.delta >= 0 ? '+' : ''}${hl.delta.toFixed(1)}%</span>
       <span class="note">${esc(hl.dnote)}${hl.scope && hl.scope !== '전체' ? ' · ' + esc(short(hl.scope, 8)) : ''}</span>`
    : (hl.note ? `<span class="dpill">${esc(hl.note)}</span>` : '');

  const legHtml = legend && legend.length > 1
    ? `<div class="legend">` + legend.slice(0, 4).map(l => `<span><i style="background:${l.c}"></i>${esc(short(l.n, 10))}</span>`).join('') + `</div>` : '';

  const kw = [ch.head, r.q.join(' '), rep.title, rep.tag,
    a.cols.map(axname).join(' '), a.measures.map(mname).join(' '), r.widget, r.nucleus].join(' ').toLowerCase();

  return `<a class="card s${ch.size}" href="bk21-report.html?r=${rep.id}&c=${ch.rid}" data-kw="${esc(kw)}" data-rep="${rep.id}" data-w="${r.widget}">
    <div class="hd">
      <div><div class="ttl">${esc(ch.head)}</div>
        <div class="sub">${esc(a.cols.map(axname).join(' × '))} · ${esc(mname(a.measures[0]))}</div></div>
      <span class="rep ${rep.tone}">${esc(rep.tag)}</span>
    </div>
    <div class="big"><span class="v">${fmt(hl.v, hl.u)}</span><span class="u">${esc(hl.u || '')}</span></div>
    <div class="pillrow">${deltaHtml}</div>
    ${legHtml}
    <div class="plot">${plot}</div>
    <div class="ft"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#8b97a0" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      ${esc(S.built)} 기준 · ${a.n.toLocaleString()}행<span class="g">보고서 열기 →</span></div>
  </a>`;
}

/* ══════════ 렌더 ══════════ */
let FILTER = 'all', QUERY = '';
function render() {
  const g = $('#grid'); let html = '', tiles = 0, reps = 0;
  RPT.forEach(rep => {
    if (FILTER !== 'all' && FILTER !== rep.id) return;
    const cards = rep.charts.map(c => tile(rep, c)).filter(Boolean);
    const shown = cards.filter(h => !QUERY || h.indexOf('data-kw="') < 0 || (h.match(/data-kw="([^"]*)"/) || ['', ''])[1].includes(QUERY));
    if (!shown.length) return;
    reps++; tiles += shown.length;
    html += `<div class="sec"><i style="background:var(--${rep.tone === 'green' ? 'g' : rep.tone})"></i>
      <h2>${esc(rep.title)}</h2><span>${esc(rep.sub)} · 차트 ${shown.length}</span>
      <a href="bk21-report.html?r=${rep.id}">보고서 보기</a></div>` +
      `<div class="bento">` + shown.join('') + `</div>`;
  });
  g.innerHTML = html || `<div class="empty">찾는 위젯이 없습니다. 다른 말로 검색해 보세요.</div>`;
  $('#cn').textContent = tiles; $('#rn').textContent = reps;
}
function chips() {
  const c = $('#chips');
  c.innerHTML = `<button class="chip all q ${FILTER === 'all' ? 'on' : ''}" data-f="all">
      <span class="dot" style="background:var(--g)"></span>전체 보고서</button>` +
    RPT.map(r => `<button class="chip q ${FILTER === r.id ? 'on' : ''}" data-f="${r.id}">
      <span class="dot" style="background:var(--${r.tone === 'green' ? 'g' : r.tone})"></span>${esc(r.title)}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b => b.onclick = () => { FILTER = b.dataset.f; chips(); render(); });
}
$('#q').addEventListener('input', e => { QUERY = e.target.value.trim().toLowerCase(); render(); });
$('#clr').onclick = () => { $('#q').value = ''; QUERY = ''; render(); $('#q').focus(); };
chips(); render();

/* ══════════ 질문하기 — 심플모드 전체화면 ══════════ */
const smAsk=$('#smAsk'), smIn=$('#smAskInput'), smClr=$('#smAskClear'), smSt=$('#smState');

/* 고를 수 있는 차트 전부를 목록으로 만든다. 서버 라우팅과 낱말 매칭이 같은 목록을 본다. */
const MENU = (() => {
  const out = [];
  RPT.forEach(rep => rep.charts.forEach(ch => {
    const r = S.recipes.find(x => x.id === ch.rid); if (!r) return;
    const a = A(ch.rid); if (!a) return;
    out.push({ id: rep.id + '|' + ch.rid, rep: rep.id, rid: ch.rid,
      q: ch.head + ' — ' + (r.q[0] || ''),
      kw: [ch.head, r.q.join(' '), rep.title, rep.tag,
           a.cols.map(axname).join(' '), a.measures.map(mname).join(' ')].join(' ').toLowerCase() });
  }));
  return out;
})();

const SUGGEST = ['어느 학과가 논문을 많이 썼나', '우리 대학은 국내에서 몇 위인가',
  '성과가 몇 사람에게 몰려 있나', 'AI 논문이 늘고 있나',
  '어느 학과끼리 같이 쓰나', '기록이 덜 붙은 학과는 어디인가'];

function smOpen() {
  smAsk.classList.add('open'); smSt.textContent = '';
  $('#smSug').innerHTML = SUGGEST.map(t => `<button class="sm-chip">${esc(t)}</button>`).join('');
  $('#smSug').querySelectorAll('.sm-chip').forEach(b =>
    b.onclick = () => { smIn.value = b.textContent; smToggleClr(); smGo(); });
  setTimeout(() => { smIn.focus(); const v = smIn.value; smIn.value = ''; smIn.value = v; smToggleClr(); }, 90);
}
function smClose() { smAsk.classList.remove('open'); }
function smToggleClr() { smClr.classList.toggle('show', !!smIn.value); }

/* 낱말 매칭 — 서버가 없거나 키가 없을 때 쓰는 길. 값은 이미 계산된 표에서만 온다. */
function smLocal(q) {
  const toks = q.toLowerCase().replace(/[?？.,]/g, ' ').split(/\s+/).filter(t => t.length > 1);
  if (!toks.length) return null;
  let best = null, bs = 0;
  MENU.forEach(m => {
    let sc = 0;
    toks.forEach(t => { if (m.kw.indexOf(t) >= 0) sc += 1; 
      if (t.length > 2 && m.kw.indexOf(t.slice(0, t.length - 1)) >= 0) sc += .4; });
    if (sc > bs) { bs = sc; best = m; }
  });
  return bs >= 1 ? best : null;
}
function smGoto(m, q) {
  location.href = `bk21-report.html?r=${m.rep}&c=${m.rid}&q=${encodeURIComponent(q)}`;
}

function smGo() {
  const q = smIn.value.trim(); if (!q) return;
  smSt.textContent = '질문을 읽는 중…';
  const menu = MENU.map(m => ({ id: m.id, q: m.q }));
  const done = (m) => { if (m) smGoto(m, q); };
  const fallback = () => {
    const m = smLocal(q);
    if (m) { smSt.textContent = '찾았습니다. 보고서를 엽니다.'; done(m); }
    else { smSt.textContent = ''; smClose(); QUERY = q.toLowerCase(); $('#q').value = q; render(); }
  };
  let settled = false;
  const tmr = setTimeout(() => { if (!settled) { settled = true; fallback(); } }, 6000);
  fetch('/api/bk21/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q, menu }) })
    .then(r => r.json())
    .then(o => {
      if (settled) return; settled = true; clearTimeout(tmr);
      const hit = o && o.ok && MENU.find(m => m.id === o.id);
      if (hit) { smSt.textContent = '찾았습니다. 보고서를 엽니다.'; smGoto(hit, q); }
      else fallback();
    })
    .catch(() => { if (settled) return; settled = true; clearTimeout(tmr); fallback(); });
}

$('#openAsk').onclick = smOpen;
$('#smAskX').onclick = smClose;
smClr.onclick = () => { smIn.value = ''; smToggleClr(); smIn.focus(); };
smIn.addEventListener('input', smToggleClr);
smIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); smGo(); }
  if (e.key === 'Escape') { e.preventDefault(); smClose(); }
});
smAsk.addEventListener('click', e => { if (e.target === smAsk) smClose(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== smIn && document.activeElement !== $('#q')) {
    e.preventDefault(); smOpen();
  }
  if (e.key === 'Escape' && smAsk.classList.contains('open')) smClose();
});
</script>
</body></html>
