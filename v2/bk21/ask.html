<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>BK21 물어보기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b16;--ink:#e6edfb;--dim:#8ea3c9;--dim2:#647ba0;
 --line:rgba(120,160,235,.18);--card:rgba(20,31,58,.72);--acc:#5fd0c8;--gold:#f0b429;--warn:#e0864f}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
 font:15px/1.75 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:#7fa9e0}
.page{max-width:900px;margin:0 auto;padding:0 24px}

/* 스텝1 */
#step1{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:60px 0}
.kick{font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#5f7db3}
h1{margin-top:14px;font-size:31px;font-weight:800;letter-spacing:-.9px}
.askbox{margin-top:26px;display:flex;gap:10px}
.askbox input{flex:1;background:rgba(10,16,32,.8);border:1px solid var(--line);border-radius:13px;
 padding:16px 18px;color:var(--ink);font-size:16px;font-family:inherit;outline:none}
.askbox input:focus{border-color:rgba(95,208,200,.55)}
.askbox button{background:rgba(95,208,200,.15);border:1px solid rgba(95,208,200,.5);color:#adeae4;
 border-radius:13px;padding:0 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.askbox button:hover{background:rgba(95,208,200,.25)}
.lbl{margin-top:30px;font:800 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#7796c9}
.qlist{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.qi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 17px;
 cursor:pointer;font-size:15px;font-weight:600;transition:border-color .15s,background .15s}
.qi:hover{border-color:rgba(95,208,200,.5);background:rgba(28,42,78,.8)}
.more{margin-top:12px;background:none;border:none;color:#7fa9e0;font:600 13.5px/1 inherit;
 cursor:pointer;padding:6px 0}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
 font:600 11.5px/1.8 ui-monospace,Menlo,monospace;color:#5f7db3}

/* 스텝2 */
#step2{display:none;padding:34px 0 80px}
.back{background:none;border:none;color:#7fa9e0;font:600 13.5px/1 inherit;cursor:pointer;padding:6px 0}
.rep{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sec{padding:22px 24px;border-bottom:1px solid rgba(120,160,235,.12)}
.sec:last-child{border-bottom:none}
.sn{font:800 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#7796c9}
.won{margin-left:9px;font:800 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;
 color:var(--gold);background:rgba(240,180,41,.13);border:1px solid rgba(240,180,41,.35);
 border-radius:6px;padding:4px 8px;vertical-align:1px}
.concl{margin-top:11px;font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.5}
.ev{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.evi{background:rgba(10,16,32,.7);border:1px solid var(--line);border-radius:11px;padding:11px 15px;min-width:140px}
.evi .l{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;color:var(--dim2)}
.evi .v{margin-top:6px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.evi .s{margin-top:4px;font-size:11.5px;color:var(--dim)}
.chart{margin-top:13px}
.bar{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;margin-bottom:6px;font-size:13.5px}
.bar .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{background:rgba(10,16,32,.7);border-radius:5px;height:19px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,rgba(95,208,200,.75),rgba(95,208,200,.35))}
.bar.me .nm{color:var(--gold);font-weight:700}
.bar.me .fl{background:linear-gradient(90deg,rgba(240,180,41,.8),rgba(240,180,41,.35))}
.bar .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.t th{text-align:left;font:800 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
 color:var(--dim2);padding:0 12px 9px 0;border-bottom:1px solid var(--line)}
table.t td{padding:9px 12px 9px 0;border-bottom:1px solid rgba(120,160,235,.08);color:var(--dim)}
table.t td:first-child{color:var(--ink);font-weight:600}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.lim{margin-top:10px;font-size:13.5px;color:#d3a566;line-height:1.75}
.lim div{margin-bottom:3px}
.src{margin-top:10px;font:600 12.5px/1.9 ui-monospace,Menlo,monospace;color:var(--dim2);word-break:break-all}
.acts{padding:18px 24px;display:flex;gap:9px;flex-wrap:wrap;background:rgba(10,16,32,.5)}
.acts button{background:rgba(20,31,58,.9);border:1px solid var(--line);color:var(--ink);
 border-radius:10px;padding:10px 16px;font:600 13.5px/1 inherit;cursor:pointer}
.acts button:hover{border-color:rgba(95,208,200,.5)}
.acts button:disabled{opacity:.5;cursor:default}
.acts button.sec2{color:var(--dim)}
.tag2{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--gold);
 background:rgba(240,180,41,.12);border-radius:5px;padding:3px 6px;margin-left:5px}
.pt{margin-top:8px;font-size:14.5px;color:var(--dim);line-height:1.7}
.pt.cau{color:#d3a566;margin-top:11px}
.skinwrap{margin-top:12px;position:relative;overflow:hidden;border-radius:10px;
 background:#0a0f1d;border:1px solid var(--line)}
.skinwrap iframe{border:0;display:block;background:transparent}
.foc{margin-top:9px;font-size:12.5px;color:var(--acc)}
.chartbox{margin-top:12px;background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:14px}
.chartbox svg{--grid:rgba(120,160,235,.14);--dim2:#8ea3c9;
 --u1:#5fd0c8;--u2:#7aa2f7;--u3:#f0b429;--u4:#c99bf5;--u5:#6fd08c;--u6:#f08a7a;--u7:#8fb4e8}
.legend{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
.axl{margin-top:9px;font-size:12px;color:var(--dim2)}
.blk{border-color:rgba(224,134,79,.45)}
.blk .concl{color:#f0a877}
@media (max-width:640px){
 h1{font-size:25px}.askbox{flex-direction:column}.askbox button{padding:14px}
 .bar{grid-template-columns:104px 1fr 66px;font-size:12.5px}
 .concl{font-size:17px}}
</style></head><body>

<div id="step1" class="page">
  <div class="kick">BIBLO · BK21</div>
  <h1>무엇이 궁금하십니까</h1>
  <div class="askbox">
    <input id="q" placeholder="예) 어느 학과가 처져 있나" autocomplete="off">
    <button id="go">묻기</button>
  </div>
  <div class="lbl">자주 묻는 것</div>
  <div class="qlist" id="front"></div>
  <button class="more" id="more">더 보기</button>
  <div class="qlist" id="rest" style="display:none"></div>
  <div class="foot" id="meta"></div>
</div>

<div id="step2" class="page">
  <button class="back" id="back">← 다시 묻기</button>
  <div class="rep" id="rep"></div>
</div>

)은 원천이 학사 시스템이라 아직 받지 않았습니다.</div>\n  <div class=\"kpis gyrow\" data-rows=\"\"><div class=\"kpi gycard\" data-gy=\"이공\" style=\"--c:var(--g5s)\">\n    <div class=\"lb\" data-slot=\"0\">이공</div>\n    <div class=\"vl\" data-slot=\"1\">33,285.5</div>\n    <div class=\"dt\">1인당 <b data-slot=\"2\">141.0</b></div>\n    <div class=\"gband\"><i class=\"g6\" style=\"flex:1544\" title=\"등급 6 · 1,544편\"></i><i class=\"g5\" style=\"flex:1923\" title=\"등급 5 · 1,923편\"></i><i class=\"g4\" style=\"flex:2589\" title=\"등급 4 · 2,589편\"></i><i class=\"g3\" style=\"flex:2236\" title=\"등급 3 · 2,236편\"></i><i class=\"g2\" style=\"flex:1718\" title=\"등급 2 · 1,718편\"></i><i class=\"g0\" style=\"flex:492\" title=\"미판정 · 492편\"></i></div>\n    <div class=\"dt rqx\">학술지 <b data-slot=\"3\">31,534</b>\n     · 학술대회 <b data-slot=\"4\">1,020</b> · AI <b data-slot=\"5\">732</b></div>\n    <div class=\"dt rqx\">IQ <b data-slot=\"6\">9,902</b>\n     <span class=\"sub2\" data-slot=\"7\">국제공동 4,951편</span>\n     · SQ <b data-slot=\"8\">582</b>\n     <span class=\"sub2\" data-slot=\"9\">산학 582편</span></div>\n    <div class=\"dt\" data-slot=\"10\">학과 12 · 교수 236명 · 학생 1,528명</div>\n    <div class=\"dt\" data-slot=\"11\">미판정 492</div>\n   </div></div>\n  <div id=\"gyOpen\"></div></div>","slots":12,"hints":[{"i":0,"cls":"lb","was":"이공","num":false},{"i":1,"cls":"vl","was":"33,285.5","num":true},{"i":2,"cls":"B","was":"141.0","num":true},{"i":3,"cls":"B","was":"31,534","num":true},{"i":4,"cls":"B","was":"1,020","num":true},{"i":5,"cls":"B","was":"732","num":true},{"i":6,"cls":"B","was":"9,902","num":true},{"i":7,"cls":"sub2","was":"국제공동 4,951편","num":false},{"i":8,"cls":"B","was":"582","num":true},{"i":9,"cls":"sub2","was":"산학 582편","num":false},{"i":10,"cls":"dt","was":"학과 12 · 교수 236명 · 학생","num":false},{"i":11,"cls":"dt","was":"미판정 492","num":false}]},"exec_02":{"html":"<div class=\"ecard\" id=\"radarCard\" data-cid=\"exec-c02\"><h3 data-title=\"\">역량 레이더 — 4개 영역\n   <span class=\"pill in\">매뉴얼 결과조회 화면과 같은 구성</span></h3>\n  <div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">도형이 넓을수록 그 방향의 실적이 많습니다. 세 계열 모두\n      <b>연구(RQ) 쪽으로 길게 뻗고</b> 사회기여(SQ) 쪽이 짧습니다.\n      가장 짧은 곳은 <em>인문사회</em>(산학협력 23편)입니다.\n      <b>LQ(교육역량)</b> 축이 비어 있는 것은 실적이 없다는 뜻이 아니라\n      <b>자료를 아직 받지 못했다</b>는 뜻입니다.</div></div>\n  <div class=\"d\">SGCPI+ 는 총점이 아니라 <b>네 방향 중 어디가 눌려 있는가</b>를 보는 지수입니다.\n   값이 없는 축은 0 이 아니라 <b>미수집</b>으로 둡니다 — 실적이 없는 것과 자료를 안 받은 것은 다릅니다.</div>\n  <div class=\"radwrap\">\n   <div class=\"radbox\"><svg viewBox=\"0 0 300 300\" class=\"radar\" role=\"img\" aria-label=\"역량 레이더\"><polygon points=\"150,120 180,150 150,180 120,150\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"></polygon><polygon points=\"150,90 210,150 150,210 90,150\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"></polygon><polygon points=\"150,60 240,150 150,240 60,150\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"></polygon><polygon points=\"150,30 270,150 150,270 30,150.00000000000003\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"></polygon><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"30\" stroke=\"var(--c3)\" stroke-width=\"1\"></line><line x1=\"150\" y1=\"150\" x2=\"270\" y2=\"150\" stroke=\"var(--line)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"></line><line x1=\"150\" y1=\"150\" x2=\"150\" y2=\"270\" stroke=\"var(--c3)\" stroke-width=\"1\"></line><line x1=\"150\" y1=\"150\" x2=\"30\" y2=\"150.00000000000003\" stroke=\"var(--c3)\" stroke-width=\"1\"></line><polygon points=\"150,30 150,270 30,150.00000000000003\" fill=\"var(--s-green)\" fill-opacity=\"0.14\" stroke=\"var(--s-green)\" stroke-width=\"2\" stroke-linejoin=\"round\"></polygon><circle cx=\"150\" cy=\"30\" r=\"3\" fill=\"var(--s-green)\"></circle><circle cx=\"150\" cy=\"270\" r=\"3\" fill=\"var(--s-green)\"></circle><circle cx=\"30\" cy=\"150.00000000000003\" r=\"3\" fill=\"var(--s-green)\"></circle><polygon points=\"150,53.89016317945038 150,245.1654311789905 96.97881355932203,150\" um":true}]},"exec_04":{"html":"<div class=\"ecard\" data-cid=\"exec-c04\"><h3 data-title=\"\">연구단 신호등 <span class=\"pill in\">내부 관리기준 · 계열 내 상대위치</span></h3><div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">학과를 같은 계열끼리만 견줍니다. 이공계와 인문사회를 같은 자로 재면\n   논문 수가 많은 이공계가 늘 이기기 때문입니다. 초록은 계열 안에서 위쪽,\n   빨강은 아래쪽이라는 뜻이고 <b>합격·탈락 기준이 아닙니다</b>.\n   빨강이 뜬 학과는 먼저 <b>기록이 제대로 붙었는지</b>부터 보십시오.</div></div>\n  <div class=\"trk\">\n   <div class=\"tk a\"><b>트랙 A · 교수 연구의 질</b>\n    <p>참여교수마다 <b>대표논문 3편</b>(FWCI 상위 3편)의 평균을 내고, 그 값의 <b>학과 중앙값</b>입니다.\n     FWCI는 같은 분야·연도 평균을 1로 놓은 값입니다. 논문 수가 적어도 대표작으로 재기 때문에 <b>최소 편수 컷을 두지 않습니다</b>.</p></div>\n   <div class=\"tk b\"><b>트랙 B · 대학원생 성과</b>\n    <p>대학원생이 <b>제1저자·교신저자로 낸 논문의 1인당 건수</b>. 학생이 스스로 실적을 내고 있는지 봅니다.</p></div>\n   <div class=\"tk w\"><b>종합은 낮은 쪽</b>\n    <p>BK21은 두 트랙을 <b>따로</b> 채점합니다. 한쪽이 바닥이면 전체가 흔들리므로 종합 신호는 <b>두 트랙 중 낮은 쪽</b>을 씁니다.</p></div>\n  </div>\n  <div class=\"d\"><b>공식 평가 등급이 아닙니다.</b> 지표는 <b>분야·연도 보정</b>을 거친 값(FWCI · PP top10% · JCR 분야순위)만 씁니다 —\n   저널 IF로 개인·논문을 평가하지 않습니다(DORA). 같은 계열(인문사회·이공·의약생명) 안에서의 상대위치를\n   <b>양호</b>(상위 50% 이상) · <b>관찰</b>(상위 50~75%) · <b>개선 우선</b>(하위 25%)으로 표시합니다. 분야 관행 차이를 흡수하기 위해 계열 안에서만 비교합니다.\n   <b>데이터</b> 칸이 <b>보완 필요</b>인 학과는 수치가 아직 덜 모인 상태라 정비 후 신호가 바뀔 수 있습니다.</div>\n  <div class=\"fl\" id=\"fl\" style=\"margin-bottom:10px\"><button class=\"fbtn on\" data-f=\"all\">전체 28</button><button class=\"fbtn \" data-f=\"개선 우선\">개선 우선 10</button><button class=\"fbtn \" data-f=\"관찰\">관찰 10</button><button class=\"fbtn \" data-f=\"양호\">양호 8</button><button class=\"fbtn \" data-f=\"q\">데이터 보완 9</button></div>\n  <div style=\"overflow:auto;max-height:560px\"><table class=\"mtx sigx\" id=\"sigT\"><colgroup><col style=\"width:17%\"><col style=\"width:6%\"><col style=\"width:8%\"><col style=\"width:8%\"><col style=\"width:7%\"><col style=\"width:7%\"><col style=\"width:6%\"><col style=\"width:6%\"><col style=\"width:7%\"><col style=\"width:7%\"><col style=\"width:6%\"><col style=\"w r(--accent)\"></i>\n     <b>27,221</b></span>\n   </div>\n   <div class=\"ur \" title=\"전북대 · 국제 15위 49,541편 · 국내 12위 26,945편\">\n    <span class=\"rk\">12</span>\n    <span class=\"nm\">전북대</span>\n    <span class=\"bar\"><i style=\"width:31%;background:var(--u0)\"></i>\n     <b>26,945</b></span>\n   </div>\n   <div class=\"ur \" title=\"울산대 · 국제 10위 65,403편 · 국내 13위 14,435편\">\n    <span class=\"rk\">13</span>\n    <span class=\"nm\">울산대</span>\n    <span class=\"bar\"><i style=\"width:17%;background:var(--u0)\"></i>\n     <b>14,435</b></span>\n   </div>\n   <div class=\"ur \" title=\"카이스트 · 국제 5위 118,144편 · 국내 14위 8,593편\">\n    <span class=\"rk\">14</span>\n    <span class=\"nm\">카이스트</span>\n    <span class=\"bar\"><i style=\"width:10%;background:var(--u5)\"></i>\n     <b>8,593</b></span>\n   </div>\n   <div class=\"ur \" title=\"포스텍 · 국제 12위 56,610편 · 국내 15위 3,223편\">\n    <span class=\"rk\">15</span>\n    <span class=\"nm\">포스텍</span>\n    <span class=\"bar\"><i style=\"width:4%;background:var(--u6)\"></i>\n     <b>3,223</b></span>\n   </div></div></div>\n  </div>\n  <div class=\"d\" style=\"margin:10px 0 0\"><b>성균관대</b>는 국제 <b>3위</b>(129,315편)인데 국내는 <b>11위</b>(27,221편)입니다.\n   선이 아래로 크게 내려가는 학교일수록 국제 학술지에 몰려 있습니다.</div>\n   <div class=\"d\" style=\"margin:10px 0 0\">카이스트·포스텍이 국내에서 낮게 나오는 것은 <b>연구를 못 해서가 아닙니다.</b>\n    국내 학술지에 잘 내지 않고 국제 학술지에 집중하기 때문입니다. 실제로 OpenAlex에서 보면 이 두 학교의 논문 한 편당 파급력이 오히려 가장 높습니다.\n    <b>한쪽만 보고 판단하면 이런 사실을 놓칩니다.</b></div></div>","slots":3,"hints":[{"i":0,"cls":"rk","was":"1","num":true},{"i":1,"cls":"nm","was":"서울대","num":false},{"i":2,"cls":"B","was":"249,187","num":true}]},"univ_05":{"html":"<div class=\"ecard\" data-cid=\"univ-c05\"><h3 data-title=\"\">BK 학과 vs 그 외 학과 <span class=\"pill in\">성균관대 한정</span></h3><div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">사업에 참여한 학과와 아닌 학과를 갈라 봅니다. <b>사업이 실제로 차이를 만들었는지</b> 확인하는 자리입니다.</div></div>\n   <div class=\"d\" data-rows=\"\">BK 사업에 참여하는 <b data-slot=\"0\">34개 학과</b> =\"463.0\" y=\"63.1\" width=\"15.1\" height=\"226.9\" rx=\"2.5\" fill=\"var(--accent)\"><title>2024년 BK 34학과 0.62편</title></rect><rect x=\"480.2\" y=\"208.8\" width=\"15.1\" height=\"81.2\" rx=\"2.5\" fill=\"var(--c4)\"><title>2024년 그 외 학과 0.22편</title></rect><rect x=\"507.6\" y=\"47.1\" width=\"15.1\" height=\"242.9\" rx=\"2.5\" fill=\"var(--accent)\"><title>2025년 BK 34학과 0.66편</title></rect><rect x=\"524.7\" y=\"200.3\" width=\"15.1\" height=\"89.7\" rx=\"2.5\" fill=\"var(--c4)\"><title>2025년 그 외 학과 0.25편</title></rect><text x=\"523.7\" y=\"305\" text-anchor=\"middle\">2025</text><line x1=\"56\" y1=\"290\" x2=\"546\" y2=\"290\" stroke=\"var(--line)\"></line></svg><div class=\"ubn\"><b>2015년</b> BK 0.51 · 그 외 0.13 <span>(4.0배)</span>\n    &nbsp;→&nbsp; <b>2025년</b> BK 0.66 · 그 외 0.25 <span>(2.7배)</span></div>\n   <div class=\"d\" style=\"margin:8px 0 0\">인원 차이를 지운 값입니다. BK 학과 연구자 한 사람이 해마다 몇 편을 냈는지입니다.\n   </div>\n   <div class=\"d\" style=\"margin:7px 0 0\"><b>주의</b> · BK 34학과에 이공·의약생명이 몰려 있어 분야 관행 차이가 섞여 있습니다.\n    분야 보정 없이 우열로 읽으면 안 됩니다. 이 비교는 <b>성균관대 안에서만</b> 됩니다 — 다른 학교는 학과별 로스터도 BK 학과 명단도 없습니다.</div></div></div>","slots":1,"hints":[{"i":0,"cls":"(행)","was":"34개 학과","num":false}]},"univ_06":{"html":"<div class=\"ecard\" data-cid=\"univ-c06\"><h3 data-title=\"\">대학별 강점 주제 <span class=\"pill off\">OpenAlex 주제</span></h3><div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">각 대학이 <b>어느 주제에 몰려 있는지</b>입니다. 우리와 겹치는 대학이 경쟁 상대이고, 안 겹치는 대학이 협력 상대입니다.</div></div>\n  <div class=\"d\">학교마다 논문이 가장 많이 쌓인 연구 주제입니다. OpenAlex에는 학과 구조가 없어, <b>학과 대신 주제로 학교의 색깔</b>을 봅니다.\n   막대 길이는 그 학교 안에서의 상대 규모이고, 색은 상위 분야입니다.</div>\n  <div class=\"fl\" id=\"utf\"><button class=\"fbtn \" data-ut=\"서울대\">서울대</button><button class=\"fbtn \" data-ut=\"연세대\">연세대</button><button class=\"fbtn on\" data-ut=\"성균관대\">성균관대</button><button class=\"fbtn \" data-ut=\"고려대\">고려대</button><button class=\"fbtn \" data-ut=\"카이스트\">카이스트</button><button class=\"fbtn \" data-ut=\"포스텍\">포스텍</button><button class=\"fbtn \" data-ut=\"한양대\">한양대</button></div>\n  <div id=\"utopics\"><div class=\"dev\" data-rows=\"\"><div class=\"dl\"><div class=\"n\" style=\"flex:0 0 320px\" title=\"Particle physics theoretical and experimental studies\" data-slot=\"0\">Particle physics theoretical and experimental studies</div>\n   <div class=\"bar\"><i style=\"width:100%;background:#3b82f6\"></i></div>\n   <div class=\"v\" data-slot=\"1\">3,170</div></div></div>\n  <div class=\"mxlg\"><span><i style=\"background:#3b82f6\"></i>Physics and Astronomy</span><span><i style=\"background:#6366f1\"></i>Engineering</span><span><i style=\"background:var(--navy)\"></i>Materials Science</span><span><i style=\"background:#0f9c6d\"></i>Medicine</span></div></div></div>","slots":2,"hints":[{"i":0,"cls":"n","was":"Particle physics the","num":false},{"i":1,"cls":"v","was":"3,170","num":true}]},"univ_07":{"html":"<div class=\"ecard\" data-cid=\"univ-c07\"><h3 data-title=\"\">경쟁대학 측정 정보 유무</h3><div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">비교가 안 되는 칸을 밝혀 둡니다. <b>빈칸은 실적이 없는 게 아니라 자료를 못 구한 것</b>입니다.</div></div>\n  <div class=\"d\">경쟁 대학에 대해 우리가 어떤 정보를 가지고 있는지입니다. <b>없는 정보를 있는 것처럼 쓰지 않기 위한 표</b>입니다.</div>\n  <div style=\"overflow:auto\"><table class=\"mtx uvc\">\n  <colgroup><col style=\"width:16%\"><col style=\"width:11%\"><col style=\"width:11%\"><col style=\"width:13%\"><col style=\"width:49%\"></colgroup>\n  <thead><tr><th class=\"l\">측정 축</th><th>OpenAlex</th><th>KCI (우리)</th><th>BIBLO Scholar (성균관)</th><th class=\"l\">근거와 한계</th></tr></thead><tbody data-rows=\"\">\n  <tr><td class=\"l\"><b data-slot=\"0\">학교 단위</b></td>\n    <td><span class=\"sg sg-ok\" data-slot=\"1\">가능</span></td>\n    <td><span class=\"sg sg-ok\" data-slot=\"2\">가능</span></td>\n    <td><span class=\"sg sg-sm\" data-slot=\"3\">해당없음</span></td>\n    <td class=\"l dg\" data-slot=\"4\">OpenAlex는 기관 ID로 즉시·정확, KCI는 소속 텍스트로 주도논문 집계</td></tr>\n  </tbody></table></div>\n  <div class=\"sub-t\">어디서 가져온 자료인가</div>\n  <div class=\"usrc\"><b>OpenAlex</b><span>국제·전분야, 전체 저자, 판별된 연구자. 학교 연구력의 표준 척도</span><code>GET /institutions/{id} · /works?filter=institutions.id · /authors?filter=last_known_institutions.id</code></div><div class=\"usrc\"><b>KCI (우리 논문 모음)</b><span>국내 도메인, 주저자 중심, 이름 기반. 국내 실적 보강</span><code>biblo_aws paper.paper · paper.paper_author · paper_uid LIKE 'kci:%' · 저자행 2,398,395(소속 채움 97%)</code></div><div class=\"usrc\"><b>BIBLO Scholar (성균관)</b><span>재직·학과 확정. 학과·BK 세분의 유일한 정확 근거</span><code>dev.researcher · bk.program(34학과) · bk.researcher_tag</code></div>\n  <div class=\"d\" style=\"margin:11px 0 0\"><b>권장 구성</b> · 학교 간 비교의 뼈대는 OpenAlex로 세우고 국내 실적은 KCI로 덧댑니다.\n   학과·BK여부 세분은 성균관대 내부로 한정하거나, 다른 학교의 연구자 로스터를 확보한 뒤 넓힙니다.</div></div>","slots":5,"hints":[{"i":0,"cls":"B","was":"학교 단위","num":false},{"i":1,"cls":"sg sg-ok","was":"가능","num":false},{"i":2,"cls":"sg sg-ok","was":"가능","num":false},{"i":3,"cls":"sg sg-sm","was":"해당없음","num":false},{"i":4,"cls":"l dg","was":"OpenAlex는 기관 ID로 즉시·","num":false}]},"sheet_01":{"html":"<div class=\"ecard\" data-cid=\"sheet-c01\"><h3 data-title=\"\">국내 7개 대학 순위비교 <span class=\"pill in\">규모 · 파급력 상세</span></h3><div class=\"insight\">\n <span class=\"ic\">→</span><div class=\"tx\">같은 잣대로 <b>일곱 대학을 나란히</b> 놓은 표입니다. 우리 순위 자체보다 <b>어느 항목에서 밀리는가</b>를 보십시오. SGCPI+ 환산점수 칸은 성균관대만 채워집니다 — 다른 대학은 그 기준으로 계산할 자료가 우리에게 없습니다.</div></div>\n  <div class=\"d\">지표마다 7개교 중 몇 위인지입니다. <b>1위는 진한 색, 2위는 옅은 색, 하위 2개는 회색</b>입니다.\n   왼쪽 파란 묶음이 <b>규모</b>, 가운데 초록이 <b>파급력</b>, 오른쪽 보라가 <b>국내</b>입니다.\n   <b>규모와 파급력의 순위가 갈리는 학교</b>가 이 표의 요점입니다.</div>\n  <div style=\"overflow:auto\"><table class=\"mtx rkx\">\n  <colgroup><col style=\"width:7%\"><col style=\"width:12%\"><col style=\"width:7%\"><col style=\"width:6%\"><col style=\"width:6%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width:6.2%\"><col style=\"width const $=s=>document.querySelector(s);
const N=v=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:2}):v);
const MET=SPEC.metrics, AXN=SPEC.axes;
/* 받침이 있으면 은/이/을, 없으면 는/가/를 */
const DIGJONG={'0':1,'1':1,'2':0,'3':1,'4':0,'5':0,'6':1,'7':1,'8':1,'9':0};
const DIGRIEUL={'1':1,'7':1,'8':1};
function jo(w,kind){
 const t=String(w).trim(), last=t.slice(-1);
 if(/[0-9]/.test(last)){
  if(kind==='로') return DIGRIEUL[last]||!DIGJONG[last]?'로':'으로';
  const h=DIGJONG[last];
  return kind==='은'?(h?'은':'는'):kind==='이'?(h?'이':'가'):(h?'을':'를');
 }
 const c=t.slice(-1).charCodeAt(0);
 const has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:true;
 if(kind==='로'){ // ㄹ 받침이면 '로', 그 밖의 받침이면 '으로'
  if(c<0xAC00||c>0xD7A3) return '로';
  const j=(c-0xAC00)%28; return (j===0||j===8)?'로':'으로'; }
 return kind==='은'?(has?'은':'는'):kind==='이'?(has?'이':'가'):(has?'을':'를');
}
const OK=SPEC.recipes.filter(r=>!r.blocked && SPEC.answers[r.id]);
const ME='성균관대';

/* ── 스텝1 ── */
function qcard(r){return `<div class="qi" data-id="${r.id}">${r.q[0]}</div>`;}
$('#front').innerHTML=SPEC.front.map(id=>SPEC.recipes.find(r=>r.id===id)).filter(Boolean).map(qcard).join('');
$('#rest').innerHTML=OK.filter(r=>!SPEC.front.includes(r.id)).map(qcard).join('');
$('#more').onclick=()=>{const e=$('#rest');const on=e.style.display==='none';
 e.style.display=on?'flex':'none';$('#more').textContent=on?'접기':'더 보기';};
$('#meta').textContent=`${SPEC.built} 기준 · 논문 31,076편 · 참여자 2,959명 · 성과기간 ${SPEC.period.default}`
 +` · 답할 수 있는 질문 ${OK.length}개`;
document.addEventListener('click',e=>{const c=e.target.closest('.qi');if(c)open(c.dataset.id);});
$('#go').onclick=()=>route($('#q').value.trim());
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')route($('#q').value.trim());});

/* 질문 → 레시피. 서버가 LLM 으로 고르고, 안 되면 낱말 겹침으로 돌아간다.
   LLM 은 id 하나만 고른다. 숫자와 결론 문장은 아래에서 데이터로 만든다. */
let BUSY=false;
async function route(t){
 if(!t||BUSY) return;
 BUSY=true; const btn=$('#go'), old=btn.textContent; btn.textContent='찾는 중'; btn.disabled=true;
 try{
  const menu=OK.map(r=>({id:r.id,q:r.q[0]}));
  const res=await fetch('/api/bk21/ask',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({q:t,menu})});
  const o=await res.json();
  if(o&&o.ok&&o.id&&SPEC.answers[o.id]){ open(o.id,{focus:o.focus||[],q:t,cost:o.cost}); return; }
 }catch(e){}
 finally{ BUSY=false; btn.textContent=old; btn.disabled=false; }
 ask(t);
}
$('#back').onclick=()=>{$('#step2').style.display='none';$('#step1').style.display='flex';scrollTo(0,0);};

/* 질문 문장을 레시피로 — 낱말 겹침으로 고른다. 에이전트가 붙으면 이 자리가 바뀐다 */
/* 흔해서 변별력이 없는 낱말. 이것만 겹치면 아무 데나 걸린다 */
const STOP=new Set(['어느','어떤','무엇','누가','얼마나','많이','쓰나','있나','되나','인가',
 '우리','지금','최근','정도','어디','그리고','하는','한가','좋은','논문','대학','학과']);
function ask(t){
 if(!t) return;
 const toks=t.replace(/[^가-힣a-zA-Z0-9 ]/g,' ').split(/\s+/)
   .filter(w=>w.length>1 && !STOP.has(w));
 if(!toks.length){ noMatch(t); return; }
 let best=null,bs=0;
 for(const r of SPEC.recipes){
  if(r.blocked||!SPEC.answers[r.id]) continue;
  const q=r.q.join(' ').toLowerCase();
  const side=(r.axes.map(a=>AXN[a]).join(' ')+' '
   +r.measures.map(m=>(MET[m]||{}).n||'').join(' ')+' '
   +Object.values(r.filters||{}).join(' ')).toLowerCase();
  let s=0;
  toks.forEach(w=>{const lw=w.toLowerCase();
   if(q.includes(lw)) s+=w.length*3; else if(side.includes(lw)) s+=w.length*2;});
  if(s>bs){bs=s;best=r;}
 }
 if(!best||bs<5){ noMatch(t); return; }
 open(best.id);
}
function noMatch(t){
 $('#step1').style.display='none';$('#step2').style.display='block';scrollTo(0,0);
 $('#rep').innerHTML=`<div class="sec blk"><div class="sn">① 결론</div>
  <div class="concl">이 질문에 맞는 레시피가 아직 없습니다</div>
  <div class="lim"><div>물으신 것: ${esc(t)}</div>
   <div>지금 답할 수 있는 질문 ${OK.length}개는 앞 화면에 있습니다.</div></div></div>
  <div class="sec"><div class="sn">원자가 없어 못 만드는 것</div>
   <table class="t"><thead><tr><th>못 만드는 것</th><th>무엇이 오면 되나</th></tr></thead><tbody>
   ${SPEC.uncollected.map(u=>`<tr><td>${u.name}</td><td>${u.need}</td></tr>`).join('')}
   </tbody></table></div>`;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));


/* ── 그림을 다시 그린다 ──
   선그래프·산점도는 숫자가 글자가 아니라 좌표에 들어 있다. 글자만 갈아 끼워서는 안 되고
   선을 다시 그려야 한다. 보드 원본과 같은 문법으로 낸다.
   틀: viewBox 0 0 560 310 · 격자 5줄 · x 52~496 · y 278~16 · 계열색 --u1..u7 */
const CH={x0:52,x1:496,y0:278,y1:16,W:560,H:310};
const nfmt=v=>v>=10000?Math.round(v/1000)+'천':v>=1000?(v/1000).toFixed(1)+'천':
  (Math.round(v*100)/100).toLocaleString();
function chartShell(inner,h){
 return `<svg viewBox="0 0 ${CH.W} ${h||CH.H}" style="width:100%;height:auto;display:block">${inner}</svg>`;
}
function gridY(min,max,n){
 let g='';
 for(let i=0;i<=n;i++){
  const y=CH.y1+(CH.y0-CH.y1)*i/n, v=max-(max-min)*i/n;
  g+=`<line x1="${CH.x0}" y1="${y.toFixed(1)}" x2="${CH.x1}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`
   +`<text x="${CH.x0-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--dim2)">${nfmt(v)}</text>`;
 }
 return g;
}
/* 연도별 선그래프 — 첫 라벨이 계열, 둘째 라벨이 연도 */
function lineChart(rows,ms){
 const two=Array.isArray(rows[0]?.[0])&&rows[0][0].length>=2;
 const ser={}, xs=[];
 rows.forEach(r=>{
  const L=Array.isArray(r[0])?r[0]:[r[0]];
  const name=two?L[0]:(ms[0]||'값'), x=two?L[1]:L[0], v=r[1];
  if(v==null) return;
  (ser[name]=ser[name]||[]).push([x,+v]);
  if(!xs.includes(x)) xs.push(x);
 });
 xs.sort();
 const names=Object.keys(ser).slice(0,7);
 if(!names.length||xs.length<2) return '';
 let max=0,min=0;
 names.forEach(n=>ser[n].forEach(([,v])=>{if(v>max)max=v;}));
 if(!max) return '';
 const X=x=>CH.x0+(CH.x1-CH.x0)*(xs.indexOf(x)/(xs.length-1));
 const Y=v=>CH.y0-(CH.y0-CH.y1)*((v-min)/(max-min||1));
 let g=gridY(min,max,4);
 xs.forEach(x=>{ g+=`<text x="${X(x).toFixed(1)}" y="293" text-anchor="middle" font-size="10" fill="var(--dim2)">${x}</text>`; });
 names.forEach((n,i)=>{
  const pts=ser[n].slice().sort((a,b)=>xs.indexOf(a[0])-xs.indexOf(b[0]));
  const d=pts.map((q,k)=>(k?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
  const col=`var(--u${(i%7)+1},#5fd0c8)`;
  g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(q=>{ g+=`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3" fill="${col}"><title>${esc(n)} ${q[0]} ${nfmt(q[1])}</title></circle>`; });
 });
 const leg=names.map((n,i)=>`<span class="lg"><i style="background:var(--u${(i%7)+1},#5fd0c8)"></i>${esc(n)}</span>`).join('');
 return chartShell(g)+`<div class="legend">${leg}</div>`;
}
/* 산점도 — 값 두 개 */
function scatterChart(rows,ms){
 const pts=rows.map(r=>({n:Array.isArray(r[0])?r[0].join(' '):String(r[0]),x:+r[1],y:+r[2]}))
   .filter(p=>isFinite(p.x)&&isFinite(p.y));
 if(pts.length<2) return '';
 const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
 const xmax=Math.max(...xs)||1, ymax=Math.max(...ys)||1;
 const X=v=>CH.x0+(CH.x1-CH.x0)*(v/xmax), Y=v=>CH.y0-(CH.y0-CH.y1)*(v/ymax);
 let g=gridY(0,ymax,4);
 for(let i=0;i<=4;i++){ const v=xmax*i/4;
  g+=`<text x="${X(v).toFixed(1)}" y="293" text-anchor="middle" font-size="10" fill="var(--dim2)">${nfmt(v)}</text>`; }
 pts.slice(0,60).forEach(p=>{
  const me=p.n.includes(ME);
  g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${me?6:4.5}" `
   +`fill="${me?'var(--gold,#f0b429)':'var(--u1,#5fd0c8)'}" fill-opacity="${me?1:.72}">`
   +`<title>${esc(p.n)} ${nfmt(p.x)} / ${nfmt(p.y)}</title></circle>`;
  if(me) g+=`<text x="${(X(p.x)+9).toFixed(1)}" y="${(Y(p.y)+4).toFixed(1)}" font-size="10.5" fill="var(--gold,#f0b429)">${esc(p.n)}</text>`;
 });
 const lx=(MET[ms[0]]||{}).n||ms[0], ly=(MET[ms[1]]||{}).n||ms[1];
 return chartShell(g)+`<div class="axl">가로 ${esc(lx)} · 세로 ${esc(ly)}</div>`;
}
function drawChart(r,rows,ms){
 const c=r.chart||'';
 if(/line/.test(c))    return lineChart(rows,ms);
 if(/scatter/.test(c)) return ms.length>=2?scatterChart(rows,ms):lineChart(rows,ms);
 return '';
}

/* 스킨에 데이터를 갈아 끼운다. 슬롯 순서대로 [라벨…, 값…] 을 넣고 남는 칸은 — 로 둔다. */
function renderSkin(tpl,rows,r,ms){
 try{
  const d=new DOMParser().parseFromString('<div id="w">'+tpl.html+'</div>','text/html');
  const root=d.getElementById('w').firstElementChild;
  const box=root.querySelector('[data-rows]'); if(!box) return '';
  const proto=box.firstElementChild.cloneNode(true); box.innerHTML='';
  rows.slice(0,30).forEach(rw=>{
   const el=proto.cloneNode(true);
   const labs=Array.isArray(rw[0])?rw[0]:[rw[0]];
   const vals=[...labs,...rw.slice(1)];
   el.querySelectorAll('[data-slot]').forEach(sl=>{
    const i=+sl.getAttribute('data-slot'), v=vals[i];
    sl.textContent = v==null?'—':(typeof v==='number'
      ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v));
   });
   box.appendChild(el);
  });
  const h=root.querySelector('[data-title]'); if(h) h.textContent=r.q[0];
  return root.outerHTML;
 }catch(e){ return ''; }
}
function paintSkin(html){
 const f=document.getElementById('skf'); if(!f||!html) return;
 f.srcdoc=`<!doctype html><meta charset="utf-8"><style>${SPEC.skincss}
  html,body{background:transparent;margin:0;padding:0;overflow:hidden}</style><body>${html}`;
 f.onload=()=>{ try{
   const d=f.contentDocument, el=d.body.firstElementChild;
   const w=el.scrollWidth||1200, h=el.scrollHeight||400;
   const pw=f.parentElement.clientWidth, sc=Math.min(pw/w,1);
   f.style.width=w+'px'; f.style.height=h+'px';
   f.style.transform=`scale(${sc})`; f.style.transformOrigin='top left';
   f.parentElement.style.height=(h*sc)+'px';
 }catch(e){} };
}
/* 리포트는 데이터를 보고 제미나이 프로가 쓴다. 숫자는 위 표에서 온 것만 쓰게 한다. */
let LAST=null;
/* 같은 레시피·같은 주목대상이면 글이 같다. 한 번 쓴 것은 다시 부르지 않는다. */
const RCACHE={};
function ckey(r,focus,deep){ return r.id+'|'+focus.join(',')+'|'+(deep?'d':'s'); }
async function writeReport(q,r,rows,ms,focus,routeCost,deep){
 const head=[...(Array.isArray(rows[0]?.[0])?rows[0][0].map((_,i)=>'축'+(i+1)):['이름']),
   ...ms.map(m=>(MET[m]||{}).n||m)].join('\t');
 const body=rows.slice(0,25).map(x=>[...(Array.isArray(x[0])?x[0]:[x[0]]),
   ...x.slice(1).map(v=>v==null?'':v)].join('\t')).join('\n');
 let rep=null, cost=null;
 const key=ckey(r,focus,deep);
 if(RCACHE[key]){ rep=RCACHE[key]; cost=null; }
 else{
  try{
   const res=await fetch('/api/bk21/report',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q, focus, deep:!!deep, data:head+'\n'+body,
                         caveats:(r.caveats||[]).join(' / ')})});
   const o=await res.json();
   if(o&&o.ok){ rep=o; RCACHE[key]=o; } cost=o&&o.cost;
  }catch(e){}
 }
 if(rep){
  const hl=document.getElementById('hl'); if(hl) hl.textContent=rep.headline;
  const pts=document.getElementById('pts');
  if(pts) pts.innerHTML=(rep.points||[]).map(t=>`<div class="pt">· ${esc(t)}</div>`).join('')
    +(rep.caution?`<div class="pt cau">! ${esc(rep.caution)}</div>`:'');
 }
 showCost(routeCost,cost);
}
async function narrate(deep){
 if(!LAST) return;
 const b1=document.getElementById('wr'), b2=document.getElementById('wrd');
 [b1,b2].forEach(b=>{if(b)b.disabled=true;});
 const t=(deep?b2:b1); const old=t?t.innerHTML:''; if(t) t.textContent='쓰는 중…';
 await writeReport(LAST.q,LAST.r,LAST.rows,LAST.ms,LAST.focus,LAST.routeCost,deep);
 [b1,b2].forEach(b=>{if(b)b.disabled=false;});
 if(t) t.innerHTML=old;
}
function showCost(a,b){
 const el=document.getElementById('cost'), w=document.getElementById('won');
 const list=[a,b].filter(Boolean);
 if(!list.length){
  if(w){ w.textContent='0원'; w.title='외부 모델을 부르지 않았습니다'; }
  if(el) el.textContent='이 답변 0원 · 미리 계산해 둔 표만 썼습니다';
  return; }
 const krw=list.reduce((s,c)=>s+(c.krw||0),0);
 const tok=list.reduce((s,c)=>s+(c.in||0)+(c.out||0)+(c.think||0),0);
 const won=krw<10?(Math.round(krw*10)/10):Math.round(krw);
 if(w){ w.textContent=won+'원'; w.title='이 답변 하나를 만드는 데 든 값'; }
 if(el) el.textContent='이 답변 '+won+'원 · 토큰 '+tok.toLocaleString()+' ('
  +list.map(c=>c.model.replace('gemini-2.5-','')+' '+((c.in||0)+(c.out||0)+(c.think||0))
    +'토큰 '+(c.krw<10?Math.round(c.krw*10)/10:Math.round(c.krw))+'원').join(' + ')+')';
}

/* ── 스텝2 · 보고서 ── */
function open(id,opt){
 opt=opt||{};
 const r=SPEC.recipes.find(x=>x.id===id), a=SPEC.answers[id];
 $('#step1').style.display='none';$('#step2').style.display='block';scrollTo(0,0);
 if(r.blocked||!a){
  $('#rep').innerHTML=`<div class="sec blk"><div class="sn">① 결론</div>
   <div class="concl">${r.q[0]}</div>
   <div class="lim"><div>이 질문은 지금 만들 수 없습니다.</div><div>${esc(r.blocked||'집계 결과가 없습니다')}</div></div>
   </div>`; return;}
 const FOCUS=(opt.focus||[]).filter(Boolean);
 const lab0=x=>Array.isArray(x[0])?x[0].join(' · '):String(x[0]);
 /* 질문이 콕 집은 대상이 있으면 그 줄만 남기고, 우리 학교를 늘 함께 둔다.
    없으면 거르지 않는다. 한 줄만 남으면 견줄 데가 없어 그대로 둔다. */
 let rows=a.rows;
 if(FOCUS.length){
  const want=[...FOCUS,ME];
  const hit=a.rows.filter(x=>want.some(w=>lab0(x).includes(w)));
  if(hit.length>=2) rows=hit;
 }
 const ms=a.measures, m0=MET[ms[0]]||{n:ms[0]};
 const lab=lab0;
 const val=(x,i)=>x[Array.isArray(x[0])?1+i:i];
 const nums=rows.map(x=>val(x,0)).filter(v=>typeof v==='number');
 const max=Math.max(...nums,0), sum=nums.reduce((p,c)=>p+c,0);
 const meIdx=rows.findIndex(x=>lab(x).includes(ME));

 // ① 결론 — 데이터에서 만든다. 축이 둘이면 순위를 말하지 않는다
 const low=(m0.d==='low');
 const most='가장 높고';
 let concl;
 if(rows.length===1){ concl=`${m0.n}${jo(m0.n,'은')} ${N(val(rows[0],0))}${m0.u||''}입니다`; }
 else if(a.cols.length>=2){
  const top=rows[0];
  concl=`${lab(top)}${jo(lab(top),'이')} ${m0.n} ${N(val(top,0))}${m0.u||''}${jo(m0.u||N(val(top,0)),'로')} ${a.n}칸 가운데 가장 큽니다`;
 }
 else if(meIdx>=0){ concl=`${ME}는 ${m0.n} ${N(val(rows[meIdx],0))}${m0.u||''}${jo(m0.u||N(val(rows[meIdx],0)),'로')} ${rows.length}곳 중 ${meIdx+1}위입니다`; }
 else { const top=rows[0], sh=sum?Math.round(val(top,0)/sum*100):0;
  const v0=N(val(top,0));
  concl=`${lab(top)}${jo(lab(top),'이')} ${m0.n} ${v0}${m0.u||''}${jo(m0.u||v0,'로')} ${most}`
   +(low?` 그다음이 ${lab(rows[1])}입니다`:` 전체의 ${sh}%입니다`); }

 // ② 근거 3개
 const ev=[];
 // low 는 위에서 정한다
 ev.push({l:m0.n+' 합계', v:N(sum), s:`${a.n}${a.cols.length>1?' 칸':'개'} 기준`});
 if(rows.length>1){ ev.push({l:'가장 큰 곳', v:lab(rows[0]), s:N(val(rows[0],0))+(m0.u||'')});
  const last=rows[rows.length-1];
  ev.push({l:low?'가장 큰 곳':'가장 작은 곳', v:lab(last), s:N(val(last,0))+(m0.u||'')}); }
 if(ms[1]){ const m1=MET[ms[1]]||{n:ms[1]};
  const v1=rows.map(x=>val(x,1)).filter(v=>typeof v==='number');
  if(v1.length) ev.push({l:m1.n, v:N(Math.round(v1.reduce((p,c)=>p+c,0)/v1.length*100)/100), s:'평균'}); }

 // ③ 그림
 let chart;
 if(rows.length<=3 && a.cols.length<=1){
  chart=`<table class="t"><tbody>${rows.map(x=>`<tr><td>${esc(lab(x))}</td>
   <td class="n">${N(val(x,0))}${m0.u||''}</td></tr>`).join('')}</tbody></table>`;
 } else if(a.cols.length>=2 || r.chart==='table' || r.chart==='heatmap'){
  chart=`<table class="t"><thead><tr>${a.cols.map(c=>`<th>${AXN[c]||c}</th>`).join('')}
   ${ms.map(m=>`<th>${(MET[m]||{}).n||m}</th>`).join('')}</tr></thead><tbody>
   ${rows.slice(0,25).map(x=>`<tr>${(Array.isArray(x[0])?x[0]:[x[0]]).map(v=>`<td>${esc(v)}</td>`).join('')}
    ${ms.map((m,i)=>`<td class="n">${N(val(x,i))}</td>`).join('')}</tr>`).join('')}
   </tbody></table>`;
 } else {
  chart=rows.slice(0,18).map(x=>{const v=val(x,0),w=max?Math.max(1,v/max*100):0;
   return `<div class="bar${lab(x).includes(ME)?' me':''}"><div class="nm">${esc(lab(x))}</div>
    <div class="tr"><div class="fl" style="width:${w}%"></div></div>
    <div class="vv">${N(v)}</div></div>`;}).join('');
 }
 const capped=a.capped?`<div class="lim"><div>· 행이 많아 상위 ${SPEC.cap}개만 냅니다 (전체 ${N(a.n)})</div></div>`:'';

 // ④ 한계  ⑤ 출처
 const lims=[...(r.caveats||[])];
 if(low) lims.unshift(`${m0.n}는 낮을수록 좋은 값입니다. 위 목록은 높은 순입니다`);
 const lim=lims.map(c=>`<div>· ${esc(c)}</div>`).join('')||'<div>· 따로 적어 둔 한계가 없습니다</div>';
 const fil=Object.entries(r.filters||{}).filter(([k,v])=>v&&v!=='*').map(([k,v])=>`${AXN[k]||k}=${v}`).join(', ');
 const line=`${SPEC.grains[r.nucleus]}[${r.axes.map(x=>AXN[x]).join(' × ')||'없음'}]`
  +(fil?` {${fil}}`:` {${SPEC.period.default}}`)
  +` → ${ms.map(m=>(MET[m]||{}).n||m).join(' · ')}`+(r.against?`  vs ${r.against}`:'');

 const skid=SPEC.skinmap[id], tpl=skid?SPEC.tpl[skid]:null;
 const skinHtml=tpl?renderSkin(tpl,rows,r,ms):'';
 /* 스킨이 SVG 라 글자 치환이 안 되면 같은 문법으로 다시 그린다 */
 const drawn=skinHtml?'':drawChart(r,rows,ms);
 $('#rep').innerHTML=`
 <div class="sec"><div class="sn">① 결론 <span class="won" id="won">계산 중</span></div>
   <div class="concl" id="hl">${esc(concl)}</div>
   <div id="pts"></div></div>
 ${drawn?`<div class="sec"><div class="sn">② 그림 · ${skid||r.chart} 다시 그림</div>
   <div class="chartbox">${drawn}</div>
   ${FOCUS.length?`<div class="foc">주목 대상 ${FOCUS.join(' · ')} 기준으로 ${rows.length}줄만 남겼습니다</div>`:''}
   </div>`:''}
 ${skinHtml?`<div class="sec"><div class="sn">② 답변 스킨 · ${skid}</div>
   <div class="skinwrap"><iframe id="skf" scrolling="no"></iframe></div>
   ${FOCUS.length?`<div class="foc">주목 대상 ${FOCUS.join(' · ')} 기준으로 ${rows.length}줄만 남겼습니다</div>`:''}
   </div>`:''}
 <div class="sec"><div class="sn">③ 근거</div><div class="ev">
   ${ev.slice(0,4).map(e=>`<div class="evi"><div class="l">${esc(e.l)}</div>
     <div class="v">${esc(e.v)}</div><div class="s">${esc(e.s)}</div></div>`).join('')}</div></div>
 <div class="sec"><div class="sn">④ ${/^<table/.test(chart)?'표':'그림'}</div><div class="chart">${chart}</div>${capped}</div>
 <div class="sec"><div class="sn">⑤ 한계</div><div class="lim">${lim}</div></div>
 <div class="sec"><div class="sn">⑥ 출처</div><div class="src">${esc(line)}</div>
   <div class="src">기준일 ${SPEC.built} · ${r.covered_by.length?'화면 '+r.covered_by.join(' · '):'화면에 없는 조합'}
    · <a href="/bk21/erd.html">데이터 구조 보기</a></div>
   <div class="src" id="cost"></div></div>
 <div class="acts">
   <button id="wr">문장으로 풀어 쓰기 <span class="tag2">약 1원</span></button>
   <button id="wrd" class="sec2">더 깊게 <span class="tag2">약 27원</span></button>
   <button onclick="print()">인쇄 · PDF</button>
   <button id="cp">복사</button>
   <button onclick="location.reload()">다른 질문</button>
 </div>`;
 paintSkin(skinHtml);
 showCost(opt.cost,null);
 LAST={q:opt.q||r.q[0],r,rows,ms,focus:FOCUS,routeCost:opt.cost};
 const w1=$('#wr'), w2=$('#wrd');
 if(w1) w1.onclick=()=>narrate(false);
 if(w2) w2.onclick=()=>narrate(true);
 const cp=$('#cp'); if(cp) cp.onclick=()=>{
  const t=`${concl}\n\n${line}\n기준일 ${SPEC.built}\n\n한계\n${(r.caveats||[]).map(c=>'- '+c).join('\n')}`;
  navigator.clipboard.writeText(t).then(()=>{cp.textContent='복사됨';setTimeout(()=>cp.textContent='복사',1400);});};
}
</script>
</body></html>
