<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>BK21 물어보기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b16;--ink:#e6edfb;--dim:#8ea3c9;--dim2:#647ba0;
 --line:rgba(120,160,235,.18);--card:rgba(20,31,58,.72);--acc:#5fd0c8;--gold:#f0b429;--warn:#e0864f}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
 font:15px/1.75 "Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:#7fa9e0}
.page{max-width:900px;margin:0 auto;padding:0 24px}

/* 스텝1 */
#step1{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:60px 0}
.kick{font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#5f7db3}
h1{margin-top:14px;font-size:31px;font-weight:800;letter-spacing:-.9px}
.askbox{margin-top:26px;display:flex;gap:10px}
.askbox input{flex:1;background:rgba(10,16,32,.8);border:1px solid var(--line);border-radius:13px;
 padding:16px 18px;color:var(--ink);font-size:16px;font-family:inherit;outline:none}
.askbox input:focus{border-color:rgba(95,208,200,.55)}
.askbox button{background:rgba(95,208,200,.15);border:1px solid rgba(95,208,200,.5);color:#adeae4;
 border-radius:13px;padding:0 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.askbox button:hover{background:rgba(95,208,200,.25)}
.lbl{margin-top:30px;font:800 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#7796c9}
.qlist{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.qi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 17px;
 cursor:pointer;font-size:15px;font-weight:600;transition:border-color .15s,background .15s}
.qi:hover{border-color:rgba(95,208,200,.5);background:rgba(28,42,78,.8)}
.more{margin-top:12px;background:none;border:none;color:#7fa9e0;font:600 13.5px/1 inherit;
 cursor:pointer;padding:6px 0}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
 font:600 11.5px/1.8 ui-monospace,Menlo,monospace;color:#5f7db3}

/* 스텝2 */
#step2{display:none;padding:34px 0 80px}
.back{background:none;border:none;color:#7fa9e0;font:600 13.5px/1 inherit;cursor:pointer;padding:6px 0}
.rep{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sec{padding:22px 24px;border-bottom:1px solid rgba(120,160,235,.12)}
.sec:last-child{border-bottom:none}
.sn{font:800 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:#7796c9}
.won{margin-left:9px;font:800 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.04em;
 color:var(--gold);background:rgba(240,180,41,.13);border:1px solid rgba(240,180,41,.35);
 border-radius:6px;padding:4px 8px;vertical-align:1px}
.concl{margin-top:11px;font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.5}
.ev{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.evi{background:rgba(10,16,32,.7);border:1px solid var(--line);border-radius:11px;padding:11px 15px;min-width:140px}
.evi .l{font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;color:var(--dim2)}
.evi .v{margin-top:6px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.evi .s{margin-top:4px;font-size:11.5px;color:var(--dim)}
.chart{margin-top:13px}
.bar{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;margin-bottom:6px;font-size:13.5px}
.bar .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{background:rgba(10,16,32,.7);border-radius:5px;height:19px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,rgba(95,208,200,.75),rgba(95,208,200,.35))}
.bar.me .nm{color:var(--gold);font-weight:700}
.bar.me .fl{background:linear-gradient(90deg,rgba(240,180,41,.8),rgba(240,180,41,.35))}
.bar .vv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
table.t th{text-align:left;font:800 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.13em;
 color:var(--dim2);padding:0 12px 9px 0;border-bottom:1px solid var(--line)}
table.t td{padding:9px 12px 9px 0;border-bottom:1px solid rgba(120,160,235,.08);color:var(--dim)}
table.t td:first-child{color:var(--ink);font-weight:600}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.lim{margin-top:10px;font-size:13.5px;color:#d3a566;line-height:1.75}
.lim div{margin-bottom:3px}
.src{margin-top:10px;font:600 12.5px/1.9 ui-monospace,Menlo,monospace;color:var(--dim2);word-break:break-all}
.acts{padding:18px 24px;display:flex;gap:9px;flex-wrap:wrap;background:rgba(10,16,32,.5)}
.acts button{background:rgba(20,31,58,.9);border:1px solid var(--line);color:var(--ink);
 border-radius:10px;padding:10px 16px;font:600 13.5px/1 inherit;cursor:pointer}
.acts button:hover{border-color:rgba(95,208,200,.5)}
.acts button:disabled{opacity:.5;cursor:default}
.acts button.sec2{color:var(--dim)}
.tag2{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--gold);
 background:rgba(240,180,41,.12);border-radius:5px;padding:3px 6px;margin-left:5px}
.pt{margin-top:8px;font-size:14.5px;color:var(--dim);line-height:1.7}
.pt.cau{color:#d3a566;margin-top:11px}
.skinwrap{margin-top:12px;position:relative;overflow:hidden;border-radius:10px;
 background:#0a0f1d;border:1px solid var(--line)}
.skinwrap iframe{border:0;display:block;background:transparent}
.foc{margin-top:9px;font-size:12.5px;color:var(--acc)}
.chartbox{margin-top:12px;background:#0a0f1d;border:1px solid var(--line);border-radius:10px;padding:14px}
.chartbox svg{--grid:rgba(120,160,235,.14);--dim2:#8ea3c9;
 --u1:#5fd0c8;--u2:#7aa2f7;--u3:#f0b429;--u4:#c99bf5;--u5:#6fd08c;--u6:#f08a7a;--u7:#8fb4e8}
.legend{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.legend .lg{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
.axl{margin-top:9px;font-size:12px;color:var(--dim2)}
.blk{border-color:rgba(224,134,79,.45)}
.blk .concl{color:#f0a877}
@media (max-width:640px){
 h1{font-size:25px}.askbox{flex-direction:column}.askbox button{padding:14px}
 .bar{grid-template-columns:104px 1fr 66px;font-size:12.5px}
 .concl{font-size:17px}}
</style></head><body>

<div id="step1" class="page">
  <div class="kick">BIBLO · BK21</div>
  <h1>무엇이 궁금하십니까</h1>
  <div class="askbox">
    <input id="q" placeholder="예) 어느 학과가 처져 있나" autocomplete="off">
    <button id="go">묻기</button>
  </div>
  <div class="lbl">자주 묻는 것</div>
  <div class="qlist" id="front"></div>
  <button class="more" id="more">더 보기</button>
  <div class="qlist" id="rest" style="display:none"></div>
  <div class="foot" id="meta"></div>
</div>

<div id="step2" class="page">
  <button class="back" id="back">← 다시 묻기</button>
  <div class="rep" id="rep"></div>
</div>

const $=s=>document.querySelector(s);
const N=v=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:2}):v);
const MET=SPEC.metrics, AXN=SPEC.axes;
/* 받침이 있으면 은/이/을, 없으면 는/가/를 */
const DIGJONG={'0':1,'1':1,'2':0,'3':1,'4':0,'5':0,'6':1,'7':1,'8':1,'9':0};
const DIGRIEUL={'1':1,'7':1,'8':1};
function jo(w,kind){
 const t=String(w).trim(), last=t.slice(-1);
 if(/[0-9]/.test(last)){
  if(kind==='로') return DIGRIEUL[last]||!DIGJONG[last]?'로':'으로';
  const h=DIGJONG[last];
  return kind==='은'?(h?'은':'는'):kind==='이'?(h?'이':'가'):(h?'을':'를');
 }
 const c=t.slice(-1).charCodeAt(0);
 const has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28)!==0:true;
 if(kind==='로'){ // ㄹ 받침이면 '로', 그 밖의 받침이면 '으로'
  if(c<0xAC00||c>0xD7A3) return '로';
  const j=(c-0xAC00)%28; return (j===0||j===8)?'로':'으로'; }
 return kind==='은'?(has?'은':'는'):kind==='이'?(has?'이':'가'):(has?'을':'를');
}
const OK=SPEC.recipes.filter(r=>!r.blocked && SPEC.answers[r.id]);
const ME='성균관대';

$('#front').innerHTML=SPEC.front.map(id=>SPEC.recipes.find(r=>r.id===id)).filter(Boolean).map(qcard).join('');
$('#rest').innerHTML=OK.filter(r=>!SPEC.front.includes(r.id)).map(qcard).join('');
$('#more').onclick=()=>{const e=$('#rest');const on=e.style.display==='none';
 e.style.display=on?'flex':'none';$('#more').textContent=on?'접기':'더 보기';};

 +` · 답할 수 있는 질문 ${OK.length}개`;
document.addEventListener('click',e=>{const c=e.target.closest('.qi');if(c)open(c.dataset.id);});

/* 질문 → 레시피. 서버가 LLM 으로 고르고, 안 되면 낱말 겹침으로 돌아간다.
   LLM 은 id 하나만 고른다. 숫자와 결론 문장은 아래에서 데이터로 만든다. */
let BUSY=false;
async function route(t){
 if(!t||BUSY) return;
 BUSY=true; const btn=$('#go'), old=btn.textContent; btn.textContent='찾는 중'; btn.disabled=true;
 try{
  const menu=OK.map(r=>({id:r.id,q:r.q[0]}));
  const res=await fetch('/api/bk21/ask',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({q:t,menu})});
  const o=await res.json();
  if(o&&o.ok&&o.id&&SPEC.answers[o.id]){ open(o.id,{focus:o.focus||[],q:t,cost:o.cost}); return; }
 }catch(e){}
 finally{ BUSY=false; btn.textContent=old; btn.disabled=false; }
 ask(t);
}

/* 질문 문장을 레시피로 — 낱말 겹침으로 고른다. 에이전트가 붙으면 이 자리가 바뀐다 */
/* 흔해서 변별력이 없는 낱말. 이것만 겹치면 아무 데나 걸린다 */
const STOP=new Set(['어느','어떤','무엇','누가','얼마나','많이','쓰나','있나','되나','인가',
 '우리','지금','최근','정도','어디','그리고','하는','한가','좋은','논문','대학','학과']);
function ask(t){
 if(!t) return;
 const toks=t.replace(/[^가-힣a-zA-Z0-9 ]/g,' ').split(/\s+/)
   .filter(w=>w.length>1 && !STOP.has(w));
 if(!toks.length){ noMatch(t); return; }
 let best=null,bs=0;
 for(const r of SPEC.recipes){
  if(r.blocked||!SPEC.answers[r.id]) continue;
  const q=r.q.join(' ').toLowerCase();
  const side=(r.axes.map(a=>AXN[a]).join(' ')+' '
   +r.measures.map(m=>(MET[m]||{}).n||'').join(' ')+' '
   +Object.values(r.filters||{}).join(' ')).toLowerCase();
  let s=0;
  toks.forEach(w=>{const lw=w.toLowerCase();
   if(q.includes(lw)) s+=w.length*3; else if(side.includes(lw)) s+=w.length*2;});
  if(s>bs){bs=s;best=r;}
 }
 if(!best||bs<5){ noMatch(t); return; }
 open(best.id);
}

 $('#step1').style.display='none';$('#step2').style.display='block';scrollTo(0,0);

  <div class="concl">이 질문에 맞는 레시피가 아직 없습니다</div>
  <div class="lim"><div>물으신 것: ${esc(t)}</div>
   <div>지금 답할 수 있는 질문 ${OK.length}개는 앞 화면에 있습니다.</div></div></div>
  <div class="sec"><div class="sn">원자가 없어 못 만드는 것</div>
   <table class="t"><thead><tr><th>못 만드는 것</th><th>무엇이 오면 되나</th></tr></thead><tbody>
   ${SPEC.uncollected.map(u=>`<tr><td>${u.name}</td><td>${u.need}</td></tr>`).join('')}
   </tbody></table></div>`;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));


/* ── 그림을 다시 그린다 ──
   선그래프·산점도는 숫자가 글자가 아니라 좌표에 들어 있다. 글자만 갈아 끼워서는 안 되고
   선을 다시 그려야 한다. 보드 원본과 같은 문법으로 낸다.
   틀: viewBox 0 0 560 310 · 격자 5줄 · x 52~496 · y 278~16 · 계열색 --u1..u7 */
const CH={x0:52,x1:496,y0:278,y1:16,W:560,H:310};
const nfmt=v=>v>=10000?Math.round(v/1000)+'천':v>=1000?(v/1000).toFixed(1)+'천':
  (Math.round(v*100)/100).toLocaleString();
function chartShell(inner,h){
 return `<svg viewBox="0 0 ${CH.W} ${h||CH.H}" style="width:100%;height:auto;display:block">${inner}</svg>`;
}
function gridY(min,max,n){
 let g='';
 for(let i=0;i<=n;i++){
  const y=CH.y1+(CH.y0-CH.y1)*i/n, v=max-(max-min)*i/n;
  g+=`<line x1="${CH.x0}" y1="${y.toFixed(1)}" x2="${CH.x1}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`
   +`<text x="${CH.x0-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--dim2)">${nfmt(v)}</text>`;
 }
 return g;
}
/* 연도별 선그래프 — 첫 라벨이 계열, 둘째 라벨이 연도 */
function lineChart(rows,ms){
 const two=Array.isArray(rows[0]?.[0])&&rows[0][0].length>=2;
 const ser={}, xs=[];
 rows.forEach(r=>{
  const L=Array.isArray(r[0])?r[0]:[r[0]];
  const name=two?L[0]:(ms[0]||'값'), x=two?L[1]:L[0], v=r[1];
  if(v==null) return;
  (ser[name]=ser[name]||[]).push([x,+v]);
  if(!xs.includes(x)) xs.push(x);
 });
 xs.sort();
 const names=Object.keys(ser).slice(0,7);
 if(!names.length||xs.length<2) return '';
 let max=0,min=0;
 names.forEach(n=>ser[n].forEach(([,v])=>{if(v>max)max=v;}));
 if(!max) return '';
 const X=x=>CH.x0+(CH.x1-CH.x0)*(xs.indexOf(x)/(xs.length-1));
 const Y=v=>CH.y0-(CH.y0-CH.y1)*((v-min)/(max-min||1));
 let g=gridY(min,max,4);
 xs.forEach(x=>{ g+=`<text x="${X(x).toFixed(1)}" y="293" text-anchor="middle" font-size="10" fill="var(--dim2)">${x}</text>`; });
 names.forEach((n,i)=>{
  const pts=ser[n].slice().sort((a,b)=>xs.indexOf(a[0])-xs.indexOf(b[0]));
  const d=pts.map((q,k)=>(k?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
  const col=`var(--u${(i%7)+1},#5fd0c8)`;
  g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(q=>{ g+=`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3" fill="${col}"><title>${esc(n)} ${q[0]} ${nfmt(q[1])}</title></circle>`; });
 });
 const leg=names.map((n,i)=>`<span class="lg"><i style="background:var(--u${(i%7)+1},#5fd0c8)"></i>${esc(n)}</span>`).join('');
 return chartShell(g)+`<div class="legend">${leg}</div>`;
}
/* 산점도 — 값 두 개 */
function scatterChart(rows,ms){
 const pts=rows.map(r=>({n:Array.isArray(r[0])?r[0].join(' '):String(r[0]),x:+r[1],y:+r[2]}))
   .filter(p=>isFinite(p.x)&&isFinite(p.y));
 if(pts.length<2) return '';
 const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
 const xmax=Math.max(...xs)||1, ymax=Math.max(...ys)||1;
 const X=v=>CH.x0+(CH.x1-CH.x0)*(v/xmax), Y=v=>CH.y0-(CH.y0-CH.y1)*(v/ymax);
 let g=gridY(0,ymax,4);
 for(let i=0;i<=4;i++){ const v=xmax*i/4;
  g+=`<text x="${X(v).toFixed(1)}" y="293" text-anchor="middle" font-size="10" fill="var(--dim2)">${nfmt(v)}</text>`; }
 pts.slice(0,60).forEach(p=>{
  const me=p.n.includes(ME);
  g+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${me?6:4.5}" `
   +`fill="${me?'var(--gold,#f0b429)':'var(--u1,#5fd0c8)'}" fill-opacity="${me?1:.72}">`
   +`<title>${esc(p.n)} ${nfmt(p.x)} / ${nfmt(p.y)}</title></circle>`;
  if(me) g+=`<text x="${(X(p.x)+9).toFixed(1)}" y="${(Y(p.y)+4).toFixed(1)}" font-size="10.5" fill="var(--gold,#f0b429)">${esc(p.n)}</text>`;
 });
 const lx=(MET[ms[0]]||{}).n||ms[0], ly=(MET[ms[1]]||{}).n||ms[1];
 return chartShell(g)+`<div class="axl">가로 ${esc(lx)} · 세로 ${esc(ly)}</div>`;
}
function drawChart(r,rows,ms){
 const c=r.chart||'';
 if(/line/.test(c))    return lineChart(rows,ms);
 if(/scatter/.test(c)) return ms.length>=2?scatterChart(rows,ms):lineChart(rows,ms);
 return '';
}

/* 스킨에 데이터를 갈아 끼운다. 슬롯 순서대로 [라벨…, 값…] 을 넣고 남는 칸은 — 로 둔다. */
function renderSkin(tpl,rows,r,ms){
 try{
  const d=new DOMParser().parseFromString('<div id="w">'+tpl.html+'</div>','text/html');
  const root=d.getElementById('w').firstElementChild;
  const box=root.querySelector('[data-rows]'); if(!box) return '';
  const proto=box.firstElementChild.cloneNode(true); box.innerHTML='';
  rows.slice(0,30).forEach(rw=>{
   const el=proto.cloneNode(true);
   const labs=Array.isArray(rw[0])?rw[0]:[rw[0]];
   const vals=[...labs,...rw.slice(1)];
   el.querySelectorAll('[data-slot]').forEach(sl=>{
    const i=+sl.getAttribute('data-slot'), v=vals[i];
    sl.textContent = v==null?'—':(typeof v==='number'
      ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : String(v));
   });
   box.appendChild(el);
  });
  const h=root.querySelector('[data-title]'); if(h) h.textContent=r.q[0];
  return root.outerHTML;
 }catch(e){ return ''; }
}
function paintSkin(html){
 const f=document.getElementById('skf'); if(!f||!html) return;
 /* 카드가 감싸는 칸 너비를 그대로 쓴다. 먼저 폭을 정하고 그다음 높이를 잰다 (폭을 안 정하면 카드가 내용만큼 줄어든다) */
 const pw=f.parentElement.clientWidth||900;
 f.style.width=pw+'px'; f.style.transform=''; f.style.height='420px';
 f.srcdoc=`<!doctype html><html data-theme="dark"><meta charset="utf-8"><style>${SPEC.skincss}
  html,body{background:transparent;margin:0;padding:0;overflow:hidden} body{width:${pw}px} body>.ecard{width:100%;box-sizing:border-box;margin:0}</style><body>${html}`;
 f.onload=()=>{ try{
   const d=f.contentDocument, el=d.body.firstElementChild;
   const h=(el.scrollHeight||400)+2;
   f.style.height=h+'px'; f.parentElement.style.height=h+'px';
 }catch(e){} };
}
/* 리포트는 데이터를 보고 제미나이 프로가 쓴다. 숫자는 위 표에서 온 것만 쓰게 한다. */
let LAST=null;
/* 같은 레시피·같은 주목대상이면 글이 같다. 한 번 쓴 것은 다시 부르지 않는다. */
const RCACHE={};
function ckey(r,focus,deep){ return r.id+'|'+focus.join(',')+'|'+(deep?'d':'s'); }
async function writeReport(q,r,rows,ms,focus,routeCost,deep){
 const head=[...(Array.isArray(rows[0]?.[0])?rows[0][0].map((_,i)=>'축'+(i+1)):['이름']),
   ...ms.map(m=>(MET[m]||{}).n||m)].join('\t');
 const body=rows.slice(0,25).map(x=>[...(Array.isArray(x[0])?x[0]:[x[0]]),
   ...x.slice(1).map(v=>v==null?'':v)].join('\t')).join('\n');
 let rep=null, cost=null;
 const key=ckey(r,focus,deep);
 if(RCACHE[key]){ rep=RCACHE[key]; cost=null; }
 else{
  try{
   const res=await fetch('/api/bk21/report',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q, focus, deep:!!deep, data:head+'\n'+body,
                         caveats:(r.caveats||[]).join(' / ')})});
   const o=await res.json();
   if(o&&o.ok){ rep=o; RCACHE[key]=o; } cost=o&&o.cost;
  }catch(e){}
 }
 if(rep){
  const hl=document.getElementById('hl'); if(hl) hl.textContent=rep.headline;
  const pts=document.getElementById('pts');
  if(pts) pts.innerHTML=(rep.points||[]).map(t=>`<div class="pt">· ${esc(t)}</div>`).join('')
    +(rep.caution?`<div class="pt cau">! ${esc(rep.caution)}</div>`:'');
 }
 showCost(routeCost,cost);
}
async function narrate(deep){
 if(!LAST) return;
 const b1=document.getElementById('wr'), b2=document.getElementById('wrd');
 [b1,b2].forEach(b=>{if(b)b.disabled=true;});
 const t=(deep?b2:b1); const old=t?t.innerHTML:''; if(t) t.textContent='쓰는 중…';
 await writeReport(LAST.q,LAST.r,LAST.rows,LAST.ms,LAST.focus,LAST.routeCost,deep);
 [b1,b2].forEach(b=>{if(b)b.disabled=false;});
 if(t) t.innerHTML=old;
}
function showCost(a,b){
 const el=document.getElementById('cost'), w=document.getElementById('won');
 const list=[a,b].filter(Boolean);
 if(!list.length){
  if(w){ w.textContent='0원'; w.title='외부 모델을 부르지 않았습니다'; }
  if(el) el.textContent='이 답변 0원 · 미리 계산해 둔 표만 썼습니다';
  return; }
 const krw=list.reduce((s,c)=>s+(c.krw||0),0);
 const tok=list.reduce((s,c)=>s+(c.in||0)+(c.out||0)+(c.think||0),0);
 const won=krw<10?(Math.round(krw*10)/10):Math.round(krw);
 if(w){ w.textContent=won+'원'; w.title='이 답변 하나를 만드는 데 든 값'; }
 if(el) el.textContent='이 답변 '+won+'원 · 토큰 '+tok.toLocaleString()+' ('
  +list.map(c=>c.model.replace('gemini-2.5-','')+' '+((c.in||0)+(c.out||0)+(c.think||0))
    +'토큰 '+(c.krw<10?Math.round(c.krw*10)/10:Math.round(c.krw))+'원').join(' + ')+')';
}

/* ── 위젯 엔진 (board/_src/spec/widget.js 를 build_ask.py 가 여기 박는다) ── */
/*WIDGET_START*/
/* ══════════════════════════════════════════════════════════════════
   답변 위젯 엔진 (CMS형 답변).

   위젯 = 그래프형 (widgets.json 의 widgets). 데이터 모양이 정한다.
   의도 = 정렬·강조·결론 규칙 (widgets.json 의 intents). 질문이 정한다.

   WIDGET.build(recipe, answer, cx) →
     { widget, intent, headline, points[], kpi[{l,v,s}], fig(html), table(html), lims[] }

   fig 는 보드 CSS 문법으로 그린 HTML 이다. iframe 안에서 보드 CSS 와 같이 그린다.
   cx = { me:'성균관대', focus:[…], M:id→{n,u,d}, AX:id→이름, W:widgets, I:intents }
   ══════════════════════════════════════════════════════════════════ */
const WIDGET = (() => {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const N = v => v == null ? '—' : (typeof v === 'number'
    ? v.toLocaleString(undefined, { maximumFractionDigits: v >= 100 ? 0 : 2 }) : String(v));
  const labs = r => Array.isArray(r[0]) ? r[0] : [r[0]];
  const lab = r => labs(r).join(' · ');
  const val = (r, i) => { const v = r[1 + (i || 0)]; return typeof v === 'number' ? v : null; };
  const nums = (rows, i) => rows.map(r => val(r, i)).filter(v => v != null);
  const sum = a => a.reduce((s, v) => s + v, 0);
  const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  const sgn = v => (v >= 0 ? '+' : '') + v;
  const X = v => N(v >= 10 ? Math.round(v) : v >= 3 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100);   /* 배수: 10 이상 정수, 3 이상 소수 1자리, 그 밑 2자리 */
  const dv = v => v == null ? v : v >= 100 ? Math.round(v) : Math.round(v * 100) / 100;   /* 표에 보이는 값 (N 과 같은 자릿수) */
  const RX = (a, b) => X(dv(a) / dv(b));   /* 배수는 표에 보이는 값끼리 나눈다 */
  const median = a => { const v = a.slice().sort((x,y) => x-y), n = v.length; return !n ? null : n % 2 ? v[(n-1)/2] : (v[n/2-1] + v[n/2]) / 2; };
  const TABLE_N = 30;
  const isMeIn = (rows, cx) => rows.slice(TABLE_N).some(r => isMe(r, cx));   /* 우리 줄이 표 밖에 있어 끝에 붙는가 */   /* 표·가로막대가 보여 주는 줄 수 */
  const YEAR = /^(19|20)\d\d$/;
  const PAL = ['--u1','--u2','--u3','--u4','--u5','--u6','--u7'];
  const col = i => `var(${PAL[i % PAL.length]})`;
  /* 받침에 따라 조사를 고른다 */
  const jo = (w, k) => {
    const t = String(w).trim().replace(/\s*\([^()]*\)$/, '').trim(), c = t.slice(-1);
    let h = false;
    if (/[0-9]/.test(c)) h = '013678'.includes(c);
    else if (c === '%') h = false;
    else if (/[가-힣]/.test(c)) h = ((c.charCodeAt(0) - 0xAC00) % 28) !== 0;
    else if (/[A-Za-z]/.test(c)) {
      const prev = t.slice(-2, -1);
      if (!/[A-Za-z]/.test(prev)) h = /[lmnr]/i.test(c);            /* 낱글자 P·S·L… 는 읽는 소리대로 */
      else if (/e/i.test(c)) h = /[nml]/i.test(prev);                /* 묵음 e: Medicine → 메디슨 */
      else h = /(n|m|l|ng|k|p|t)$/i.test(t);                      /* 우리말로 읽을 때 받침이 남는 끝소리만 */
    }
    const l = /[가-힣]/.test(c) && (c.charCodeAt(0) - 0xAC00) % 28 === 8;
    return k === '은' ? (h?'은':'는') : k === '이' ? (h?'이':'가') : k === '과' ? (h?'과':'와') : k === '로' ? (h && !l ? '으로' : '로') : (h?'을':'를');
  };
  const U = m => (m && m.u) ? m.u : '';
  const vu = (v, m) => N(v) + U(m);

  /* 축별로 세는 말: 학과·대학은 곳, 쌍은 쌍, 분야·저널은 개 */
  const ORG = { dept: { w:'곳', n:'곳' }, uni: { w:'곳', n:'곳' }, grp: { w:'곳', n:'곳' }, pair: { w:'쌍', n:'쌍' },
                f: { w:'개', n:'분야' }, j: { w:'개', n:'저널' }, g: { w:'개', n:'등급' }, gy: { w:'개', n:'계열' },
                r: { w:'개', n:'역할' }, tr: { w:'개', n:'등급' }, kind: { w:'개', n:'구분' }, _: { w:'개', n:'것' } };
  /* ── 모양 읽기 ─────────────────────────────────────────── */
  function shape(a, cx) {
    const rows = a.rows, cols = a.cols.length;
    const ycol = [...Array(cols).keys()].find(i => rows.length && rows.every(r => YEAR.test(String(labs(r)[i]))));
    const other = [...Array(cols).keys()].filter(i => i !== ycol);
    const m0 = cx.M(a.measures[0]);
    return { cols, ycol: ycol ?? null, gcol: other[0] ?? null, icol: other[1] ?? null,
      years: ycol != null ? [...new Set(rows.map(r => labs(r)[ycol]))].sort() : [],
      count: /^(편|건|명|개|곳|회)$/.test(U(m0)), d: m0.d || 'high',
      w: (ORG[a.cols[other[0] ?? 0]] || ORG._).w, wn: (ORG[a.cols[other[0] ?? 0]] || ORG._).n };
  }
  /* 2축 → 첫 축(또는 지정 축)으로 접는다 */
  function fold(rows, k) {
    if (!rows.length || labs(rows[0]).length < 2) return rows;
    const acc = new Map();
    rows.forEach(r => {
      const key = labs(r)[k || 0], cur = acc.get(key) || [[key], 0, 0];
      for (let i = 0; i < 2; i++) { const v = val(r, i); if (v != null) cur[1 + i] += v; }
      acc.set(key, cur);
    });
    return [...acc.values()];
  }
  /* 연도 축 기준 계열 분리 → Map(계열 → [[연도, 값]…]) */
  function series(rows, sh, mi) {
    if (sh.ycol == null) return null;
    const g = new Map();
    rows.forEach(r => {
      const s = sh.gcol != null ? labs(r)[sh.gcol] : '전체', y = labs(r)[sh.ycol], v = val(r, mi || 0);
      if (v == null) return;
      (g.get(s) || g.set(s, []).get(s)).push([y, v]);
    });
    g.forEach(a => a.sort((x, y) => String(x[0]).localeCompare(String(y[0]))));
    return g;
  }
  const rate = a => a.length < 2 || !a[0][1] ? null : Math.round((a[a.length-1][1] - a[0][1]) / a[0][1] * 1000) / 10;
  const desc = (rows, i) => rows.filter(r => val(r, i) != null).sort((a, b) => val(b, i) - val(a, i));
  const asc  = (rows, i) => rows.filter(r => val(r, i) != null).sort((a, b) => val(a, i) - val(b, i));
  const isMe = (r, cx) => lab(r).includes(cx.me);
  /* 같은 값은 같은 등수(1224식). 공동이면 '공동 N위' */
  const crank = (vals, v) => vals.filter(x => x > v).length + 1;
  const cties = (vals, v) => vals.filter(x => x === v).length - 1;
  const rkw = (vals, v) => `${cties(vals, v) > 0 ? '공동 ' : ''}${crank(vals, v)}위`;
  /* 규모(분모) 열: 첫 값 지표의 size 가 가리키는 지표가 값 열에 있으면 그 열 번호, 없으면 -1 */
  const sizeCol = (ms, sh, cx) => { const sz = cx.M(ms[0]).s; if (!sz) return -1; const ax = sh.a && sh.a.cols ? sh.a.cols[0] : null; const sid = (ax && sz[ax]) || sz['*']; return sid ? ms.indexOf(sid) : -1; };
  const szName = m => (m.n || '').replace(/\s+수$/, '');   /* '참여자 수' → 참여자. '참여교수'는 그대로 */
  /* 1인당 값 = 값 ÷ 규모. 규모 0·없음은 뺀다. 높은 순 */
  const perCap = (rows, j) => rows.map(r => { const v = val(r, 0), z = val(r, j); return { r, pc: v != null && z ? Math.round(v / z * 10) / 10 : null }; }).filter(x => x.pc != null).sort((a, b) => b.pc - a.pc);
  /* 콕 집은 항목의 이름: 이름 + (항목들) */
  const pickName = pk => !pk || !pk.i ? '' : pk.name ? (pk.i.length > 1 && pk.i.every(x => !pk.name.includes(x)) ? `${pk.name}(${pk.i.join('·')})` : pk.name) : pk.i.join('·');
  /* 1인당 단위: 규모가 '명'이면 값 단위만 (편/명 → 편) */
  const pcU = (m0, sz) => U(sz) === '명' ? U(m0) : `${U(m0)}/${U(sz)}`;

  /* ── 의도: 계산 규칙 ───────────────────────────────────── */
  const INT = {};

  INT.rank_me = (rows, ms, sh, cx) => {
    const m0 = cx.M(ms[0]), s = desc(rows, 0), i = s.findIndex(r => isMe(r, cx));
    if (i < 0) return INT.rank(rows, ms, sh, cx);
    const mv = val(s[i], 0), tv = val(s[0], 0), P = [], K = [], lims = [], vs0 = nums(s, 0);
    const MR = (sh.a && sh.a.me_rank) || null, rk0 = MR && MR[0] ? MR[0] : [crank(vs0, mv), s.length, cties(vs0, mv)];
    const tie0 = rk0[2] || 0, tied = tie0 ? s.filter(r => !isMe(r, cx) && val(r,0) === mv).map(lab) : [];
    const rkS = `${tie0 ? '공동 ' : ''}${rk0[0]}위`;
    K.push({ l: '우리 자리', v: rkS, s: tie0 ? `${rk0[1]}${sh.w} 중 · ${tied.slice(0,2).join('·')}${tied.length > 2 ? ' 등' : ''}${jo(tied[0],'과')} 같은 값` : `${rk0[1]}${sh.w} 중` });
    if (tie0) P.push(`${tied.slice(0,3).join(' · ')}${tied.length > 3 ? ` 등 ${tied.length}${sh.w}` : ''}${jo(tied[0],'과')} 같은 값입니다.`);
    if (rk0[0] > 1) { P.push(tv/mv < 1.05 ? `1위 ${lab(s[0])} ${vu(tv,m0)}, 우리와 거의 같습니다.` : `1위 ${lab(s[0])} ${vu(tv,m0)}, 우리의 ${RX(tv,mv)}배입니다.`); K.push({ l: '1위와 격차', v: `${RX(tv,mv)}배`, s: lab(s[0]) }); }
    else if (!tie0 && s[1]) { P.push(`2위 ${lab(s[1])} ${vu(val(s[1],0),m0)}보다 ${RX(mv,val(s[1],0))}배 앞섭니다.`); K.push({ l: '2위와 격차', v: `${RX(mv,val(s[1],0))}배`, s: lab(s[1]) }); }
    if (!MR) { if (i > 0) P.push(`바로 위 ${lab(s[i-1])} ${vu(val(s[i-1],0),m0)}.`);
      if (i < s.length-1) P.push(`바로 아래 ${lab(s[i+1])} ${vu(val(s[i+1],0),m0)}.`); }
    if (ms.length > 1) {
      const rk = ms.map((id, k) => { const o = desc(rows, k), j = o.findIndex(r => isMe(r, cx)), v = j >= 0 ? val(o[j], k) : null; return { id, n: cx.M(id).n, r: (MR && MR[k]) ? MR[k][0] : (v == null ? 0 : crank(nums(o, k), v)), t: (MR && MR[k]) ? (MR[k][2] || 0) : (v == null ? 0 : cties(nums(o, k), v)), v, m: cx.M(id), c: (MR && MR[k]) ? MR[k][1] : nums(o, k).length, miss: (MR && MR[k]) ? [] : rows.filter(r => val(r, k) == null).map(lab) }; }).filter(x => x.v != null);   /* 상한에 걸린 목록은 전체 모수(me_rank)를 쓴다 */
      const best = rk.slice().sort((a,b) => a.r-b.r)[0], worst = rk.slice().sort((a,b) => b.r-a.r)[0];
      if (best.r !== worst.r) { P.push(`다른 지표로는 ${rk.filter(x => x.id !== ms[0]).slice(0,8).map(x => `${x.n} ${x.t ? '공동 ' : ''}${x.r}위(${vu(x.v,x.m)}${x.c !== rk0[1] ? ` · ${x.c}${sh.w} 중` : ''})`).join(' · ')}.`);
        K.push({ l: '지표 바꾸면', v: `${best.r}~${worst.r}위`, s: `${best.n} ↔ ${worst.n}` }); }
      else K.push({ l: '지표 바꿔도', v: `${best.r}위`, s: `${ms.length}개 지표 모두` });
      rk.filter(x => x.miss.length).forEach(x => lims.push(`${x.n} 값이 없는 ${x.miss.length}${sh.w}(${x.miss.slice(0,3).join(' · ')}${x.miss.length > 3 ? ' 등' : ''})${jo(sh.w,'은')} ${x.n} 순위에서 뺐습니다.`));   /* 결측은 그 지표의 모수에서 빠진다 */
